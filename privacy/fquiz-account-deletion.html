  section,.card {

  li { margin:8px 0; padding-left:4px; }

  .button {

    const supported = Object.keys(translations);
    const params = new URLSearchParams(window.location.search);
    const requested = (params.get("lang") || localStorage.getItem("fquiz-account-language") || navigator.language || "en").toLowerCase().split(/[-_]/)[0];
    const languageSelect = document.getElementById("languageSelect");

    function section(title, body) {
      return `<section><h2>${title}</h2>${body}</section>`;
    }

    function list(items, ordered = false) {
      const tag = ordered ? "ol" : "ul";
      return `<${tag}>${items.map((item) => `<li>${item}</li>`).join("")}</${tag}>`;
    }

    function render(language) {
      const lang = supported.includes(language) ? language : "en";
      const t = translations[lang];
      document.documentElement.lang = lang;
      document.title = `${t.title} - F Quiz`;
      languageSelect.value = lang;
      languageSelect.setAttribute("aria-label", t.eyebrow);
      document.getElementById("eyebrow").textContent = t.eyebrow;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("homeLink").href = `https://careolimited.com/?lang=${encodeURIComponent(lang)}`;

      const subject = encodeURIComponent("F Quiz - Account Deletion Support");
      const privacyUrl = `https://careolimited.com/privacy/fquiz.html?lang=${encodeURIComponent(lang)}`;
      document.getElementById("content").innerHTML =
        section(t.inAppTitle, `<p>${t.inAppIntro}</p>${list(t.steps, true)}<div class="notice">${t.warning}</div>`) +
        section(t.deletedTitle, `<p>${t.deletedIntro}</p>${list(t.deleted)}`) +
        section(t.retainedTitle, list(t.retained)) +
        section(t.timingTitle, `<p>${t.timing}</p>`) +
        section(t.helpTitle, `<p>${t.help}</p><div class="actions"><a class="button" href="mailto:${EMAIL}?subject=${subject}">${t.emailButton}</a><a class="button secondary" href="${privacyUrl}">${t.privacyButton}</a></div><div class="notice privacy-note">${t.privacyNote}</div>`);
      document.getElementById("footer").textContent = t.footer;

      localStorage.setItem("fquiz-account-language", lang);
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState(null, "", url.toString());
    }

    languageSelect.addEventListener("change", (event) => render(event.target.value));
    render(supported.includes(requested) ? requested : "en");
  </script>
