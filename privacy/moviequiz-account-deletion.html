        inAppTitle: "Movie Quiz içinden silme", steps: ["Movie Quiz’i açın ve Profil ekranına gidin.", "Silmek istediğiniz hesapla giriş yapın.", "Hesabı Sil bölümüne ilerleyin. E-posta ve parola ile açılan hesaplarda mevcut parolanızı doğrulayın.", "Hesabı Sil düğmesine dokunun ve kalıcı silme işlemini onaylayın."],
        warning: "Hesap silme işlemi kalıcıdır ve geri alınamaz. Silinen hesap ve hesap verileri kurtarılamaz.",
        dataTitle: "Hesapla birlikte silinen veriler", data: ["Firebase Authentication hesabı", "Movie Quiz profili ve hesaba bağlı kullanıcı adı", "Hesaba bağlı puanlar, görevler ve liderlik tablosu profili", "Teknik olarak belirlenebilen hesaba bağlı multiplayer ve çevrimiçi durum verileri"],
        retentionTitle: "Kalabilecek bilgiler", retention: "Yerel uygulama verileri, uygulama verilerini temizleyene veya uygulamayı kaldırana kadar cihazınızda kalır. Hesabınızla makul biçimde ilişkilendirilemeyen toplu veya anonim kayıtlar ile güvenlik, sahtekârlığı önleme, reklam ve analiz kayıtları ya da yasaların sınırlı süre saklanmasını gerektirdiği bilgiler tutulabilir.", privacy: "Movie Quiz Gizlilik Politikasını okuyun"
      }
    };

    const supported = new Set(Object.keys(content));
    const select = document.getElementById("languageSelect");

    function languageFromUrl() {
      const requested = new URLSearchParams(window.location.search).get("lang");
      if (requested && supported.has(requested)) return requested;
      const stored = localStorage.getItem("careo-language");
      if (stored && supported.has(stored)) return stored;
      const browser = String(navigator.language || "en").toLowerCase().split("-")[0];
      return supported.has(browser) ? browser : "en";
    }

    function setList(id, items) {
      const list = document.getElementById(id);
      list.replaceChildren(...items.map((text) => {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }));
    }

    function render(language) {
      const lang = supported.has(language) ? language : "en";
      const copy = content[lang];
      document.documentElement.lang = lang;
      document.title = `${copy.title} | Movie Quiz | CAREO LIMITED`;
      select.value = lang;
      const backLink = document.getElementById("backLink");
      const backLinkText = document.getElementById("backLinkText");
      backLink.href = `../index.html?lang=${encodeURIComponent(lang)}`;
      backLinkText.textContent = copy.back;
      ["badge", "title", "intro", "inAppTitle", "deletionWarning", "dataTitle", "retentionTitle", "retentionText"].forEach((id) => {
        const key = id === "deletionWarning" ? "warning" : id === "retentionText" ? "retention" : id;
        document.getElementById(id).textContent = copy[key];
      });
      setList("inAppSteps", copy.steps);
      setList("dataItems", copy.data);
      const privacy = document.getElementById("privacyLink");
      privacy.textContent = copy.privacy;
      privacy.href = `moviequiz.html?lang=${encodeURIComponent(lang)}`;
      localStorage.setItem("careo-language", lang);
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState(null, "", url.toString());
    }

    select.addEventListener("change", (event) => render(event.target.value));
    render(languageFromUrl());
  </script>
</body>
</html>
