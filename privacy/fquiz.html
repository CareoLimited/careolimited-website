nizasyon verilerinizi işleyebilir. Parolanız Firebase Authentication tarafından işlenir ve CAREO LIMITED tarafından okunabilir biçimde saklanmaz. Firebase kayıt ve giriş sırasında IP adresini ve uygulama ya da cihaz güvenlik bilgilerini de işleyebilir. Liderlik tablolarında kullanıcı adınız, bayrağınız, puanınız veya sıranız diğer kullanıcılara görünür. Multiplayer maçlarını senkronize etmek için oda ayarları, katılımcı kimlikleri ve adları, maç ilerlemesi, cevaplar, skorlar, hazır olma ve bağlantı durumu işlenebilir."},{"type":"h2","text":"5. Analiz ve Reklam Tanılama"},{"type":"p","text":"Firebase Analytics ve reklam tanılama olayları; platform, uygulama sürümü, reklam biçimi ve yerleşimi, yükleme ve gösterim sonuçları, gecikme aralıkları, ağ durumu, maç türü, reklam kaynağı veya adaptörü, yanıt kimlikleri ve gösterim düzeyinde gelir dahil olmak üzere uygulama ve cihaz bilgileri ile etkileşimleri işleyebilir. Bu bilgileri performansı ölçmek, reklam sunumundaki sorunları teşhis etmek, kötüye kullanımı önlemek ve uygulamayı geliştirmek için kullanırız. E-posta adresleri, parolalar ve quiz cevap metinleri reklam yaşam döngüsü olaylarımıza dahil edilmez."},{"type":"h2","text":"6. Üçüncü Taraf Hizmetler"},{"type":"p","text":"Uygulama; Google Firebase Authentication, Cloud Firestore ve Analytics, Google AdMob ve User Messaging Platform (UMP) ile Apple App Store ve Google Play platform hizmetlerini kullanır. Bu sağlayıcılar bilgileri kendi koşulları ve gizlilik politikaları uyarınca işler."},{"type":"h2","text":"7. Reklam ve Takip"},{"type":"p","text":"Google AdMob banner, geçiş ve ödüllü reklamlar sunabilir. Cihazınıza, ayarlarınıza, onayınıza ve bölgenize göre Google Mobile Ads SDK; reklam, ölçüm ve sahtekârlığı önleme amaçlarıyla yaklaşık konum için IP adresini, uygulama ve reklam etkileşimlerini, tanılama bilgilerini ve cihaz ya da reklam tanımlayıcılarını işleyebilir. Gerekli olduğunda gizlilik tercihlerini toplamak ve yönetmek için Google UMP kullanılır. Bu seçenek gerekli olduğunda profilinizdeki Gizlilik Seçenekleri üzerinden UMP formunu yeniden açabilirsiniz. iOS’ta App Tracking Transparency izni de istenebilir. Kişiselleştirilmemiş veya sınırlı reklamları seçmek reklamları tamamen kaldırmayabilir."},{"type":"h2","text":"8. Bildirimler"},{"type":"p","text":"İzin vermeniz hâlinde F Quiz; canlar, görevler, liderlik tablosu hareketleri ve uygulamaya dönüş hatırlatmaları için yerel bildirimler planlayabilir. Bildirim tercihleri, içerikleri ve zamanlamaları cihazınızda saklanır. F Quiz şu anda CAREO LIMITED sunucularına anlık bildirim belirteci göndermez. Bildirim iznini uygulama içindeki yönlendirmelerden veya cihaz ayarlarından yönetebilirsiniz."},{"type":"h2","text":"9. Veri Paylaşımı"},{"type":"p","text":"Kişisel verileri satmayız. Firebase, Google reklam hizmetleri ve platform sağlayıcıları bilgileri bu Politikada açıklanan amaçlarla işleyebilir. Bizim adımıza hizmet veren sağlayıcıların kişisel verileri yürürlükteki hukuka ve bizimle yaptıkları sözleşmelere uygun şekilde korumasını şart koşarız. Kullanıcı adı, bayrak, puan ve sıra gibi herkese açık liderlik tablosu bilgileri ile ilgili multiplayer bilgileri diğer oyunculara görünebilir. E-posta adresiniz ve parolanız herkese açık liderlik tablosunda veya diğer oyunculara gösterilmez."},{"type":"h2","text":"10. Saklama ve Silme"},{"type":"p","html":"Yerel veriler genellikle siz silene, uygulamayı sıfırlayana veya kaldırana kadar cihazınızda kalır. iOS’ta, yerel olarak oluşturulan cihaz referansı gibi sistem Anahtar Zinciri’nde saklanan değerler uygulama kaldırıldıktan sonra kalabilir ve uygulama aynı paket kimliğiyle yeniden yüklendiğinde tekrar kullanılabilir hâle gelebilir. Planlanan bildirimler gösterilene, iptal edilene veya uygulama verileri kaldırılana kadar saklanır. Hesap, profil, liderlik tablosu ve senkronize görev verileri hesabınız aktif olduğu sürece tutulabilir. Hesabınızı profil ekranından veya <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">hesap silme sayfasından</a> silebilirsiniz. Silme talebi tamamlandığında; güvenlik, sahtekârlığı önleme, yasal yükümlülükler veya yedeklemeler için sınırlı saklama gerekmediği sürece hesaba bağlı kişisel verileri siler ya da anonimleştiririz. Bazı multiplayer, reklam ve analiz kayıtları sınırlı operasyonel veya güvenlik süreleri boyunca ya da ilgili sağlayıcının ayar ve politikalarına göre tutulabilir."},{"type":"h2","text":"11. Kullanıcı Hakları"},{"type":"p","text":"Bulunduğunuz yere göre kişisel verilerinize erişme, bunları düzeltme, silme, işlemeyi sınırlandırma, işlemeye itiraz etme, verilerin bir kopyasını alma ve onayı geri çekme haklarınız olabilir. Uygulamada belirli profil bilgilerini düzenleyebilir veya hesabınızı silebilir, diğer talepler için bizimle iletişime geçebilir, cihaz ayarlarından reklam ve bildirim izinlerini yönetebilir ve kullanılabilir olduğunda Gizlilik Seçenekleri üzerinden UMP tercihlerinizi değiştirebilirsiniz. Ayrıca Birleşik Krallık Information Commissioner’s Office’e veya bulunduğunuz yerdeki veri koruma kurumuna şikâyette bulunabilirsiniz. Onayın geri çekilmesi daha önce tamamlanan işlemleri etkilemez."},{"type":"h2","text":"12. Veri Güvenliği"},{"type":"p","text":"Uygun durumlarda harici iletişim için HTTPS kullanırız ve uygulamalarımızı veri toplamayı azaltacak şekilde tasarlarız. Hiçbir yazılım veya cihaz ortamı mutlak güvenlik garanti edemez."},{"type":"h2","text":"13. Çocukların Gizliliği"},{"type":"p","text":"Uygulama 13 yaş altındaki çocuklara yönelik değildir. 13 yaş altındaki çocuklardan bilerek kişisel veri toplamayız. Bir çocuğun kişisel veri sağladığını düşünüyorsanız bizimle iletişime geçin."},{"type":"h2","text":"14. Uluslararası Veri Aktarımları"},{"type":"p","text":"Firebase, reklam ve platform sağlayıcıları bilgileri Birleşik Krallık veya Avrupa Ekonomik Alanı dışında, Amerika Birleşik Devletleri dâhil olmak üzere işleyebilir. Gerekli durumlarda aktarımlar yeterlilik kararlarına, sözleşmeye dayalı korumalara veya başka bir hukuka uygun aktarım mekanizmasına dayanır. Verilerinize uygulanan korumalar hakkında daha fazla bilgi için bizimle iletişime geçebilirsiniz."},{"type":"h2","text":"15. İletişim"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Politika Güncellemeleri"},{"type":"p","text":"Uygulama özellikleri, veri işleme uygulamaları, üçüncü taraf hizmetler veya yasal gereklilikler değişirse bu Politikayı güncelleyebiliriz. Güncellemeler yeni bir Son güncelleme tarihiyle gösterilir. Kanunen gerekli olduğunda önemli bir değişiklik yürürlüğe girmeden önce ek bildirim sunar veya onayınızı isteriz."}]};
