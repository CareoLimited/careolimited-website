<script>
  const policyData = {"en":[{"type":"h1","text":"Privacy Policy - F Quiz"},{"type":"meta","html":"<strong>Last updated:</strong> September 2026<br><strong>App:</strong> F Quiz<br><strong>Developer / Publisher:</strong> CAREO LIMITED<br><strong>Contact:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz respects your privacy. This Policy explains what information may be processed, how it is used, and your rights when you use the mobile application on iOS and Android."},{"type":"h2","text":"1. Data Processing Overview"},{"type":"p","text":"F Quiz processes only the information needed to provide the app. Core features, accounts, leaderboards and multiplayer are processed to provide the services you request. Security, fraud prevention and reliability are supported by our legitimate interests. Advertising and analytics rely on consent where required by law, and some processing may be necessary to meet legal obligations. We do not sell personal data."},{"type":"h2","text":"2. Locally Stored Data"},{"type":"p","text":"The app may store quiz progress, answers, scores, streaks, lives, missions, settings, language, advertising and notification preferences, scheduled reminder information, offline progress and a locally generated device reference on your device. This local information is used to operate the app, remember your choices and support offline or guest play."},{"type":"h2","text":"3. Processing Purposes"},{"type":"ul","items":["Provide quizzes, missions and other core app features","Authenticate accounts and synchronize eligible progress","Operate leaderboards, multiplayer rooms and matches","Remember preferences and support offline play","Measure advertising and app performance, diagnose errors and improve reliability","Protect the app, prevent fraud and respond to support requests"]},{"type":"h2","text":"4. Online Accounts, Leaderboards and Multiplayer"},{"type":"p","text":"If you sign in, Firebase may process your email address, authentication credentials, account identifier, username or display name, selected flag, points, mission progress and synchronization data. Your password is handled by Firebase Authentication and is not stored by CAREO LIMITED in readable form. Firebase may also process IP address and app or device security information during registration and sign-in. Leaderboards make your username, flag, score or rank visible to other users. Multiplayer may process room settings, participant identifiers and names, match progress, responses, scores, readiness and connection status to synchronize matches."},{"type":"h2","text":"5. Analytics and Advertising Diagnostics"},{"type":"p","text":"Firebase Analytics and advertising diagnostic events may process app and device information and interactions, including platform, app version, ad format and placement, load and display outcomes, latency ranges, network state, match type, ad source or adapter, response identifiers and impression-level revenue. We use this information to measure performance, troubleshoot ad delivery, prevent abuse and improve the app. Email addresses, passwords and quiz answer text are not included in our advertising lifecycle events."},{"type":"h2","text":"6. Third-Party Services"},{"type":"p","text":"The app uses Google Firebase Authentication, Cloud Firestore and Analytics; Google AdMob and the User Messaging Platform (UMP); and Apple App Store and Google Play platform services. These providers process information under their own terms and privacy policies."},{"type":"h2","text":"7. Advertising and Tracking"},{"type":"p","text":"Google AdMob may provide banner, interstitial and rewarded ads. Depending on your device, settings, consent and region, the Google Mobile Ads SDK may process IP address for approximate location, app and ad interactions, diagnostic information, and device or advertising identifiers for advertising, measurement and fraud prevention. Where required, Google UMP is used to collect and manage privacy choices. You can reopen the UMP form from Privacy Options in your profile when that option is required. On iOS, App Tracking Transparency permission may also be requested. Choosing non-personalized or limited ads does not necessarily remove ads."},{"type":"h2","text":"8. Notifications"},{"type":"p","text":"With your permission, F Quiz may schedule local notifications for lives, missions, leaderboard activity and reminders to return to the app. Notification preferences, content and schedules are stored on your device. F Quiz does not currently send a push notification token to CAREO LIMITED servers. You can manage notification permission through in-app prompts or your device settings."},{"type":"h2","text":"9. Data Sharing"},{"type":"p","text":"We do not sell personal data. Firebase, Google advertising services and platform providers may process information for the purposes described in this Policy. We require service providers acting for us to protect personal data consistently with applicable law and their agreements with us. Public leaderboard details such as username, flag, points and rank, and relevant multiplayer details, may be visible to other players. Your email address and password are not shown on the public leaderboard or to other players."},{"type":"h2","text":"10. Data Retention and Deletion"},{"type":"p","html":"Local data generally remains until you clear it, reset the app or uninstall it. On iOS, values stored in the system Keychain, such as the locally generated device reference, may persist after uninstall and may become available again if the app is reinstalled with the same bundle identifier. Scheduled notifications remain until they are delivered, cancelled or the app data is removed. Account, profile, leaderboard and synchronized mission data may be retained while your account is active. You can delete your account from the profile screen or use the <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">account deletion page</a>. When a deletion request is completed, we delete or anonymize account-linked personal data unless limited retention is required for security, fraud prevention, legal obligations or backups. Some multiplayer, advertising and analytics records may be retained for limited operational or security periods or according to the relevant provider settings and policies."},{"type":"h2","text":"11. User Rights"},{"type":"p","text":"Depending on your location, you may have rights to access, correct, delete, restrict, object to or receive a copy of your personal data, and to withdraw consent. You can edit certain profile information or delete your account in the app, contact us for other requests, manage advertising and notification permissions in device settings, and change UMP choices through Privacy Options when available. You may also complain to the UK Information Commissioner’s Office or your local data protection authority. Withdrawal of consent does not affect processing completed before withdrawal."},{"type":"h2","text":"12. Data Security"},{"type":"p","text":"We use HTTPS for external communications where applicable and design our apps to minimize data collection. No software or device environment can guarantee absolute security."},{"type":"h2","text":"13. Children’s Privacy"},{"type":"p","text":"The app is not directed to children under 13. We do not knowingly collect personal data from children under 13. If you believe a child has provided personal data, contact us."},{"type":"h2","text":"14. International Data Transfers"},{"type":"p","text":"Firebase, advertising and platform providers may process information outside the United Kingdom or European Economic Area, including in the United States. Where required, transfers rely on adequacy decisions, contractual safeguards or another lawful transfer mechanism. Contact us if you would like more information about the safeguards relevant to your data."},{"type":"h2","text":"15. Contact"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Policy Updates"},{"type":"p","text":"We may update this Policy if app features, data practices, third-party services or legal requirements change. Updates will be shown with a new Last updated date. Where required by law, we will provide an additional notice or request consent before a material change takes effect."}],"fr":[{"type":"h1","text":"Politique de confidentialité - F Quiz"},{"type":"meta","html":"<strong>Dernière mise à jour:</strong> septembre 2026<br><strong>App:</strong> F Quiz<br><strong>Développeur / Éditeur:</strong> CAREO LIMITED<br><strong>Contact:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz respecte votre vie privée. Cette Politique explique quelles informations peuvent être traitées, comment elles sont utilisées et quels sont vos droits lorsque vous utilisez l’application mobile sur iOS et Android."},{"type":"h2","text":"1. Aperçu du traitement des données"},{"type":"p","text":"F Quiz traite uniquement les informations nécessaires au fonctionnement de l’application. Les fonctions principales, les comptes, les classements et le multijoueur sont traités afin de fournir les services que vous demandez. La sécurité, la prévention de la fraude et la fiabilité reposent sur nos intérêts légitimes. La publicité et les analyses reposent sur votre consentement lorsque la loi l’exige, et certains traitements peuvent être nécessaires pour respecter nos obligations légales. Nous ne vendons pas de données personnelles."},{"type":"h2","text":"2. Données stockées localement"},{"type":"p","text":"L’application peut stocker sur votre appareil la progression des quiz, les réponses, scores, séries, vies, missions, réglages, langue, préférences publicitaires et de notification, informations relatives aux rappels programmés, progression hors ligne et une référence d’appareil générée localement. Ces informations locales servent à faire fonctionner l’application, mémoriser vos choix et permettre le jeu hors ligne ou en mode invité."},{"type":"h2","text":"3. Finalités du traitement"},{"type":"ul","items":["Fournir les quiz, missions et fonctions principales","Authentifier les comptes et synchroniser la progression éligible","Gérer les classements, salons et matchs multijoueurs","Mémoriser les préférences et permettre le jeu hors ligne","Mesurer les performances publicitaires et de l’application, diagnostiquer les erreurs et améliorer la fiabilité","Protéger l’application, prévenir la fraude et répondre aux demandes d’assistance"]},{"type":"h2","text":"4. Comptes en ligne, classements et multijoueur"},{"type":"p","text":"Si vous vous connectez, Firebase peut traiter votre adresse e-mail, vos identifiants d’authentification, votre identifiant de compte, votre nom d’utilisateur ou nom affiché, le drapeau choisi, vos points, votre progression dans les missions et les données de synchronisation. Votre mot de passe est géré par Firebase Authentication et n’est pas stocké sous une forme lisible par CAREO LIMITED. Firebase peut également traiter l’adresse IP et des informations de sécurité relatives à l’application ou à l’appareil lors de l’inscription et de la connexion. Les classements rendent votre nom d’utilisateur, drapeau, score ou rang visibles aux autres utilisateurs. Le multijoueur peut traiter les réglages du salon, les identifiants et noms des participants, la progression du match, les réponses, scores, états de préparation et de connexion afin de synchroniser les parties."},{"type":"h2","text":"5. Analyses et diagnostics publicitaires"},{"type":"p","text":"Firebase Analytics et les événements de diagnostic publicitaire peuvent traiter des informations et interactions relatives à l’application et à l’appareil, notamment la plateforme, la version, le format et l’emplacement publicitaire, les résultats de chargement et d’affichage, les plages de latence, l’état du réseau, le type de match, la source ou l’adaptateur publicitaire, les identifiants de réponse et les revenus au niveau de l’impression. Ces données servent à mesurer les performances, diagnostiquer la diffusion des annonces, prévenir les abus et améliorer l’application. Les adresses e-mail, mots de passe et textes des réponses aux quiz ne figurent pas dans nos événements de cycle de vie publicitaire."},{"type":"h2","text":"6. Services tiers"},{"type":"p","text":"L’application utilise Google Firebase Authentication, Cloud Firestore et Analytics, Google AdMob et User Messaging Platform (UMP), ainsi que les services de plateforme Apple App Store et Google Play. Ces fournisseurs traitent les informations selon leurs propres conditions et politiques de confidentialité."},{"type":"h2","text":"7. Publicité et suivi"},{"type":"p","text":"Google AdMob peut fournir des bannières, annonces interstitielles et annonces avec récompense. Selon votre appareil, vos réglages, votre consentement et votre région, le SDK Google Mobile Ads peut traiter l’adresse IP pour une localisation approximative, les interactions avec l’application et les annonces, des informations de diagnostic et des identifiants d’appareil ou publicitaires à des fins de publicité, mesure et prévention de la fraude. Lorsque cela est requis, Google UMP gère les choix de confidentialité. Vous pouvez rouvrir le formulaire UMP depuis Options de confidentialité dans votre profil lorsque cette option est requise. Sur iOS, l’autorisation App Tracking Transparency peut également être demandée. Le choix d’annonces non personnalisées ou limitées ne supprime pas nécessairement les annonces."},{"type":"h2","text":"8. Notifications"},{"type":"p","text":"Avec votre autorisation, F Quiz peut programmer des notifications locales concernant les vies, les missions, l’activité du classement et les rappels pour revenir dans l’application. Les préférences, le contenu et les horaires des notifications sont stockés sur votre appareil. F Quiz n’envoie actuellement aucun jeton de notification push aux serveurs de CAREO LIMITED. Vous pouvez gérer l’autorisation des notifications via les invites de l’application ou les réglages de votre appareil."},{"type":"h2","text":"9. Partage des données"},{"type":"p","text":"Nous ne vendons pas de données personnelles. Firebase, les services publicitaires de Google et les fournisseurs de plateformes peuvent traiter des informations aux fins décrites dans cette Politique. Nous exigeons des prestataires agissant pour notre compte qu’ils protègent les données personnelles conformément à la loi applicable et à leurs accords avec nous. Les informations publiques du classement, telles que le nom d’utilisateur, le drapeau, les points et le rang, ainsi que les informations multijoueurs pertinentes, peuvent être visibles par les autres joueurs. Votre adresse e-mail et votre mot de passe ne sont pas affichés dans le classement public ni aux autres joueurs."},{"type":"h2","text":"10. Conservation et suppression"},{"type":"p","html":"Les données locales restent généralement jusqu’à leur suppression, la réinitialisation de l’application ou sa désinstallation. Sur iOS, les valeurs stockées dans le trousseau système, comme la référence d’appareil générée localement, peuvent subsister après la désinstallation et redevenir accessibles si l’application est réinstallée avec le même identifiant de bundle. Les notifications programmées restent jusqu’à leur affichage, leur annulation ou la suppression des données de l’application. Les données de compte, profil, classement et missions synchronisées peuvent être conservées tant que votre compte est actif. Vous pouvez supprimer votre compte depuis le profil ou utiliser la <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">page de suppression de compte</a>. Lorsqu’une demande est traitée, nous supprimons ou anonymisons les données personnelles liées au compte, sauf conservation limitée nécessaire pour la sécurité, la prévention de la fraude, les obligations légales ou les sauvegardes. Certains enregistrements multijoueurs, publicitaires et analytiques peuvent être conservés pendant des périodes opérationnelles ou de sécurité limitées, ou selon les réglages et politiques des fournisseurs concernés."},{"type":"h2","text":"11. Droits des utilisateurs"},{"type":"p","text":"Selon votre lieu de résidence, vous pouvez disposer de droits d’accès, de rectification, de suppression, de limitation, d’opposition, de portabilité et de retrait du consentement. Vous pouvez modifier certaines informations du profil ou supprimer votre compte dans l’application, nous contacter pour d’autres demandes, gérer les autorisations publicitaires et de notification dans les réglages de l’appareil, et modifier vos choix UMP via les Options de confidentialité lorsqu’elles sont disponibles. Vous pouvez également déposer une plainte auprès de l’Information Commissioner’s Office du Royaume-Uni ou de votre autorité locale de protection des données. Le retrait du consentement n’affecte pas les traitements effectués auparavant."},{"type":"h2","text":"12. Sécurité des données"},{"type":"p","text":"Nous utilisons HTTPS pour les communications externes lorsque cela s’applique et concevons nos apps pour réduire la collecte de données. Aucun logiciel ni appareil ne peut garantir une sécurité absolue."},{"type":"h2","text":"13. Confidentialité des enfants"},{"type":"p","text":"L’application ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment de données personnelles d’enfants de moins de 13 ans. Si vous pensez qu’un enfant a fourni des données personnelles, contactez-nous."},{"type":"h2","text":"14. Transferts internationaux"},{"type":"p","text":"Firebase, les fournisseurs publicitaires et les fournisseurs de plateformes peuvent traiter des informations hors du Royaume-Uni ou de l’Espace économique européen, notamment aux États-Unis. Lorsque cela est requis, les transferts reposent sur des décisions d’adéquation, des garanties contractuelles ou un autre mécanisme légal. Contactez-nous pour obtenir davantage d’informations sur les garanties applicables à vos données."},{"type":"h2","text":"15. Contact"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Mises à jour de la Politique"},{"type":"p","text":"Nous pouvons mettre à jour cette Politique si les fonctions, les pratiques relatives aux données, les services tiers ou les exigences légales changent. Une nouvelle date de mise à jour sera affichée. Lorsque la loi l’exige, nous fournirons un avis supplémentaire ou demanderons votre consentement avant l’entrée en vigueur d’un changement important."}],"de":[{"type":"h1","text":"Datenschutzerklärung - F Quiz"},{"type":"meta","html":"<strong>Letzte Aktualisierung:</strong> September 2026<br><strong>App:</strong> F Quiz<br><strong>Entwickler / Herausgeber:</strong> CAREO LIMITED<br><strong>Kontakt:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz respektiert Ihre Privatsphäre. Diese Richtlinie erklärt, welche Informationen verarbeitet werden können, wie sie verwendet werden und welche Rechte Sie bei der Nutzung der mobilen App auf iOS und Android haben."},{"type":"h2","text":"1. Überblick zur Datenverarbeitung"},{"type":"p","text":"F Quiz verarbeitet nur die Informationen, die zur Bereitstellung der App erforderlich sind. Kernfunktionen, Konten, Bestenlisten und Mehrspielerfunktionen werden verarbeitet, um die von Ihnen angeforderten Dienste bereitzustellen. Sicherheit, Betrugsprävention und Zuverlässigkeit beruhen auf unseren berechtigten Interessen. Werbung und Analysen beruhen, soweit gesetzlich erforderlich, auf Ihrer Einwilligung; bestimmte Verarbeitungen können zur Erfüllung gesetzlicher Pflichten notwendig sein. Wir verkaufen keine personenbezogenen Daten."},{"type":"h2","text":"2. Lokal gespeicherte Daten"},{"type":"p","text":"Die App kann Quizfortschritt, Antworten, Punkte, Serien, Leben, Missionen, Einstellungen, Sprache, Werbe- und Benachrichtigungseinstellungen, Informationen zu geplanten Erinnerungen, Offline-Fortschritt und eine lokal erzeugte Gerätereferenz auf Ihrem Gerät speichern. Diese lokalen Informationen dienen dem Betrieb der App, dem Speichern Ihrer Auswahl und der Unterstützung der Offline- oder Gastnutzung."},{"type":"h2","text":"3. Zwecke der Verarbeitung"},{"type":"ul","items":["Quiz, Missionen und Kernfunktionen bereitstellen","Konten authentifizieren und geeigneten Fortschritt synchronisieren","Bestenlisten, Multiplayer-Räume und Spiele betreiben","Einstellungen speichern und Offline-Spiel unterstützen","Werbe- und App-Leistung messen, Fehler diagnostizieren und Zuverlässigkeit verbessern","Die App schützen, Betrug verhindern und Supportanfragen bearbeiten"]},{"type":"h2","text":"4. Online-Konten, Bestenlisten und Multiplayer"},{"type":"p","text":"Wenn Sie sich anmelden, kann Firebase Ihre E-Mail-Adresse, Anmeldedaten, Konto-ID, Ihren Benutzernamen oder Anzeigenamen, die gewählte Flagge, Punkte, Missionsfortschritt und Synchronisierungsdaten verarbeiten. Ihr Passwort wird von Firebase Authentication verarbeitet und von CAREO LIMITED nicht in lesbarer Form gespeichert. Firebase kann bei Registrierung und Anmeldung außerdem die IP-Adresse sowie Sicherheitsinformationen zur App oder zum Gerät verarbeiten. In Bestenlisten sind Benutzername, Flagge, Punktzahl oder Rang für andere sichtbar. Für Mehrspielerpartien können Raumeinstellungen, Teilnehmer-IDs und -namen, Spielfortschritt, Antworten, Punktzahlen, Bereitschafts- und Verbindungsstatus verarbeitet werden."},{"type":"h2","text":"5. Analysen und Werbediagnosen"},{"type":"p","text":"Firebase Analytics und Werbediagnose-Ereignisse können App- und Geräteinformationen sowie Interaktionen verarbeiten, darunter Plattform, App-Version, Werbeformat und Platzierung, Lade- und Anzeigeergebnisse, Latenzbereiche, Netzwerkstatus, Spieltyp, Werbequelle oder Adapter, Antwort-IDs und Einnahmen pro Impression. Diese Informationen dienen der Leistungsmessung, Fehleranalyse bei der Anzeigenbereitstellung, Missbrauchsprävention und Verbesserung der App. E-Mail-Adressen, Passwörter und Texte von Quizantworten sind nicht in unseren Werbelebenszyklus-Ereignissen enthalten."},{"type":"h2","text":"6. Drittanbieter-Dienste"},{"type":"p","text":"Die App nutzt Google Firebase Authentication, Cloud Firestore und Analytics, Google AdMob und die User Messaging Platform (UMP) sowie Plattformdienste des Apple App Store und von Google Play. Diese Anbieter verarbeiten Informationen gemäß ihren eigenen Bedingungen und Datenschutzrichtlinien."},{"type":"h2","text":"7. Werbung und Tracking"},{"type":"p","text":"Google AdMob kann Banner-, Interstitial- und Rewarded-Anzeigen bereitstellen. Je nach Gerät, Einstellungen, Einwilligung und Region kann das Google Mobile Ads SDK IP-Adressen zur ungefähren Standortbestimmung, App- und Werbeinteraktionen, Diagnosedaten sowie Geräte- oder Werbe-IDs für Werbung, Messung und Betrugsprävention verarbeiten. Wo erforderlich, verwaltet Google UMP die Datenschutzentscheidungen. Das UMP-Formular kann über Datenschutzoptionen im Profil erneut geöffnet werden, wenn diese Option erforderlich ist. Unter iOS kann außerdem die App-Tracking-Transparency-Berechtigung angefordert werden. Nicht personalisierte oder eingeschränkte Werbung entfernt Werbung nicht zwingend."},{"type":"h2","text":"8. Benachrichtigungen"},{"type":"p","text":"Mit Ihrer Erlaubnis kann F Quiz lokale Benachrichtigungen zu Leben, Missionen, Bestenlistenaktivitäten und Erinnerungen zur Rückkehr in die App planen. Einstellungen, Inhalte und Zeitpläne der Benachrichtigungen werden auf Ihrem Gerät gespeichert. F Quiz sendet derzeit kein Push-Benachrichtigungstoken an Server von CAREO LIMITED. Sie können die Benachrichtigungsberechtigung über Hinweise in der App oder in den Geräteeinstellungen verwalten."},{"type":"h2","text":"9. Datenweitergabe"},{"type":"p","text":"Wir verkaufen keine personenbezogenen Daten. Firebase, Google-Werbedienste und Plattformanbieter können Informationen für die in dieser Richtlinie beschriebenen Zwecke verarbeiten. Wir verlangen von Dienstleistern, die für uns tätig sind, personenbezogene Daten im Einklang mit geltendem Recht und ihren Vereinbarungen mit uns zu schützen. Öffentliche Bestenlistendaten wie Benutzername, Flagge, Punkte und Rang sowie relevante Mehrspielerdaten können für andere Spieler sichtbar sein. Ihre E-Mail-Adresse und Ihr Passwort werden weder in der öffentlichen Bestenliste noch anderen Spielern angezeigt."},{"type":"h2","text":"10. Aufbewahrung und Löschung"},{"type":"p","html":"Lokale Daten bleiben grundsätzlich gespeichert, bis Sie sie löschen, die App zurücksetzen oder deinstallieren. Unter iOS können im System-Schlüsselbund gespeicherte Werte, etwa die lokal erzeugte Gerätereferenz, eine Deinstallation überdauern und nach einer Neuinstallation mit derselben Bundle-ID wieder verfügbar sein. Geplante Benachrichtigungen bleiben bis zu ihrer Zustellung, Stornierung oder der Entfernung der App-Daten bestehen. Konto-, Profil-, Bestenlisten- und synchronisierte Missionsdaten können gespeichert werden, solange Ihr Konto aktiv ist. Sie können Ihr Konto im Profil löschen oder die <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">Seite zur Kontolöschung</a> verwenden. Nach Abschluss eines Löschantrags löschen oder anonymisieren wir kontobezogene personenbezogene Daten, sofern keine begrenzte Aufbewahrung für Sicherheit, Betrugsprävention, gesetzliche Pflichten oder Sicherungskopien erforderlich ist. Bestimmte Mehrspieler-, Werbe- und Analysedaten können für begrenzte Betriebs- oder Sicherheitszeiträume oder gemäß den Einstellungen und Richtlinien der jeweiligen Anbieter gespeichert werden."},{"type":"h2","text":"11. Nutzerrechte"},{"type":"p","text":"Je nach Ihrem Standort können Sie Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch, Datenübertragbarkeit und Widerruf der Einwilligung haben. Sie können bestimmte Profilinformationen bearbeiten oder Ihr Konto in der App löschen, uns für andere Anfragen kontaktieren, Werbe- und Benachrichtigungsberechtigungen in den Geräteeinstellungen verwalten und UMP-Auswahlen über die Datenschutzoptionen ändern. Sie können sich außerdem bei der britischen Information Commissioner’s Office oder Ihrer örtlichen Datenschutzbehörde beschweren. Der Widerruf berührt nicht die Rechtmäßigkeit der vorherigen Verarbeitung."},{"type":"h2","text":"12. Datensicherheit"},{"type":"p","text":"Wir verwenden HTTPS für externe Kommunikation, sofern zutreffend, und gestalten unsere Apps so, dass die Datenerhebung minimiert wird. Keine Software- oder Geräteumgebung kann absolute Sicherheit garantieren."},{"type":"h2","text":"13. Datenschutz von Kindern"},{"type":"p","text":"Die App richtet sich nicht an Kinder unter 13 Jahren. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn Sie glauben, dass ein Kind personenbezogene Daten bereitgestellt hat, kontaktieren Sie uns."},{"type":"h2","text":"14. Internationale Datenübertragungen"},{"type":"p","text":"Firebase, Werbe- und Plattformanbieter können Informationen außerhalb des Vereinigten Königreichs oder des Europäischen Wirtschaftsraums verarbeiten, auch in den Vereinigten Staaten. Soweit erforderlich, beruhen Übermittlungen auf Angemessenheitsbeschlüssen, vertraglichen Garantien oder einem anderen rechtmäßigen Übermittlungsmechanismus. Kontaktieren Sie uns, wenn Sie weitere Informationen über die für Ihre Daten geltenden Garantien wünschen."},{"type":"h2","text":"15. Kontakt"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Aktualisierungen"},{"type":"p","text":"Wir können diese Richtlinie aktualisieren, wenn sich App-Funktionen, Datenpraktiken, Drittanbieterdienste oder gesetzliche Anforderungen ändern. Aktualisierungen werden mit einem neuen Datum angezeigt. Soweit gesetzlich erforderlich, informieren wir Sie zusätzlich oder holen Ihre Einwilligung ein, bevor eine wesentliche Änderung wirksam wird."}],"it":[{"type":"h1","text":"Informativa sulla privacy - F Quiz"},{"type":"meta","html":"<strong>Ultimo aggiornamento:</strong> settembre 2026<br><strong>App:</strong> F Quiz<br><strong>Sviluppatore / Editore:</strong> CAREO LIMITED<br><strong>Contatto:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz rispetta la tua privacy. Questa Informativa spiega quali informazioni possono essere trattate, come vengono utilizzate e quali diritti hai quando usi l’app mobile su iOS e Android."},{"type":"h2","text":"1. Panoramica del trattamento dei dati"},{"type":"p","text":"F Quiz tratta solo le informazioni necessarie per fornire l’app. Le funzioni principali, gli account, le classifiche e il multigiocatore sono trattati per offrire i servizi richiesti. La sicurezza, la prevenzione delle frodi e l’affidabilità si basano sui nostri legittimi interessi. La pubblicità e le analisi si basano sul consenso quando richiesto dalla legge e alcuni trattamenti possono essere necessari per adempiere obblighi legali. Non vendiamo dati personali."},{"type":"h2","text":"2. Dati archiviati localmente"},{"type":"p","text":"L’app può memorizzare sul dispositivo progressi dei quiz, risposte, punteggi, serie, vite, missioni, impostazioni, lingua, preferenze pubblicitarie e di notifica, informazioni sui promemoria programmati, progressi offline e un riferimento del dispositivo generato localmente. Queste informazioni locali servono a far funzionare l’app, ricordare le scelte e supportare l’uso offline o come ospite."},{"type":"h2","text":"3. Finalità del trattamento"},{"type":"ul","items":["Fornire quiz, missioni e funzioni principali","Autenticare gli account e sincronizzare i progressi idonei","Gestire classifiche, stanze e partite multiplayer","Ricordare le preferenze e supportare il gioco offline","Misurare le prestazioni di pubblicità e app, diagnosticare errori e migliorare l’affidabilità","Proteggere l’app, prevenire frodi e rispondere alle richieste di assistenza"]},{"type":"h2","text":"4. Account online, classifiche e multiplayer"},{"type":"p","text":"Se accedi, Firebase può trattare indirizzo e-mail, credenziali di autenticazione, identificativo dell’account, nome utente o nome visualizzato, bandiera scelta, punti, progressi delle missioni e dati di sincronizzazione. La password è gestita da Firebase Authentication e non viene memorizzata da CAREO LIMITED in forma leggibile. Durante la registrazione e l’accesso Firebase può inoltre trattare l’indirizzo IP e informazioni di sicurezza relative all’app o al dispositivo. Le classifiche rendono visibili agli altri utenti nome utente, bandiera, punteggio o posizione. Il multigiocatore può trattare impostazioni della stanza, identificativi e nomi dei partecipanti, avanzamento della partita, risposte, punteggi, stato di disponibilità e connessione per sincronizzare le partite."},{"type":"h2","text":"5. Analisi e diagnostica pubblicitaria"},{"type":"p","text":"Firebase Analytics e gli eventi diagnostici pubblicitari possono trattare informazioni e interazioni relative ad app e dispositivo, tra cui piattaforma, versione dell’app, formato e posizionamento degli annunci, esiti di caricamento e visualizzazione, intervalli di latenza, stato della rete, tipo di partita, sorgente o adapter pubblicitario, identificativi di risposta e ricavi a livello di impressione. Usiamo queste informazioni per misurare le prestazioni, risolvere problemi pubblicitari, prevenire abusi e migliorare l’app. Indirizzi e-mail, password e testo delle risposte ai quiz non sono inclusi nei nostri eventi del ciclo pubblicitario."},{"type":"h2","text":"6. Servizi di terze parti"},{"type":"p","text":"L’app utilizza Google Firebase Authentication, Cloud Firestore e Analytics, Google AdMob e User Messaging Platform (UMP), oltre ai servizi di piattaforma Apple App Store e Google Play. Questi fornitori trattano le informazioni secondo i propri termini e le proprie informative sulla privacy."},{"type":"h2","text":"7. Pubblicità e tracciamento"},{"type":"p","text":"Google AdMob può fornire banner, annunci interstitial e con premio. In base a dispositivo, impostazioni, consenso e regione, Google Mobile Ads SDK può trattare indirizzo IP per la posizione approssimativa, interazioni con app e annunci, dati diagnostici e identificativi del dispositivo o pubblicitari per pubblicità, misurazione e prevenzione delle frodi. Dove richiesto, Google UMP gestisce le scelte sulla privacy. Puoi riaprire il modulo UMP da Opzioni sulla privacy nel profilo quando tale opzione è richiesta. Su iOS può essere richiesta anche l’autorizzazione App Tracking Transparency. La scelta di annunci non personalizzati o limitati non elimina necessariamente gli annunci."},{"type":"h2","text":"8. Notifiche"},{"type":"p","text":"Con la tua autorizzazione, F Quiz può programmare notifiche locali relative a vite, missioni, attività della classifica e promemoria per tornare nell’app. Preferenze, contenuti e orari delle notifiche sono memorizzati sul dispositivo. Attualmente F Quiz non invia token per notifiche push ai server di CAREO LIMITED. Puoi gestire l’autorizzazione alle notifiche tramite gli avvisi nell’app o le impostazioni del dispositivo."},{"type":"h2","text":"9. Condivisione dei dati"},{"type":"p","text":"Non vendiamo dati personali. Firebase, i servizi pubblicitari di Google e i fornitori delle piattaforme possono trattare informazioni per le finalità descritte in questa Informativa. Richiediamo ai fornitori che agiscono per nostro conto di proteggere i dati personali in conformità alla legge applicabile e agli accordi stipulati con noi. Le informazioni pubbliche della classifica, come nome utente, bandiera, punti e posizione, e i dati multigiocatore pertinenti possono essere visibili agli altri giocatori. Il tuo indirizzo e-mail e la tua password non vengono mostrati nella classifica pubblica né agli altri giocatori."},{"type":"h2","text":"10. Conservazione e cancellazione"},{"type":"p","html":"I dati locali rimangono generalmente finché non li cancelli, reimposti l’app o la disinstalli. Su iOS, i valori conservati nel Portachiavi di sistema, come il riferimento del dispositivo generato localmente, possono persistere dopo la disinstallazione e tornare disponibili se l’app viene reinstallata con lo stesso identificatore del bundle. Le notifiche programmate rimangono fino alla consegna, all’annullamento o alla rimozione dei dati dell’app. I dati di account, profilo, classifica e missioni sincronizzate possono essere conservati finché l’account è attivo. Puoi eliminare l’account dal profilo o utilizzare la <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">pagina di eliminazione dell’account</a>. Al completamento di una richiesta eliminiamo o rendiamo anonimi i dati personali collegati all’account, salvo una conservazione limitata necessaria per sicurezza, prevenzione delle frodi, obblighi legali o backup. Alcuni dati multigiocatore, pubblicitari e analitici possono essere conservati per periodi operativi o di sicurezza limitati oppure secondo le impostazioni e le politiche dei relativi fornitori."},{"type":"h2","text":"11. Diritti degli utenti"},{"type":"p","text":"A seconda del luogo in cui ti trovi, potresti avere diritto ad accedere, correggere, eliminare, limitare, opporti o ricevere una copia dei tuoi dati personali e a revocare il consenso. Puoi modificare alcune informazioni del profilo o eliminare l’account nell’app, contattarci per altre richieste, gestire le autorizzazioni per pubblicità e notifiche nelle impostazioni del dispositivo e modificare le scelte UMP tramite Opzioni privacy quando disponibili. Puoi inoltre presentare un reclamo all’Information Commissioner’s Office del Regno Unito o all’autorità locale per la protezione dei dati. La revoca non pregiudica i trattamenti effettuati in precedenza."},{"type":"h2","text":"12. Sicurezza dei dati"},{"type":"p","text":"Usiamo HTTPS per le comunicazioni esterne quando applicabile e progettiamo le nostre app per ridurre la raccolta dati. Nessun software o dispositivo può garantire sicurezza assoluta."},{"type":"h2","text":"13. Privacy dei minori"},{"type":"p","text":"L’app non è rivolta a minori di 13 anni. Non raccogliamo consapevolmente dati personali da minori di 13 anni. Se ritieni che un minore abbia fornito dati personali, contattaci."},{"type":"h2","text":"14. Trasferimenti internazionali"},{"type":"p","text":"Firebase e i fornitori pubblicitari e delle piattaforme possono trattare informazioni al di fuori del Regno Unito o dello Spazio economico europeo, inclusi gli Stati Uniti. Ove richiesto, i trasferimenti si basano su decisioni di adeguatezza, garanzie contrattuali o un altro meccanismo legale. Contattaci per ulteriori informazioni sulle garanzie applicabili ai tuoi dati."},{"type":"h2","text":"15. Contatto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Aggiornamenti"},{"type":"p","text":"Possiamo aggiornare questa Informativa se cambiano le funzioni dell’app, le pratiche relative ai dati, i servizi di terzi o i requisiti legali. Gli aggiornamenti saranno indicati con una nuova data. Quando richiesto dalla legge, forniremo un avviso aggiuntivo o chiederemo il consenso prima che una modifica sostanziale entri in vigore."}],"ja":[{"type":"h1","text":"プライバシーポリシー - F Quiz"},{"type":"meta","html":"<strong>最終更新:</strong> 2026年9月<br><strong>アプリ:</strong> F Quiz<br><strong>開発者 / 発行者:</strong> CAREO LIMITED<br><strong>連絡先:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quizはプライバシーを尊重します。本ポリシーは、iOSおよびAndroidのモバイルアプリを利用する際に処理される可能性のある情報、その利用方法、ユーザーの権利について説明します。"},{"type":"h2","text":"1. データ処理の概要"},{"type":"p","text":"F Quizは、アプリの提供に必要な情報のみを処理します。基本機能、アカウント、ランキング、マルチプレイヤーについては、お客様が希望するサービスを提供するために処理します。セキュリティ、不正防止、信頼性の確保は、当社の正当な利益に基づきます。広告と分析は、法令で必要な場合には同意に基づき、一部の処理は法的義務を果たすために必要となる場合があります。当社は個人データを販売しません。"},{"type":"h2","text":"2. ローカル保存データ"},{"type":"p","text":"アプリは、クイズの進行状況、回答、スコア、連続記録、ライフ、ミッション、設定、言語、広告と通知の設定、予約されたリマインダー情報、オフライン進行状況、および端末内で生成された端末参照情報を端末に保存する場合があります。これらのローカル情報は、アプリの動作、選択内容の記憶、オフラインまたはゲストプレイのために使用されます。"},{"type":"h2","text":"3. 処理目的"},{"type":"ul","items":["クイズ、ミッションおよび主要機能の提供","アカウントの認証と対象となる進行状況の同期","ランキング、マルチプレイヤールームおよび対戦の運営","設定の記憶とオフラインプレイの提供","広告とアプリの性能測定、エラー診断および信頼性向上","アプリの保護、不正防止およびサポート対応"]},{"type":"h2","text":"4. オンラインアカウント、ランキング、マルチプレイヤー"},{"type":"p","text":"サインインした場合、Firebaseはメールアドレス、認証情報、アカウントID、ユーザー名または表示名、選択した旗、ポイント、ミッションの進行状況、同期データを処理する場合があります。パスワードはFirebase Authenticationによって処理され、CAREO LIMITEDが読み取り可能な形式で保存することはありません。Firebaseは登録およびサインイン時に、IPアドレスやアプリまたは端末のセキュリティ情報も処理する場合があります。ランキングでは、ユーザー名、旗、スコア、順位が他のユーザーに表示されます。対戦の同期のため、マルチプレイヤーではルーム設定、参加者のIDと名前、対戦の進行、回答、スコア、準備状況、接続状況を処理する場合があります。"},{"type":"h2","text":"5. 分析および広告診断"},{"type":"p","text":"Firebase Analyticsおよび広告診断イベントは、プラットフォーム、アプリバージョン、広告形式と配置、読み込みと表示の結果、遅延範囲、ネットワーク状態、対戦形式、広告ソースまたはアダプタ、レスポンス識別子、インプレッション単位の収益など、アプリと端末の情報および操作を処理する場合があります。これらは性能測定、広告配信の問題調査、不正防止およびアプリ改善に使用されます。メールアドレス、パスワード、クイズ回答文は広告ライフサイクルイベントに含まれません。"},{"type":"h2","text":"6. 第三者サービス"},{"type":"p","text":"本アプリは、Google Firebase Authentication、Cloud Firestore、Analytics、Google AdMob、User Messaging Platform（UMP）、ならびにApple App StoreとGoogle Playのプラットフォームサービスを利用します。これらの事業者は、それぞれの規約およびプライバシーポリシーに従って情報を処理します。"},{"type":"h2","text":"7. 広告とトラッキング"},{"type":"p","text":"Google AdMobは、バナー、インタースティシャルおよびリワード広告を配信する場合があります。端末、設定、同意および地域に応じて、Google Mobile Ads SDKは、広告、測定、不正防止のため、おおよその位置情報に用いるIPアドレス、アプリと広告の操作、診断情報、端末または広告識別子を処理する場合があります。必要な場合、Google UMPがプライバシー選択を管理します。必要と判定された場合は、プロフィールの「プライバシー設定」からUMPフォームを再度開けます。iOSではApp Tracking Transparencyの許可を求める場合もあります。非パーソナライズ広告または制限付き広告を選択しても、広告自体がなくなるとは限りません。"},{"type":"h2","text":"8. 通知"},{"type":"p","text":"許可をいただいた場合、F Quizはライフ、ミッション、ランキングの動き、アプリへの復帰を促すリマインダーに関するローカル通知を予約できます。通知の設定、内容、スケジュールは端末に保存されます。現在、F QuizはCAREO LIMITEDのサーバーへプッシュ通知トークンを送信していません。通知の許可は、アプリ内の案内または端末の設定から管理できます。"},{"type":"h2","text":"9. データ共有"},{"type":"p","text":"当社は個人データを販売しません。Firebase、Googleの広告サービス、プラットフォーム事業者は、本ポリシーに記載した目的のために情報を処理する場合があります。当社のために業務を行うサービス事業者には、適用法および当社との契約に従って個人データを保護することを求めています。ユーザー名、旗、ポイント、順位などの公開ランキング情報、および関連するマルチプレイヤー情報は、他のプレイヤーに表示される場合があります。メールアドレスとパスワードが公開ランキングや他のプレイヤーに表示されることはありません。"},{"type":"h2","text":"10. 保持と削除"},{"type":"p","html":"ローカルデータは通常、削除、アプリのリセット、またはアンインストールまで保持されます。iOSでは、ローカルで生成された端末参照情報など、システムのキーチェーンに保存された値がアンインストール後も残り、同じバンドルIDでアプリを再インストールすると再び利用可能になる場合があります。予約通知は、配信、キャンセル、またはアプリデータの削除まで残ります。アカウント、プロフィール、ランキング、同期されたミッションのデータは、アカウントが有効な間保持される場合があります。プロフィール画面または<a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">アカウント削除ページ</a>からアカウントを削除できます。削除依頼が完了すると、セキュリティ、不正防止、法的義務、バックアップのために限定的な保持が必要な場合を除き、アカウントに関連する個人データを削除または匿名化します。一部のマルチプレイヤー、広告、分析記録は、限定された運用・セキュリティ期間、または各事業者の設定とポリシーに従って保持される場合があります。"},{"type":"h2","text":"11. ユーザーの権利"},{"type":"p","text":"お住まいの地域に応じて、個人データへのアクセス、訂正、削除、処理の制限、異議申立て、データの受領、同意の撤回を行う権利を有する場合があります。アプリで一部のプロフィール情報を編集またはアカウントを削除し、その他の依頼について当社に連絡し、端末設定で広告と通知の許可を管理し、利用可能な場合はプライバシーオプションからUMPの選択を変更できます。また、英国Information Commissioner’s Officeまたは地域のデータ保護機関に苦情を申し立てることができます。同意の撤回は、撤回前に行われた処理には影響しません。"},{"type":"h2","text":"12. データセキュリティ"},{"type":"p","text":"該当する場合、外部通信にはHTTPSを使用し、データ収集を最小限にするよう設計しています。ただし、ソフトウェアや端末環境が絶対的な安全性を保証することはできません。"},{"type":"h2","text":"13. 子どものプライバシー"},{"type":"p","text":"本アプリは13歳未満の子どもを対象としていません。13歳未満の子どもから意図的に個人データを収集することはありません。子どもが個人データを提供したと思われる場合はお問い合わせください。"},{"type":"h2","text":"14. 国際データ移転"},{"type":"p","text":"Firebase、広告事業者、プラットフォーム事業者は、米国を含む英国または欧州経済領域外で情報を処理する場合があります。必要な場合、移転は十分性認定、契約上の保護措置、またはその他の適法な移転手段に基づきます。お客様のデータに適用される保護措置の詳細については、当社にお問い合わせください。"},{"type":"h2","text":"15. お問い合わせ"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. ポリシー更新"},{"type":"p","text":"アプリの機能、データの取扱い、第三者サービス、法的要件が変更された場合、本ポリシーを更新することがあります。更新時には最終更新日を変更します。法令で必要な場合、重要な変更が有効になる前に追加のお知らせを行うか、同意を求めます。"}],"ko":[{"type":"h1","text":"개인정보 처리방침 - F Quiz"},{"type":"meta","html":"<strong>마지막 업데이트:</strong> 2026년 9월<br><strong>앱:</strong> F Quiz<br><strong>개발자 / 게시자:</strong> CAREO LIMITED<br><strong>문의:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz은 개인정보를 존중합니다. 본 정책은 iOS 및 Android 모바일 앱을 사용할 때 어떤 정보가 처리될 수 있는지, 어떻게 사용되는지, 사용자의 권리가 무엇인지 설명합니다."},{"type":"h2","text":"1. 데이터 처리 개요"},{"type":"p","text":"F Quiz는 앱 제공에 필요한 정보만 처리합니다. 핵심 기능, 계정, 순위표 및 멀티플레이어 정보는 사용자가 요청한 서비스를 제공하기 위해 처리됩니다. 보안, 사기 방지 및 안정성은 당사의 정당한 이익에 근거합니다. 광고와 분석은 법에서 요구하는 경우 동의에 근거하며, 일부 처리는 법적 의무를 준수하기 위해 필요할 수 있습니다. 당사는 개인정보를 판매하지 않습니다."},{"type":"h2","text":"2. 로컬 저장 데이터"},{"type":"p","text":"앱은 퀴즈 진행 상황, 답변, 점수, 연속 기록, 라이프, 미션, 설정, 언어, 광고 및 알림 환경설정, 예약된 알림 정보, 오프라인 진행 상황과 기기에서 생성된 로컬 기기 참조값을 저장할 수 있습니다. 이러한 로컬 정보는 앱 작동, 선택 사항 기억, 오프라인 또는 게스트 플레이 지원에 사용됩니다."},{"type":"h2","text":"3. 처리 목적"},{"type":"ul","items":["퀴즈, 미션 및 핵심 기능 제공","계정 인증 및 해당 진행 상황 동기화","리더보드, 멀티플레이어 방 및 경기 운영","환경설정 기억 및 오프라인 플레이 지원","광고와 앱 성능 측정, 오류 진단 및 안정성 개선","앱 보호, 부정 사용 방지 및 지원 요청 처리"]},{"type":"h2","text":"4. 온라인 계정, 리더보드 및 멀티플레이어"},{"type":"p","text":"로그인하면 Firebase가 이메일 주소, 인증 정보, 계정 식별자, 사용자 이름 또는 표시 이름, 선택한 국기, 포인트, 미션 진행 상황 및 동기화 데이터를 처리할 수 있습니다. 비밀번호는 Firebase Authentication에서 처리되며 CAREO LIMITED가 읽을 수 있는 형태로 저장하지 않습니다. Firebase는 가입 및 로그인 과정에서 IP 주소와 앱 또는 기기 보안 정보도 처리할 수 있습니다. 순위표에서는 사용자 이름, 국기, 점수 또는 순위가 다른 사용자에게 표시됩니다. 멀티플레이어에서는 경기 동기화를 위해 방 설정, 참가자 식별자와 이름, 경기 진행 상황, 답변, 점수, 준비 및 연결 상태를 처리할 수 있습니다."},{"type":"h2","text":"5. 분석 및 광고 진단"},{"type":"p","text":"Firebase Analytics와 광고 진단 이벤트는 플랫폼, 앱 버전, 광고 형식과 위치, 로드 및 표시 결과, 지연 시간 구간, 네트워크 상태, 경기 유형, 광고 소스 또는 어댑터, 응답 식별자 및 노출 단위 수익을 포함한 앱·기기 정보와 상호작용을 처리할 수 있습니다. 이 정보는 성능 측정, 광고 전송 문제 해결, 부정 사용 방지 및 앱 개선에 사용됩니다. 이메일 주소, 비밀번호 및 퀴즈 답변 문구는 광고 수명 주기 이벤트에 포함되지 않습니다."},{"type":"h2","text":"6. 제3자 서비스"},{"type":"p","text":"앱은 Google Firebase Authentication, Cloud Firestore와 Analytics, Google AdMob과 User Messaging Platform(UMP), Apple App Store 및 Google Play 플랫폼 서비스를 사용합니다. 이러한 제공업체는 각자의 약관과 개인정보처리방침에 따라 정보를 처리합니다."},{"type":"h2","text":"7. 광고 및 추적"},{"type":"p","text":"Google AdMob은 배너, 전면 및 보상형 광고를 제공할 수 있습니다. 기기, 설정, 동의 및 지역에 따라 Google Mobile Ads SDK는 광고, 측정 및 부정행위 방지를 위해 대략적인 위치 파악용 IP 주소, 앱과 광고 상호작용, 진단 정보, 기기 또는 광고 식별자를 처리할 수 있습니다. 필요한 경우 Google UMP가 개인정보 선택을 관리합니다. 해당 옵션이 필요한 경우 프로필의 개인정보 보호 옵션에서 UMP 양식을 다시 열 수 있습니다. iOS에서는 App Tracking Transparency 권한을 요청할 수도 있습니다. 비개인 맞춤형 또는 제한된 광고를 선택해도 광고가 완전히 제거되는 것은 아닙니다."},{"type":"h2","text":"8. 알림"},{"type":"p","text":"사용자가 허용하면 F Quiz는 라이프, 미션, 순위표 활동 및 앱 복귀 알림을 위한 로컬 알림을 예약할 수 있습니다. 알림 환경설정, 내용 및 일정은 기기에 저장됩니다. 현재 F Quiz는 CAREO LIMITED 서버로 푸시 알림 토큰을 전송하지 않습니다. 알림 권한은 앱 내 안내 또는 기기 설정에서 관리할 수 있습니다."},{"type":"h2","text":"9. 데이터 공유"},{"type":"p","text":"당사는 개인정보를 판매하지 않습니다. Firebase, Google 광고 서비스 및 플랫폼 제공업체는 본 방침에 설명된 목적을 위해 정보를 처리할 수 있습니다. 당사를 대신해 처리하는 서비스 제공업체가 관련 법률과 당사와의 계약에 따라 개인정보를 보호하도록 요구합니다. 사용자 이름, 국기, 포인트, 순위와 같은 공개 순위표 정보 및 관련 멀티플레이어 정보는 다른 플레이어에게 표시될 수 있습니다. 이메일 주소와 비밀번호는 공개 순위표나 다른 플레이어에게 표시되지 않습니다."},{"type":"h2","text":"10. 보관 및 삭제"},{"type":"p","html":"로컬 데이터는 일반적으로 사용자가 삭제하거나 앱을 초기화 또는 제거할 때까지 유지됩니다. iOS에서는 로컬에서 생성된 기기 참조 정보와 같이 시스템 키체인에 저장된 값이 앱 제거 후에도 남아 있을 수 있으며, 동일한 번들 식별자로 앱을 다시 설치하면 다시 사용 가능해질 수 있습니다. 예약된 알림은 전달, 취소 또는 앱 데이터 삭제 시까지 유지됩니다. 계정, 프로필, 순위표 및 동기화된 미션 데이터는 계정이 활성 상태인 동안 보관될 수 있습니다. 프로필 화면 또는 <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">계정 삭제 페이지</a>에서 계정을 삭제할 수 있습니다. 삭제 요청이 완료되면 보안, 사기 방지, 법적 의무 또는 백업을 위해 제한적으로 보관해야 하는 경우를 제외하고 계정과 연결된 개인정보를 삭제하거나 익명화합니다. 일부 멀티플레이어, 광고 및 분석 기록은 제한된 운영 또는 보안 기간 동안이나 관련 제공업체의 설정과 방침에 따라 보관될 수 있습니다."},{"type":"h2","text":"11. 사용자 권리"},{"type":"p","text":"지역에 따라 개인정보에 대한 접근, 정정, 삭제, 처리 제한, 이의 제기, 사본 수령 및 동의 철회 권리가 있을 수 있습니다. 앱에서 일부 프로필 정보를 수정하거나 계정을 삭제하고, 다른 요청은 당사에 문의하며, 기기 설정에서 광고 및 알림 권한을 관리하고, 가능한 경우 개인정보 보호 옵션에서 UMP 선택을 변경할 수 있습니다. 영국 Information Commissioner’s Office 또는 지역 개인정보 보호 감독기관에 민원을 제기할 수도 있습니다. 동의 철회는 철회 전에 완료된 처리에는 영향을 주지 않습니다."},{"type":"h2","text":"12. 데이터 보안"},{"type":"p","text":"해당되는 경우 외부 통신에 HTTPS를 사용하며 데이터 수집을 최소화하도록 앱을 설계합니다. 어떤 소프트웨어나 기기 환경도 절대적인 보안을 보장할 수는 없습니다."},{"type":"h2","text":"13. 아동 개인정보"},{"type":"p","text":"앱은 13세 미만 아동을 대상으로 하지 않습니다. 당사는 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 아동이 개인정보를 제공했다고 생각되면 문의해 주세요."},{"type":"h2","text":"14. 국제 데이터 이전"},{"type":"p","text":"Firebase, 광고 및 플랫폼 제공업체는 미국을 포함하여 영국 또는 유럽경제지역 밖에서 정보를 처리할 수 있습니다. 필요한 경우 이전은 적정성 결정, 계약상 보호조치 또는 기타 합법적인 이전 근거에 따릅니다. 사용자 데이터에 적용되는 보호조치에 대한 자세한 내용은 당사에 문의해 주세요."},{"type":"h2","text":"15. 문의"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. 정책 업데이트"},{"type":"p","text":"앱 기능, 데이터 처리 방식, 제3자 서비스 또는 법적 요구사항이 변경되면 본 방침을 업데이트할 수 있습니다. 업데이트 시 마지막 업데이트 날짜가 변경됩니다. 법에서 요구하는 경우 중요한 변경이 적용되기 전에 추가 안내를 제공하거나 동의를 요청합니다."}],"pt":[{"type":"h1","text":"Política de Privacidade - F Quiz"},{"type":"meta","html":"<strong>Última atualização:</strong> setembro de 2026<br><strong>App:</strong> F Quiz<br><strong>Programador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz respeita a sua privacidade. Esta Política explica que informações podem ser tratadas, como são utilizadas e quais são os seus direitos ao usar a aplicação móvel em iOS e Android."},{"type":"h2","text":"1. Visão geral do tratamento de dados"},{"type":"p","text":"O F Quiz trata apenas as informações necessárias para disponibilizar a aplicação. As funcionalidades principais, contas, classificações e multijogador são tratados para prestar os serviços solicitados. A segurança, a prevenção de fraude e a fiabilidade baseiam-se nos nossos interesses legítimos. A publicidade e a análise baseiam-se no consentimento quando exigido por lei, e algum tratamento pode ser necessário para cumprir obrigações legais. Não vendemos dados pessoais."},{"type":"h2","text":"2. Dados armazenados localmente"},{"type":"p","text":"A aplicação pode guardar no dispositivo o progresso dos questionários, respostas, pontuações, sequências, vidas, missões, definições, idioma, preferências de publicidade e notificações, informações de lembretes agendados, progresso offline e uma referência do dispositivo gerada localmente. Estas informações locais são usadas para operar a aplicação, recordar escolhas e permitir a utilização offline ou como convidado."},{"type":"h2","text":"3. Finalidades do tratamento"},{"type":"ul","items":["Disponibilizar quizzes, missões e funções principais","Autenticar contas e sincronizar progresso elegível","Operar classificações, salas e partidas multiplayer","Recordar preferências e permitir jogo offline","Medir o desempenho da publicidade e da aplicação, diagnosticar erros e melhorar a fiabilidade","Proteger a aplicação, prevenir fraude e responder a pedidos de apoio"]},{"type":"h2","text":"4. Contas online, classificações e multiplayer"},{"type":"p","text":"Se iniciar sessão, o Firebase pode tratar o endereço de e-mail, credenciais de autenticação, identificador da conta, nome de utilizador ou nome apresentado, bandeira escolhida, pontos, progresso das missões e dados de sincronização. A palavra-passe é tratada pelo Firebase Authentication e não é guardada pela CAREO LIMITED de forma legível. O Firebase também pode tratar o endereço IP e informações de segurança da aplicação ou do dispositivo durante o registo e início de sessão. As classificações tornam o nome de utilizador, bandeira, pontuação ou posição visíveis para outros utilizadores. O multijogador pode tratar definições da sala, identificadores e nomes dos participantes, progresso da partida, respostas, pontuações, estado de prontidão e ligação para sincronizar partidas."},{"type":"h2","text":"5. Análise e diagnóstico de publicidade"},{"type":"p","text":"O Firebase Analytics e os eventos de diagnóstico publicitário podem tratar informações e interações da aplicação e do dispositivo, incluindo plataforma, versão da aplicação, formato e posicionamento do anúncio, resultados de carregamento e apresentação, intervalos de latência, estado da rede, tipo de partida, origem ou adaptador do anúncio, identificadores de resposta e receita por impressão. Usamos estas informações para medir o desempenho, resolver problemas de publicidade, prevenir abusos e melhorar a aplicação. Endereços de e-mail, palavras-passe e texto das respostas dos quizzes não são incluídos nos nossos eventos do ciclo de vida publicitário."},{"type":"h2","text":"6. Serviços de terceiros"},{"type":"p","text":"A aplicação utiliza Google Firebase Authentication, Cloud Firestore e Analytics, Google AdMob e User Messaging Platform (UMP), bem como serviços de plataforma da Apple App Store e Google Play. Estes fornecedores tratam informações segundo os seus próprios termos e políticas de privacidade."},{"type":"h2","text":"7. Publicidade e rastreio"},{"type":"p","text":"O Google AdMob pode fornecer anúncios banner, intersticiais e com recompensa. Conforme o dispositivo, definições, consentimento e região, o Google Mobile Ads SDK pode tratar o endereço IP para localização aproximada, interações com a aplicação e anúncios, informações de diagnóstico e identificadores do dispositivo ou de publicidade para publicidade, medição e prevenção de fraude. Quando necessário, o Google UMP gere as escolhas de privacidade. Pode reabrir o formulário UMP em Opções de privacidade no perfil quando essa opção for necessária. No iOS, também pode ser pedida a autorização App Tracking Transparency. Escolher anúncios não personalizados ou limitados não elimina necessariamente os anúncios."},{"type":"h2","text":"8. Notificações"},{"type":"p","text":"Com a sua autorização, o F Quiz pode agendar notificações locais sobre vidas, missões, atividade da classificação e lembretes para regressar à aplicação. As preferências, os conteúdos e os horários das notificações são guardados no dispositivo. Atualmente, o F Quiz não envia tokens de notificações push para os servidores da CAREO LIMITED. Pode gerir a permissão de notificações através dos avisos na aplicação ou das definições do dispositivo."},{"type":"h2","text":"9. Partilha de dados"},{"type":"p","text":"Não vendemos dados pessoais. O Firebase, os serviços de publicidade da Google e os fornecedores de plataformas podem tratar informações para os fins descritos nesta Política. Exigimos que os prestadores que atuam por nossa conta protejam os dados pessoais de acordo com a lei aplicável e os contratos celebrados connosco. Informações públicas da classificação, como nome de utilizador, bandeira, pontos e posição, e informações multijogador relevantes podem ser visíveis para outros jogadores. O seu endereço de e-mail e palavra-passe não são apresentados na classificação pública nem a outros jogadores."},{"type":"h2","text":"10. Retenção e eliminação"},{"type":"p","html":"Os dados locais permanecem, em geral, até os eliminar, repor a aplicação ou desinstalá-la. No iOS, os valores guardados no Porta-chaves do sistema, como a referência do dispositivo gerada localmente, podem persistir após a desinstalação e voltar a ficar disponíveis se a aplicação for reinstalada com o mesmo identificador de pacote. As notificações agendadas permanecem até serem entregues, canceladas ou os dados da aplicação serem removidos. Os dados da conta, perfil, classificação e missões sincronizadas podem ser conservados enquanto a conta estiver ativa. Pode eliminar a conta no perfil ou utilizar a <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">página de eliminação da conta</a>. Quando um pedido é concluído, eliminamos ou anonimizamos os dados pessoais associados à conta, salvo conservação limitada necessária para segurança, prevenção de fraude, obrigações legais ou cópias de segurança. Alguns registos multijogador, publicitários e analíticos podem ser conservados durante períodos operacionais ou de segurança limitados ou segundo as definições e políticas dos respetivos fornecedores."},{"type":"h2","text":"11. Direitos dos utilizadores"},{"type":"p","text":"Dependendo da sua localização, pode ter direitos de acesso, correção, eliminação, limitação, oposição, portabilidade e retirada do consentimento. Pode editar determinadas informações do perfil ou eliminar a conta na aplicação, contactar-nos para outros pedidos, gerir permissões de publicidade e notificações nas definições do dispositivo e alterar escolhas UMP através das Opções de privacidade quando disponíveis. Também pode apresentar reclamação ao Information Commissioner’s Office do Reino Unido ou à autoridade local de proteção de dados. A retirada do consentimento não afeta o tratamento efetuado anteriormente."},{"type":"h2","text":"12. Segurança dos dados"},{"type":"p","text":"Usamos HTTPS para comunicações externas quando aplicável e concebemos as nossas apps para minimizar a recolha de dados. Nenhum software ou dispositivo pode garantir segurança absoluta."},{"type":"h2","text":"13. Privacidade das crianças"},{"type":"p","text":"A app não se destina a crianças menores de 13 anos. Não recolhemos conscientemente dados pessoais de crianças menores de 13 anos. Se acredita que uma criança forneceu dados pessoais, contacte-nos."},{"type":"h2","text":"14. Transferências internacionais"},{"type":"p","text":"O Firebase e os fornecedores de publicidade e plataformas podem tratar informações fora do Reino Unido ou do Espaço Económico Europeu, incluindo nos Estados Unidos. Quando necessário, as transferências baseiam-se em decisões de adequação, garantias contratuais ou outro mecanismo legal. Contacte-nos para obter mais informações sobre as garantias aplicáveis aos seus dados."},{"type":"h2","text":"15. Contacto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Atualizações da Política"},{"type":"p","text":"Podemos atualizar esta Política se mudarem as funcionalidades, práticas de dados, serviços terceiros ou requisitos legais. As atualizações serão indicadas com uma nova data. Quando exigido por lei, apresentaremos um aviso adicional ou solicitaremos consentimento antes de uma alteração material entrar em vigor."}],"ru":[{"type":"h1","text":"Политика конфиденциальности - F Quiz"},{"type":"meta","html":"<strong>Последнее обновление:</strong> сентябрь 2026 г.<br><strong>Приложение:</strong> F Quiz<br><strong>Разработчик / Издатель:</strong> CAREO LIMITED<br><strong>Контакт:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz уважает вашу конфиденциальность. Эта Политика объясняет, какие сведения могут обрабатываться, как они используются и какие права у вас есть при использовании мобильного приложения на iOS и Android."},{"type":"h2","text":"1. Обзор обработки данных"},{"type":"p","text":"F Quiz обрабатывает только информацию, необходимую для работы приложения. Основные функции, учётные записи, таблицы лидеров и многопользовательский режим обрабатываются для предоставления запрошенных вами услуг. Безопасность, предотвращение мошенничества и надёжность основаны на наших законных интересах. Реклама и аналитика основываются на согласии, когда этого требует закон, а отдельная обработка может быть необходима для выполнения юридических обязанностей. Мы не продаём персональные данные."},{"type":"h2","text":"2. Локально хранимые данные"},{"type":"p","text":"Приложение может хранить на устройстве прогресс викторин, ответы, баллы, серии, жизни, задания, настройки, язык, рекламные предпочтения и настройки уведомлений, сведения о запланированных напоминаниях, офлайн-прогресс и созданный локально идентификатор устройства. Эти локальные сведения используются для работы приложения, сохранения вашего выбора и поддержки офлайн-режима или игры в качестве гостя."},{"type":"h2","text":"3. Цели обработки"},{"type":"ul","items":["Предоставление викторин, заданий и основных функций","Аутентификация аккаунтов и синхронизация подходящего прогресса","Работа таблиц лидеров, мультиплеерных комнат и матчей","Сохранение настроек и поддержка офлайн-игры","Измерение эффективности рекламы и приложения, диагностика ошибок и повышение надежности","Защита приложения, предотвращение мошенничества и обработка обращений в поддержку"]},{"type":"h2","text":"4. Онлайн-аккаунты, таблицы лидеров и мультиплеер"},{"type":"p","text":"При входе Firebase может обрабатывать адрес электронной почты, данные аутентификации, идентификатор учётной записи, имя пользователя или отображаемое имя, выбранный флаг, баллы, прогресс заданий и данные синхронизации. Пароль обрабатывается Firebase Authentication и не хранится CAREO LIMITED в читаемом виде. Во время регистрации и входа Firebase также может обрабатывать IP-адрес и сведения о безопасности приложения или устройства. В таблице лидеров другим пользователям видны имя, флаг, счёт или место. Для синхронизации многопользовательских матчей могут обрабатываться настройки комнаты, идентификаторы и имена участников, ход матча, ответы, счёт, готовность и состояние подключения."},{"type":"h2","text":"5. Аналитика и диагностика рекламы"},{"type":"p","text":"Firebase Analytics и события диагностики рекламы могут обрабатывать сведения о приложении и устройстве и взаимодействиях, включая платформу, версию приложения, формат и место рекламы, результаты загрузки и показа, диапазоны задержки, состояние сети, тип матча, источник или адаптер рекламы, идентификаторы ответа и доход на уровне показа. Эти данные используются для измерения эффективности, поиска проблем с рекламой, предотвращения злоупотреблений и улучшения приложения. Адреса электронной почты, пароли и тексты ответов викторины не включаются в наши события жизненного цикла рекламы."},{"type":"h2","text":"6. Сторонние сервисы"},{"type":"p","text":"Приложение использует Google Firebase Authentication, Cloud Firestore и Analytics, Google AdMob и User Messaging Platform (UMP), а также платформенные сервисы Apple App Store и Google Play. Эти поставщики обрабатывают информацию согласно собственным условиям и политикам конфиденциальности."},{"type":"h2","text":"7. Реклама и отслеживание"},{"type":"p","text":"Google AdMob может предоставлять баннерную, межстраничную и вознаграждаемую рекламу. В зависимости от устройства, настроек, согласия и региона Google Mobile Ads SDK может обрабатывать IP-адрес для приблизительного местоположения, взаимодействия с приложением и рекламой, диагностические сведения и идентификаторы устройства или рекламы в целях рекламы, измерения и предотвращения мошенничества. При необходимости Google UMP управляет настройками конфиденциальности. Форму UMP можно снова открыть через Настройки конфиденциальности в профиле, когда этот пункт требуется. В iOS также может запрашиваться разрешение App Tracking Transparency. Выбор неперсонализированной или ограниченной рекламы не обязательно удаляет рекламу."},{"type":"h2","text":"8. Уведомления"},{"type":"p","text":"С вашего разрешения F Quiz может планировать локальные уведомления о жизнях, заданиях, активности в таблице лидеров и напоминаниях о возвращении в приложение. Настройки, содержание и расписание уведомлений хранятся на устройстве. В настоящее время F Quiz не отправляет токен push-уведомлений на серверы CAREO LIMITED. Управлять разрешением на уведомления можно через подсказки в приложении или в настройках устройства."},{"type":"h2","text":"9. Передача данных"},{"type":"p","text":"Мы не продаём персональные данные. Firebase, рекламные сервисы Google и поставщики платформ могут обрабатывать информацию для целей, описанных в настоящей Политике. Мы требуем, чтобы поставщики, действующие от нашего имени, защищали персональные данные в соответствии с применимым законодательством и договорами с нами. Общедоступные сведения таблицы лидеров, такие как имя пользователя, флаг, баллы и место, а также относящиеся к матчу сведения могут быть видны другим игрокам. Адрес электронной почты и пароль не отображаются в публичной таблице лидеров и не показываются другим игрокам."},{"type":"h2","text":"10. Хранение и удаление"},{"type":"p","html":"Локальные данные обычно хранятся, пока вы не удалите их, не сбросите приложение или не удалите его с устройства. В iOS значения, сохранённые в системной Связке ключей, например локально созданный идентификатор устройства, могут сохраниться после удаления приложения и снова стать доступными при его переустановке с тем же идентификатором пакета. Запланированные уведомления сохраняются до доставки, отмены или удаления данных приложения. Данные учётной записи, профиля, таблицы лидеров и синхронизированных заданий могут храниться, пока учётная запись активна. Удалить учётную запись можно в профиле или на <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">странице удаления учётной записи</a>. После выполнения запроса мы удаляем или обезличиваем связанные с учётной записью персональные данные, кроме случаев ограниченного хранения для безопасности, предотвращения мошенничества, выполнения юридических обязанностей или резервного копирования. Некоторые многопользовательские, рекламные и аналитические записи могут храниться в течение ограниченных операционных сроков или сроков безопасности либо согласно настройкам и политикам соответствующих поставщиков."},{"type":"h2","text":"11. Права пользователя"},{"type":"p","text":"В зависимости от вашего местонахождения вы можете иметь права на доступ, исправление, удаление, ограничение обработки, возражение, получение копии данных и отзыв согласия. Вы можете изменить отдельные сведения профиля или удалить учётную запись в приложении, обратиться к нам с другими запросами, управлять разрешениями рекламы и уведомлений в настройках устройства и изменять выбор UMP через параметры конфиденциальности. Вы также можете подать жалобу в британское Information Commissioner’s Office или местный орган по защите данных. Отзыв согласия не влияет на обработку, выполненную до его отзыва."},{"type":"h2","text":"12. Безопасность данных"},{"type":"p","text":"Мы используем HTTPS для внешних соединений, где это применимо, и проектируем приложения так, чтобы минимизировать сбор данных. Ни одна программная или аппаратная среда не может гарантировать абсолютную безопасность."},{"type":"h2","text":"13. Конфиденциальность детей"},{"type":"p","text":"Приложение не предназначено для детей младше 13 лет. Мы сознательно не собираем персональные данные детей младше 13 лет. Если вы считаете, что ребенок предоставил персональные данные, свяжитесь с нами."},{"type":"h2","text":"14. Международная передача данных"},{"type":"p","text":"Firebase, рекламные и платформенные поставщики могут обрабатывать информацию за пределами Великобритании или Европейской экономической зоны, в том числе в США. При необходимости передача основывается на решениях об адекватности, договорных гарантиях или другом законном механизме. Свяжитесь с нами, если вам нужна дополнительная информация о гарантиях, применимых к вашим данным."},{"type":"h2","text":"15. Контакты"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Обновления Политики"},{"type":"p","text":"Мы можем обновлять настоящую Политику при изменении функций приложения, практик обработки данных, сторонних сервисов или требований закона. Обновления будут отмечены новой датой. Когда это требуется законом, до вступления существенных изменений в силу мы направим дополнительное уведомление или запросим согласие."}],"es":[{"type":"h1","text":"Política de privacidad - F Quiz"},{"type":"meta","html":"<strong>Última actualización:</strong> septiembre de 2026<br><strong>App:</strong> F Quiz<br><strong>Desarrollador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz respeta tu privacidad. Esta Política explica qué información puede procesarse, cómo se utiliza y cuáles son tus derechos al usar la aplicación móvil en iOS y Android."},{"type":"h2","text":"1. Resumen del procesamiento de datos"},{"type":"p","text":"F Quiz trata únicamente la información necesaria para ofrecer la aplicación. Las funciones principales, las cuentas, las clasificaciones y el modo multijugador se tratan para prestar los servicios que solicitas. La seguridad, la prevención del fraude y la fiabilidad se basan en nuestros intereses legítimos. La publicidad y los análisis se basan en el consentimiento cuando lo exige la ley, y determinados tratamientos pueden ser necesarios para cumplir obligaciones legales. No vendemos datos personales."},{"type":"h2","text":"2. Datos almacenados localmente"},{"type":"p","text":"La aplicación puede guardar en el dispositivo el progreso de los cuestionarios, respuestas, puntuaciones, rachas, vidas, misiones, ajustes, idioma, preferencias de publicidad y notificaciones, información sobre recordatorios programados, progreso sin conexión y una referencia del dispositivo generada localmente. Esta información local se usa para hacer funcionar la aplicación, recordar tus elecciones y permitir el uso sin conexión o como invitado."},{"type":"h2","text":"3. Finalidades del procesamiento"},{"type":"ul","items":["Ofrecer cuestionarios, misiones y funciones principales","Autenticar cuentas y sincronizar el progreso correspondiente","Gestionar clasificaciones, salas y partidas multijugador","Recordar preferencias y permitir juego sin conexión","Medir el rendimiento de la publicidad y la aplicación, diagnosticar errores y mejorar la fiabilidad","Proteger la aplicación, prevenir el fraude y responder a solicitudes de asistencia"]},{"type":"h2","text":"4. Cuentas en línea, clasificaciones y multijugador"},{"type":"p","text":"Si inicias sesión, Firebase puede tratar tu dirección de correo electrónico, credenciales de autenticación, identificador de cuenta, nombre de usuario o nombre visible, bandera elegida, puntos, progreso de misiones y datos de sincronización. La contraseña es gestionada por Firebase Authentication y CAREO LIMITED no la guarda de forma legible. Firebase también puede tratar la dirección IP e información de seguridad de la aplicación o el dispositivo durante el registro y el inicio de sesión. Las clasificaciones muestran a otros usuarios tu nombre, bandera, puntuación o puesto. El multijugador puede tratar ajustes de la sala, identificadores y nombres de participantes, progreso de la partida, respuestas, puntuaciones, estados de preparación y conexión para sincronizar las partidas."},{"type":"h2","text":"5. Análisis y diagnóstico publicitario"},{"type":"p","text":"Firebase Analytics y los eventos de diagnóstico publicitario pueden tratar información e interacciones de la aplicación y el dispositivo, como plataforma, versión, formato y ubicación del anuncio, resultados de carga y visualización, rangos de latencia, estado de red, tipo de partida, fuente o adaptador publicitario, identificadores de respuesta e ingresos por impresión. Usamos esta información para medir el rendimiento, resolver problemas de anuncios, prevenir abusos y mejorar la aplicación. Las direcciones de correo electrónico, contraseñas y textos de respuestas del cuestionario no se incluyen en nuestros eventos del ciclo publicitario."},{"type":"h2","text":"6. Servicios de terceros"},{"type":"p","text":"La aplicación utiliza Google Firebase Authentication, Cloud Firestore y Analytics, Google AdMob y User Messaging Platform (UMP), además de servicios de plataforma de Apple App Store y Google Play. Estos proveedores tratan la información según sus propios términos y políticas de privacidad."},{"type":"h2","text":"7. Publicidad y seguimiento"},{"type":"p","text":"Google AdMob puede ofrecer anuncios de banner, intersticiales y recompensados. Según el dispositivo, los ajustes, el consentimiento y la región, Google Mobile Ads SDK puede tratar la dirección IP para obtener una ubicación aproximada, interacciones con la aplicación y los anuncios, información de diagnóstico e identificadores del dispositivo o publicitarios con fines de publicidad, medición y prevención del fraude. Cuando sea necesario, Google UMP gestiona las opciones de privacidad. Puedes volver a abrir el formulario UMP desde Opciones de privacidad en tu perfil cuando esta opción sea obligatoria. En iOS también puede solicitarse permiso de App Tracking Transparency. Elegir anuncios no personalizados o limitados no elimina necesariamente los anuncios."},{"type":"h2","text":"8. Notificaciones"},{"type":"p","text":"Con tu permiso, F Quiz puede programar notificaciones locales sobre vidas, misiones, actividad de la clasificación y recordatorios para volver a la aplicación. Las preferencias, el contenido y los horarios de las notificaciones se guardan en el dispositivo. Actualmente F Quiz no envía ningún token de notificaciones push a los servidores de CAREO LIMITED. Puedes gestionar el permiso de notificaciones mediante los avisos de la aplicación o los ajustes del dispositivo."},{"type":"h2","text":"9. Compartición de datos"},{"type":"p","text":"No vendemos datos personales. Firebase, los servicios publicitarios de Google y los proveedores de plataformas pueden tratar información para los fines descritos en esta Política. Exigimos que los proveedores que actúan por cuenta nuestra protejan los datos personales de acuerdo con la legislación aplicable y sus contratos con nosotros. Los datos públicos de la clasificación, como nombre de usuario, bandera, puntos y puesto, y los datos multijugador relevantes pueden ser visibles para otros jugadores. Tu dirección de correo electrónico y contraseña no se muestran en la clasificación pública ni a otros jugadores."},{"type":"h2","text":"10. Conservación y eliminación"},{"type":"p","html":"Los datos locales permanecen, por lo general, hasta que los elimines, restablezcas la aplicación o la desinstales. En iOS, los valores guardados en el llavero del sistema, como la referencia del dispositivo generada localmente, pueden persistir tras la desinstalación y volver a estar disponibles si la aplicación se reinstala con el mismo identificador de paquete. Las notificaciones programadas permanecen hasta que se entregan, se cancelan o se eliminan los datos de la aplicación. Los datos de cuenta, perfil, clasificación y misiones sincronizadas pueden conservarse mientras la cuenta esté activa. Puedes eliminar la cuenta desde el perfil o usar la <a href=\"https://careolimited.com/privacy/fquiz-account-deletion.html\">página de eliminación de cuenta</a>. Cuando se completa una solicitud, eliminamos o anonimizamos los datos personales vinculados a la cuenta, salvo una conservación limitada necesaria para seguridad, prevención del fraude, obligaciones legales o copias de seguridad. Algunos registros multijugador, publicitarios y analíticos pueden conservarse durante periodos operativos o de seguridad limitados o según los ajustes y políticas de los proveedores correspondientes."},{"type":"h2","text":"11. Derechos del usuario"},{"type":"p","text":"Según tu ubicación, puedes tener derechos de acceso, corrección, eliminación, limitación, oposición, portabilidad y retirada del consentimiento. Puedes editar determinados datos del perfil o eliminar la cuenta en la aplicación, contactarnos para otras solicitudes, gestionar permisos de publicidad y notificaciones en los ajustes del dispositivo y cambiar las opciones de UMP desde Opciones de privacidad cuando estén disponibles. También puedes reclamar ante la Information Commissioner’s Office del Reino Unido o tu autoridad local de protección de datos. La retirada del consentimiento no afecta al tratamiento realizado anteriormente."},{"type":"h2","text":"12. Seguridad de datos"},{"type":"p","text":"Usamos HTTPS para comunicaciones externas cuando corresponde y diseñamos nuestras apps para minimizar la recopilación de datos. Ningún software o dispositivo puede garantizar seguridad absoluta."},{"type":"h2","text":"13. Privacidad de menores"},{"type":"p","text":"La app no está dirigida a menores de 13 años. No recopilamos conscientemente datos personales de menores de 13 años. Si crees que un menor proporcionó datos personales, contáctanos."},{"type":"h2","text":"14. Transferencias internacionales"},{"type":"p","text":"Firebase y los proveedores de publicidad y plataformas pueden tratar información fuera del Reino Unido o del Espacio Económico Europeo, incluidos los Estados Unidos. Cuando sea necesario, las transferencias se basan en decisiones de adecuación, garantías contractuales u otro mecanismo legal. Contacta con nosotros para obtener más información sobre las garantías aplicables a tus datos."},{"type":"h2","text":"15. Contacto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>71-75 Shelton Street, Covent Garden, London, United Kingdom, WC2H 9JQ<br>careolimited@gmail.com<br>F Quiz - Privacy Inquiry"},{"type":"h2","text":"16. Actualizaciones de la Política"},{"type":"p","text":"Podemos actualizar esta Política si cambian las funciones, las prácticas de datos, los servicios de terceros o los requisitos legales. Las actualizaciones se indicarán con una nueva fecha. Cuando lo exija la ley, proporcionaremos un aviso adicional o solicitaremos consentimiento antes de que entre en vigor un cambio importante."}],"tr":[{"type":"h1","text":"Gizlilik Politikası - F Quiz"},{"type":"meta","html":"<strong>Son güncelleme:</strong> Eylül 2026<br><strong>Uygulama:</strong> F Quiz<br><strong>Geliştirici / Yayıncı:</strong> CAREO LIMITED<br><strong>İletişim:</strong> careolimited@gmail.com"},{"type":"p","text":"F Quiz gizliliğinize saygı duyar. Bu Politika, iOS ve Android mobil uygulamasını kullanırken hangi bilgilerin işlenebileceğini, nasıl kullanıldığını ve haklarınızı açıklar."},{"type":"h2","text":"1. Veri İşleme Özeti"},{"type":"p","text":"F Quiz yalnızca uygulamayı sunmak için gerekli bilgileri işler. Temel özellikler, hesaplar, liderlik tabloları ve multiplayer hizmetleri talep ettiğiniz hizmetleri sağlamak amacıyla işlenir. Güvenlik, sahtekârlığı önleme ve güvenilirlik çalışmalarımız meşru menfaatlerimize dayanır. Reklam ve analiz işlemleri kanunen gerekli olduğunda onayınıza dayanır; bazı işlemler de yasal yükümlülükleri yerine getirmek için gerekli olabilir. Kişisel verileri satmayız."},{"type":"h2","text":"2. Yerel Olarak Saklanan Veriler"},{"type":"p","text":"Uygulama; quiz ilerlemesini, cevapları, puanları, serileri, canları, görevleri, ayarları, dili, reklam ve bildirim tercihlerini, planlanan hatırlatıcı bilgilerini, çevrimdışı ilerlemeyi ve cihazda yerel olarak oluşturulan bir cihaz referansını saklayabilir. Bu yerel bilgiler uygulamayı çalıştırmak, seçimlerinizi hatırlamak ve çevrimdışı ya da misafir kullanımını desteklemek için kullanılır."},{"type":"h2","text":"3. İşleme Amaçları"},{"type":"ul","items":["Quizleri, görevleri ve temel uygulama özelliklerini sunmak","Hesapları doğrulamak ve uygun ilerlemeyi senkronize etmek","Liderlik tablolarını, multiplayer odalarını ve maçları işletmek","Tercihleri hatırlamak ve çevrimdışı oynamayı desteklemek","Reklam ve uygulama performansını ölçmek, hataları teşhis etmek ve güvenilirliği artırmak","Uygulamayı korumak, sahtekârlığı önlemek ve destek taleplerini yanıtlamak"]},{"type":"h2","text":"4. Çevrimiçi Hesaplar, Liderlik Tabloları ve Multiplayer"},{"type":"p","text":"Giriş yaparsanız Firebase; e-posta adresinizi, kimlik doğrulama bilgilerinizi, hesap kimliğinizi, kullanıcı veya görünen adınızı, seçtiğiniz bayrağı, puanlarınızı, görev ilerlemenizi ve senkro
