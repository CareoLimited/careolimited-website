  <style>
    :root {
      --bg: #090909;
      --surface: #121212;
      --surface-2: #191919;
      --border: #303030;
      --text: #f5f5f5;
      --muted: #b7b7b7;
      --red: #f10600;
      --yellow: #ffc400;
      --green: #55d26f;
      --max: 880px;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; }
    .shell { width: min(calc(100% - 32px), var(--max)); margin: 0 auto; padding: 24px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand-link { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; }
    .brand-link img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    .language-select {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }
    .hero { border-top: 4px solid var(--red); border-bottom: 1px solid var(--border); padding: 34px 0 30px; }
    .eyebrow { margin: 0 0 8px; color: var(--yellow); font-size: 0.82rem; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.08; letter-spacing: 0; }
    .hero p { max-width: 680px; margin: 14px 0 0; color: var(--muted); font-size: 1.05rem; }
    main { padding-top: 8px; }
    section { padding: 26px 0; border-bottom: 1px solid var(--border); }
    h2 { margin: 0 0 12px; font-size: 1.25rem; letter-spacing: 0; }
    h2::before { content: ""; display: inline-block; width: 4px; height: 1em; margin-right: 10px; background: var(--red); vertical-align: -0.08em; }
    p { margin: 0 0 12px; color: var(--muted); }
    ol, ul { margin: 14px 0 0; padding-left: 24px; color: var(--muted); }
    li { margin: 9px 0; padding-left: 4px; }
    li strong { color: var(--text); }
    .notice { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--yellow); background: var(--surface); color: var(--text); }
    .privacy-note { border-left-color: var(--green); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--red);
      border-radius: 6px;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
    .button.secondary { border-color: var(--border); background: var(--surface-2); }
    footer { padding-top: 24px; color: #8f8f8f; font-size: 0.9rem; }
    @media (max-width: 560px) {
      .shell { width: min(calc(100% - 24px), var(--max)); padding-top: 14px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .language-select { width: 100%; }
      .hero { padding: 26px 0 24px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
  <link rel="stylesheet" href="privacy-theme.css">
</head>

    const supported = Object.keys(translations);
    const params = new URLSearchParams(window.location.search);
    const requested = (params.get("lang") || "en").toLowerCase().split(/[-_]/)[0];
    const languageSelect = document.getElementById("languageSelect");
    const homeLabels = { en:"← Home", fr:"← Accueil", de:"← Startseite", it:"← Home", ja:"← ホーム", ko:"← 홈", pt:"← Início", ru:"← Главная", es:"← Inicio", tr:"← Ana Sayfa" };

    function section(title, body) {
      return `<section><h2>${title}</h2>${body}</section>`;
    }

    function list(items, ordered = false) {
      const tag = ordered ? "ol" : "ul";
      return `<${tag}>${items.map((item) => `<li>${item}</li>`).join("")}</${tag}>`;
    }

    function render(language) {
      const lang = supported.includes(language) ? language : "en";
      const t = translations[lang];
      document.documentElement.lang = lang;
      document.title = `${t.title} - Dishtopia`;
      languageSelect.value = lang;
      languageSelect.setAttribute("aria-label", t.eyebrow);
      document.getElementById("eyebrow").textContent = t.eyebrow;
      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("homeLink").textContent = homeLabels[lang] || homeLabels.en;
      document.getElementById("homeLink").href = `../index.html?lang=${encodeURIComponent(lang)}#apps`;

      const subject = encodeURIComponent("Dishtopia Account Deletion");
      const privacyUrl = `dishtopia.html?lang=${encodeURIComponent(lang)}`;
      document.getElementById("content").innerHTML =
        section(t.inAppTitle, `<p>${t.inAppIntro}</p>${list(t.steps, true)}<div class="notice">${t.warning}</div>`) +
        section(t.deletedTitle, `<p>${t.deletedIntro}</p>${list(t.deleted)}`) +
        section(t.retainedTitle, list(t.retained)) +
        section(t.timingTitle, `<p>${t.timing}</p>`) +
        section(t.helpTitle, `<p>${t.help}</p><div class="actions"><a class="button" href="mailto:${EMAIL}?subject=${subject}">${t.emailButton}</a><a class="button secondary" href="${privacyUrl}">${t.privacyButton}</a></div><div class="notice privacy-note">${t.privacyNote}</div>`);
      document.getElementById("footer").textContent = t.footer;

      
      const url = new URL(window.location.href);
      url.searchParams.set("lang", lang);
      window.history.replaceState(null, "", url.toString());
    }

    languageSelect.addEventListener("change", (event) => render(event.target.value));
    render(supported.includes(requested) ? requested : "en");
  </script>
