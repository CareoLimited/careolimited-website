) и передаёт каждый запрос компании Anthropic, PBC, модели Claude которой формируют результат. Cloudflare и Anthropic выступают поставщиками услуг (обработчиками) для этих функций.","Ваш текст используется только для получения запрошенного результата. Согласно коммерческим условиям Anthropic, контент, отправленный через её API, не используется для обучения её моделей ИИ. Anthropic может хранить входные и выходные данные в течение ограниченного времени в целях безопасности и соблюдения законодательства, как описано в её собственной политике конфиденциальности.","CAREO LIMITED не хранит на своих серверах содержимое вашего резюме, описания вакансии или текста конструктора. ИИ-сервис записывает только техническую информацию, например время и тип запроса, коды ошибок и счётчики использования, и ведёт ежедневный счётчик запросов для каждого идентификатора устройства, чтобы предотвращать злоупотребления.","Cloudflare может обрабатывать техническую информацию о запросе, например IP-адрес и время запроса, для работы своей сети в соответствии с собственной политикой конфиденциальности.","Функции ИИ требуют подключения к интернету и недоступны в офлайн-режиме."]},{"type":"h2","text":"5. Цели обработки"},{"type":"ul","items":["Предоставление анализа CV, сопоставления с вакансией, конструктора CV, экспорта, истории и настроек","Создавать с помощью ИИ анализ резюме, результаты подбора, сопроводительные письма, вопросы для собеседования и предложения по формулировкам","Сохранение пользовательских настроек и черновиков","Применение бесплатных лимитов и правил Premium-доступа","Обработка покупок или Premium-доступа, если применимо","Повышение стабильности, предотвращение злоупотреблений и надежная работа приложения"]},{"type":"h2","text":"6. Сторонние и платформенные сервисы"},{"type":"p","text":"Приложение может использовать платформенные или сторонние сервисы, включая Apple App Store, Google Play, встроенные сервисы отзывов Apple или Google, инструменты устройства для файлов/фото/камеры/обмена/печати и рендеринг шрифтов, используемый для оформления PDF-экспорта. Эти сервисы работают согласно собственным политикам конфиденциальности. Функции ИИ используют Cloudflare (хостинг ИИ-сервиса CVPilot) и Anthropic (модели ИИ Claude), как описано в разделе 4."},{"type":"h2","text":"7. Реклама и отслеживание"},{"type":"p","text":"CVPilot не показывает стороннюю рекламу и не использует сторонние SDK для рекламного отслеживания. Текст, который вы отправляете для функций ИИ, используется только для работы этих функций и никогда не используется для рекламы."},{"type":"h2","text":"8. Автоматизированные результаты, точность и ответственность пользователя"},{"type":"p","text":"CVPilot предоставляет автоматизированные, созданные ИИ анализ резюме, подбор вакансий, оценки, рекомендации по ключевым словам, сопроводительные письма, вопросы для собеседования и предложения по формулировкам исключительно в информационных целях. Созданный ИИ контент может содержать ошибки или утверждения, которые не соответствуют действительности в вашем случае, а результаты могут быть неполными, неточными, устаревшими или неподходящими для конкретного работодателя, отрасли, системы отслеживания кандидатов или процесса найма. Никогда не добавляйте навыки, опыт или результаты, которых у вас нет. CVPilot не гарантирует собеседования, предложения о работе, результаты найма, принятие резюме, точность оценок или совместимость со всеми системами подбора персонала. Вы несёте ответственность за проверку всех результатов перед использованием, проверку своего резюме и материалов для отклика, а также за собственные карьерные, юридические, финансовые и профессиональные решения и решения о найме и отклике на вакансии."},{"type":"h2","text":"9. Лучшая работа и поддерживаемый ввод"},{"type":"p","text":"Для лучших результатов используйте понятные CV и описания вакансий на английском языке со стандартными заголовками разделов, полным опытом работы, навыками, обязанностями, требованиями и измеримыми достижениями. CVPilot может работать менее точно с неанглийским контентом, неполными вакансиями, узкоспециализированными или редкими ролями, необычным форматированием CV, сканированными или размытыми файлами, изображениями с низким качеством текста или документами, из которых текст нельзя надежно извлечь."},{"type":"h2","text":"10. Покупки и функции Premium"},{"type":"p","text":"Необязательные покупки, подписки или доступ Premium могут обрабатываться Apple App Store или Google Play. Мы не получаем и не храним полные данные платежной карты. Статус покупки, право на подписку, продление, отмена, обработка возвратов и данные учетной записи магазина могут управляться соответствующим магазином приложений согласно его собственным условиям и политике конфиденциальности. Статус покупки может храниться локально или проверяться через соответствующий магазин."},{"type":"h2","text":"11. Передача данных"},{"type":"p","text":"Мы не продаём персональные данные. Текст, который вы отправляете для функций ИИ, передаётся Cloudflare и Anthropic только для получения запрошенного результата, как описано в разделе 4. Прочий хранящийся локально контент приложения не передаётся на серверы CAREO LIMITED. Ограниченные данные могут обрабатываться платформами или сторонними поставщиками только так, как описано в настоящей Политике, или когда вы используете функции отправки, печати, магазина, отзывов или импорта по URL."},{"type":"h2","text":"12. Хранение и удаление данных"},{"type":"p","text":"Локальные данные остаются на вашем устройстве, пока вы не удалите сохраненные записи, если это доступно, не сбросите соответствующие данные приложения, если это доступно, или не удалите приложение. Временные файлы экспорта могут храниться в кэше устройства. Платежные записи и платформенные записи оценок или покупок хранятся Apple или Google согласно их политикам. Текст, отправленный для функций ИИ, не хранится на серверах CAREO LIMITED после возврата результата; Anthropic может хранить его ограниченное время, как описано в разделе 4. Ежедневный счётчик запросов используется только для применения лимитов использования."},{"type":"h2","text":"13. Права пользователя"},{"type":"p","text":"В зависимости от вашего региона у вас могут быть права на доступ, исправление, удаление, ограничение или возражение против обработки. Поскольку большинство данных хранится локально, обычно ими можно управлять или удалить их через приложение или настройки устройства. Вы также можете связаться с нами по вопросам конфиденциальности. CAREO LIMITED не хранит копию текста, отправленного в функции ИИ, поэтому обычно с нашей стороны нечего просматривать или удалять; свяжитесь с нами, если у вас есть вопросы об этой обработке."},{"type":"h2","text":"14. Безопасность данных"},{"type":"p","text":"Мы используем HTTPS для внешних соединений, где это применимо, и проектируем приложения так, чтобы минимизировать сбор данных. Ни одна программная или аппаратная среда не может гарантировать абсолютную безопасность. ИИ-сервис CVPilot принимает запросы только от приложения по HTTPS и хранит ключ доступа поставщика ИИ на сервере, а не в приложении."},{"type":"h2","text":"15. Конфиденциальность детей"},{"type":"p","text":"Приложение не предназначено для детей младше 13 лет. Мы сознательно не собираем персональные данные детей младше 13 лет. Если вы считаете, что ребенок предоставил персональные данные, свяжитесь с нами, и мы примем соответствующие меры."},{"type":"h2","text":"16. Международная передача данных"},{"type":"p","text":"Платформы и сторонние поставщики могут обрабатывать ограниченные данные в других странах. Текст, который вы отправляете для функций ИИ, обрабатывается Anthropic в США и проходит через глобальную сеть Cloudflare. Если этого требует закон, применяются надлежащие меры защиты."},{"type":"h2","text":"17. Контакты"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Обновления Политики"},{"type":"p","text":"Мы можем обновлять эту Политику при изменении функций приложения, сторонних сервисов или требований закона. Обновления будут отражены новой датой. Продолжение использования приложения после обновления означает принятие обновленной Политики."}],"es":[{"type":"h1","text":"Política de privacidad - CVPilot"},{"type":"meta","html":"<strong>Última actualización:</strong> octubre de 2026<br><strong>App:</strong> CVPilot<br><strong>Desarrollador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot respeta tu privacidad. Esta Política explica qué información puede procesarse, cómo se utiliza y cuáles son tus derechos al usar la aplicación móvil en iOS y Android."},{"type":"h2","text":"1. Resumen del procesamiento de datos"},{"type":"p","text":"La mayoría de los datos de CVPilot permanecen en tu dispositivo. Para ofrecer análisis de CV, coincidencia con ofertas, cartas de presentación, preguntas de entrevista y sugerencias de redacción, el texto que envías para estas funciones se envía al servicio de IA de CVPilot y lo procesan los modelos de IA Claude de Anthropic, como se describe en la Sección 4. No vendemos datos personales y solo usamos servicios de terceros cuando son necesarios para las funciones descritas a continuación."},{"type":"h2","text":"2. Datos almacenados localmente"},{"type":"p","text":"La app puede almacenar localmente en tu dispositivo contenido del CV, texto de descripciones de puesto, resultados de análisis y coincidencia, historial, límites de uso, preferencias, datos de perfil, borradores del creador de CV, contadores de exportación, estado de solicitudes de reseña y estado Premium. Estos datos se usan para ofrecer funciones, recordar preferencias, permitir uso sin conexión cuando esté disponible y mantener una experiencia consistente. Algunos registros locales pueden incluir el texto del CV o de la descripción de puesto que introdujiste, importaste o guardaste como borrador. La app también guarda un identificador de dispositivo aleatorio generado por la app, tu elección sobre el procesamiento con IA y los resultados de IA recientes, para que el mismo texto devuelva el mismo resultado sin volver a enviarse."},{"type":"h2","text":"3. Archivos, fotos, cámara, portapapeles e importaciones por URL"},{"type":"ul","items":["Si importas un CV desde Archivos, Fotos o Cámara, el archivo o imagen seleccionado se procesa para extraer texto del CV.","El acceso a la biblioteca de fotos y a la cámara se solicita solo cuando eliges importar o capturar una imagen de CV.","El acceso al portapapeles se usa solo cuando eliges pegar o copiar texto de CV, descripción de puesto o contacto de soporte.","Si importas una descripción de puesto desde una URL, la app se conecta a ese sitio web para recuperar texto legible. El sitio puede recibir información técnica ordinaria de la solicitud, como dirección IP, agente de usuario, hora de la solicitud y URL solicitada, según su propia política de privacidad.","El análisis de archivos, la extracción de texto de PDF, la conversión DOCX y el OCR de imágenes pueden ser incompletos o imprecisos, especialmente en documentos escaneados, borrosos, protegidos, inusuales o mal formateados.","Al exportar un CV como PDF, la app puede crear un archivo temporal y usar las herramientas de compartir o imprimir del dispositivo que elijas."]},{"type":"h2","text":"4. Procesamiento con IA"},{"type":"p","text":"Cuando inicias un análisis de CV, una coincidencia con una oferta, una carta de presentación, una preparación de entrevista o una sugerencia de IA en el creador de CV, CVPilot te pide permiso la primera vez y después envía el texto correspondiente a su servicio de IA. No se envía nada antes de que lo permitas y, si lo rechazas, puedes seguir usando las demás funciones de la app."},{"type":"ul","items":["Datos enviados: el texto del CV, de la oferta de empleo o del creador de CV que envías para esa función, las opciones que eliges (como tono, extensión o nivel de experiencia), tu tipo de plan (gratuito o premium) y un identificador de dispositivo aleatorio creado por la app. No incluyas en estos textos información que no quieras que se procese.","Proveedores de servicios: el servicio de IA de CVPilot funciona en Cloudflare Workers (Cloudflare, Inc.) y reenvía cada solicitud a Anthropic, PBC, cuyos modelos Claude generan el resultado. Cloudflare y Anthropic actúan como proveedores de servicios (encargados del tratamiento) para estas funciones.","Tu texto se usa únicamente para generar el resultado que solicitaste. Según los términos comerciales de Anthropic, el contenido enviado a través de su API no se usa para entrenar sus modelos de IA. Anthropic puede conservar las entradas y salidas durante un periodo limitado por motivos de seguridad y cumplimiento legal, como se describe en su propia política de privacidad.","CAREO LIMITED no almacena en sus servidores el contenido de tu CV, de la oferta de empleo ni del texto del creador. El servicio de IA solo registra información técnica, como la hora y el tipo de solicitud, códigos de error y recuentos de uso, y mantiene un contador diario de solicitudes por identificador de dispositivo para evitar abusos.","Cloudflare puede procesar información técnica de la solicitud, como la dirección IP y la hora, para operar su red, de acuerdo con su propia política de privacidad.","Las funciones de IA requieren conexión a internet y no están disponibles sin conexión."]},{"type":"h2","text":"5. Finalidades del procesamiento"},{"type":"ul","items":["Proporcionar análisis de CV, coincidencia con puestos, creador de CV, exportación, historial y ajustes","Generar con IA análisis de CV, resultados de coincidencia, cartas de presentación, preguntas de entrevista y sugerencias de redacción","Recordar preferencias y borradores guardados","Aplicar límites gratuitos y reglas de acceso Premium","Procesar compras o acceso Premium cuando corresponda","Mejorar estabilidad, prevenir abusos y mantener la app fiable"]},{"type":"h2","text":"6. Servicios de terceros y de plataforma"},{"type":"p","text":"La app puede usar servicios de plataforma o terceros, incluidos Apple App Store, Google Play, servicios de reseñas dentro de la app de Apple o Google, herramientas del dispositivo para archivos/fotos/cámara/compartir/imprimir y renderizado de fuentes usado para el estilo de exportaciones PDF. Estos servicios operan bajo sus propias políticas de privacidad. Las funciones de IA utilizan Cloudflare (alojamiento del servicio de IA de CVPilot) y Anthropic (modelos de IA Claude), como se describe en la Sección 4."},{"type":"h2","text":"7. Publicidad y seguimiento"},{"type":"p","text":"CVPilot no muestra anuncios de terceros ni utiliza SDK de seguimiento publicitario de terceros. El texto que envías para las funciones de IA se usa solo para ofrecer esas funciones y nunca con fines publicitarios."},{"type":"h2","text":"8. Resultados automatizados, precisión y responsabilidad del usuario"},{"type":"p","text":"CVPilot ofrece análisis de CV, coincidencias con ofertas, puntuaciones, sugerencias de palabras clave, cartas de presentación, preguntas de entrevista y sugerencias de redacción automatizados y generados por IA solo con fines informativos. El contenido generado por IA puede contener errores o afirmaciones que no son ciertas en tu caso, y los resultados pueden ser incompletos, inexactos, desactualizados o inadecuados para un empleador, sector, sistema de seguimiento de candidatos o proceso de selección concreto. Nunca añadas habilidades, experiencia o resultados que no tengas. CVPilot no garantiza entrevistas, ofertas de empleo, resultados de contratación, aceptación del CV, precisión de las puntuaciones ni compatibilidad con todos los sistemas de selección. Eres responsable de revisar todos los resultados antes de usarlos, verificar tu CV y tus materiales de candidatura y tomar tus propias decisiones profesionales, de candidatura, de contratación, legales o financieras."},{"type":"h2","text":"9. Mejor rendimiento y entrada admitida"},{"type":"p","text":"Para obtener mejores resultados, usa CVs y descripciones de puesto claros en inglés, con encabezados de sección estándar, historial laboral completo, habilidades, responsabilidades, requisitos y logros medibles. CVPilot puede ser menos preciso con contenido que no esté en inglés, ofertas incompletas, roles muy especializados o poco comunes, formatos de CV inusuales, archivos escaneados o borrosos, imágenes con baja calidad de texto o documentos de los que no se pueda extraer texto de forma fiable."},{"type":"h2","text":"10. Compras y funciones Premium"},{"type":"p","text":"Las compras, suscripciones o accesos Premium opcionales pueden ser procesados por Apple App Store o Google Play. No recibimos ni almacenamos los datos completos de tarjetas de pago. El estado de compra, derecho de suscripción, renovación, cancelación, gestión de reembolsos y datos de cuenta de la tienda pueden ser gestionados por la tienda correspondiente según sus propios términos y política de privacidad. El estado de compra puede guardarse localmente o verificarse mediante la tienda correspondiente."},{"type":"h2","text":"11. Compartición de datos"},{"type":"p","text":"No vendemos datos personales. El texto que envías para las funciones de IA se comparte con Cloudflare y Anthropic solo para generar el resultado solicitado, como se describe en la Sección 4. El resto del contenido almacenado localmente no se comparte con los servidores de CAREO LIMITED. Los proveedores de plataforma o terceros pueden procesar datos limitados solo como se describe en esta Política o cuando eliges usar las funciones de compartir, imprimir, tienda, reseñas o importación por URL."},{"type":"h2","text":"12. Conservación y eliminación de datos"},{"type":"p","text":"Los datos locales permanecen en tu dispositivo hasta que elimines entradas guardadas cuando esté disponible, restablezcas datos relevantes de la app cuando esté disponible o desinstales la app. Los archivos temporales de exportación pueden almacenarse en la caché del dispositivo. Los registros de pago y los registros de reseña o compra de plataforma son conservados por Apple o Google según sus propias políticas. El texto enviado para las funciones de IA no se conserva en los servidores de CAREO LIMITED una vez devuelto el resultado; Anthropic puede conservarlo durante un periodo limitado, como se describe en la Sección 4. El contador diario de solicitudes solo se usa para aplicar los límites de uso."},{"type":"h2","text":"13. Derechos del usuario"},{"type":"p","text":"Según tu región, puedes tener derechos de acceso, corrección, eliminación, limitación u oposición. Como la mayoría de los datos se almacenan localmente, normalmente puedes gestionarlos o eliminarlos desde la app o los ajustes del dispositivo. También puedes contactarnos por preguntas de privacidad. CAREO LIMITED no conserva una copia del texto enviado a las funciones de IA, por lo que normalmente no hay nada en nuestro lado que consultar o eliminar; contáctanos si tienes preguntas sobre este procesamiento."},{"type":"h2","text":"14. Seguridad de datos"},{"type":"p","text":"Usamos HTTPS para comunicaciones externas cuando corresponde y diseñamos nuestras apps para minimizar la recopilación de datos. Ningún software o dispositivo puede garantizar seguridad absoluta. El servicio de IA de CVPilot solo acepta solicitudes de la app a través de HTTPS y guarda la clave de acceso del proveedor de IA en el servidor, nunca en la app."},{"type":"h2","text":"15. Privacidad de menores"},{"type":"p","text":"La app no está dirigida a menores de 13 años. No recopilamos conscientemente datos personales de menores de 13 años. Si crees que un menor proporcionó datos personales, contáctanos y tomaremos medidas apropiadas."},{"type":"h2","text":"16. Transferencias internacionales"},{"type":"p","text":"Los proveedores de plataforma y terceros pueden procesar datos limitados en países distintos al tuyo. El texto que envías para las funciones de IA lo procesa Anthropic en Estados Unidos y pasa por la red global de Cloudflare. Se aplican las garantías adecuadas cuando la ley lo exige."},{"type":"h2","text":"17. Contacto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Actualizaciones de la Política"},{"type":"p","text":"Podemos actualizar esta Política si cambian las funciones de la app, servicios terceros o requisitos legales. Las actualizaciones se reflejarán con una nueva fecha. El uso continuado de la app después de una actualización significa que aceptas la Política actualizada."}],"tr":[{"type":"h1","text":"Gizlilik Politikası - CVPilot"},{"type":"meta","html":"<strong>Son güncelleme:</strong> Ekim 2026<br><strong>Uygulama:</strong> CVPilot<br><strong>Geliştirici / Yayıncı:</strong> CAREO LIMITED<br><strong>İletişim:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot gizliliğinize saygı duyar. Bu Politika, iOS ve Android mobil uygulamasını kullanırken hangi bilgilerin işlenebileceğini, nasıl kullanıldığını ve haklarınızı açıklar."},{"type":"h2","text":"1. Veri İşleme Özeti"},{"type":"p","text":"CVPilot verilerinin büyük bölümü cihazınızda kalır. CV analizi, iş eşleştirme, ön yazı, mülakat soruları ve yazım önerileri sunabilmek için bu özelliklerde gönderdiğiniz metin, 4. Bölümde açıklandığı şekilde CVPilot yapay zekâ hizmetine iletilir ve Anthropic’in Claude yapay zekâ modelleri tarafından işlenir. Kişisel verileri satmayız ve üçüncü taraf hizmetleri yalnızca aşağıda açıklanan özellikler için gerekli olduğunda kullanırız."},{"type":"h2","text":"2. Yerel Olarak Saklanan Veriler"},{"type":"p","text":"Uygulama, CV içeriği, iş ilanı metni, analiz ve eşleşme sonuçları, geçmiş, kullanım limitleri, uygulama tercihleri, profil bilgileri, CV builder taslakları, export sayaçları, değerlendirme isteği durumu ve Premium durumu ile ilgili verileri cihazınızda yerel olarak saklayabilir. Bu veriler uygulama özelliklerini sunmak, tercihleri hatırlamak, varsa çevrimdışı kullanımı desteklemek ve uygulama deneyimini tutarlı tutmak için kullanılır. Bazı yerel kayıtlar, girdiğiniz, içe aktardığınız veya taslak olarak kaydettiğiniz CV ya da iş ilanı metnini içerebilir. Uygulama ayrıca uygulamanın oluşturduğu rastgele bir cihaz kimliğini, yapay zekâ işlemeyle ilgili tercihinizi ve aynı metin yeniden gönderilmeden aynı sonucun gösterilebilmesi için son yapay zekâ sonuçlarını saklar."},{"type":"h2","text":"3. Dosyalar, Fotoğraflar, Kamera, Pano ve URL İçe Aktarma"},{"type":"ul","items":["Files, Photos veya Camera üzerinden CV içe aktarırsanız, seçilen dosya veya görsel CV metnini çıkarmak için işlenir.","Fotoğraf arşivi ve kamera erişimi yalnızca CV görseli içe aktarmayı veya çekmeyi seçtiğinizde istenir.","Pano erişimi yalnızca CV, iş ilanı veya destek iletişim metnini yapıştırmayı ya da kopyalamayı seçtiğinizde kullanılır.","Bir iş ilanını URL’den içe aktarırsanız, uygulama okunabilir metni almak için ilgili web sitesine bağlanır. İlgili web sitesi, kendi gizlilik politikasına göre IP adresi, kullanıcı aracısı, istek zamanı ve istenen URL gibi olağan teknik istek bilgilerini alabilir.","Dosya ayrıştırma, PDF metin çıkarma, DOCX dönüştürme ve görsel OCR işlemleri özellikle taranmış, bulanık, korumalı, alışılmadık veya kötü biçimlendirilmiş belgelerde eksik ya da hatalı olabilir.","CV’yi PDF olarak dışa aktardığınızda, uygulama geçici bir dosya oluşturabilir ve seçtiğiniz cihaz paylaşım veya yazdırma araçlarını kullanabilir."]},{"type":"h2","text":"4. Yapay Zekâ ile İşleme"},{"type":"p","text":"Bir CV analizi, iş eşleştirmesi, ön yazı, mülakat hazırlığı veya CV oluşturucuda bir yapay zekâ önerisi başlattığınızda CVPilot ilk seferde izninizi ister, ardından ilgili metni yapay zekâ hizmetine gönderir. İzin vermeden önce hiçbir şey gönderilmez; reddederseniz uygulamanın diğer özelliklerini kullanmaya devam edebilirsiniz."},{"type":"ul","items":["Gönderilen veriler: o özellik için gönderdiğiniz CV metni, iş ilanı metni veya CV oluşturucu içeriği, seçtiğiniz seçenekler (ton, uzunluk veya kıdem gibi), plan türünüz (ücretsiz veya premium) ve uygulamanın oluşturduğu rastgele bir cihaz kimliği. İşlenmesini istemediğiniz bilgileri bu metinlere eklemeyin.","Hizmet sağlayıcılar: CVPilot yapay zekâ hizmeti Cloudflare Workers (Cloudflare, Inc.) üzerinde çalışır ve her isteği, sonucu Claude modelleriyle üreten Anthropic, PBC’ye iletir. Cloudflare ve Anthropic bu özellikler için hizmet sağlayıcı (veri işleyen) olarak hareket eder.","Metniniz yalnızca istediğiniz sonucu üretmek için kullanılır. Anthropic’in ticari koşulları uyarınca API üzerinden gönderilen içerik, yapay zekâ modellerinin eğitiminde kullanılmaz. Anthropic, kendi gizlilik politikasında açıklandığı şekilde, güvenlik ve yasal uyum amacıyla girdi ve çıktıları sınırlı bir süre saklayabilir.","CAREO LIMITED; CV, iş ilanı veya CV oluşturucu metninizin içeriğini sunucularında saklamaz. Yapay zekâ hizmeti yalnızca istek zamanı, istek türü, hata kodları ve kullanım sayıları gibi teknik bilgileri kaydeder ve kötüye kullanımı önlemek için cihaz kimliği başına günlük bir istek sayacı tutar.","Cloudflare, ağını işletmek için IP adresi ve istek zamanı gibi teknik istek bilgilerini kendi gizlilik politikası kapsamında işleyebilir.","Yapay zekâ özellikleri internet bağlantısı gerektirir ve çevrimdışıyken kullanılamaz."]},{"type":"h2","text":"5. İşleme Amaçları"},{"type":"ul","items":["CV analizi, iş eşleştirme, CV builder, export, geçmiş ve ayarlar özelliklerini sunmak","Yapay zekâ ile CV analizi, eşleştirme sonuçları, ön yazılar, mülakat soruları ve yazım önerileri oluşturmak","Kullanıcı tercihlerini ve kayıtlı taslakları hatırlamak","Ücretsiz kullanım limitlerini ve Premium erişim kurallarını uygulamak","Uygunsa satın alma veya Premium erişimi işlemek","Kararlılığı artırmak, kötüye kullanımı önlemek ve uygulamanın güvenilir çalışmasını sağlamak"]},{"type":"h2","text":"6. Üçüncü Taraf ve Platform Hizmetleri"},{"type":"p","text":"Uygulama Apple App Store, Google Play, Apple veya Google uygulama içi değerlendirme hizmetleri, cihazın dosya/fotoğraf/kamera/paylaşım/yazdırma araçları ve PDF export biçimlendirmesinde kullanılan font render işlemleri dahil olmak üzere platform veya üçüncü taraf hizmetleri kullanabilir. Bu hizmetler kendi gizlilik politikalarına göre çalışır. Yapay zekâ özellikleri, 4. Bölümde açıklandığı şekilde Cloudflare’i (CVPilot yapay zekâ hizmetinin barındırılması) ve Anthropic’i (Claude yapay zekâ modelleri) kullanır."},{"type":"h2","text":"7. Reklam ve Takip"},{"type":"p","text":"CVPilot üçüncü taraf reklam göstermez ve üçüncü taraf reklam takip SDK’ları kullanmaz. Yapay zekâ özellikleri için gönderdiğiniz metin yalnızca bu özellikleri sunmak için kullanılır, hiçbir zaman reklam amacıyla kullanılmaz."},{"type":"h2","text":"8. Otomatik Sonuçlar, Doğruluk ve Kullanıcı Sorumluluğu"},{"type":"p","text":"CVPilot; otomatik ve yapay zekâ tarafından üretilen CV analizi, iş eşleştirme, puanlama, anahtar kelime önerileri, ön yazılar, mülakat soruları ve yazım önerilerini yalnızca bilgilendirme amacıyla sunar. Yapay zekâ tarafından üretilen içerik hatalar veya sizin için doğru olmayan ifadeler içerebilir; sonuçlar eksik, hatalı, güncelliğini yitirmiş ya da belirli bir işveren, sektör, aday takip sistemi veya işe alım süreci için uygun olmayabilir. Sahip olmadığınız beceri, deneyim veya sonuçları asla eklemeyin. CVPilot mülakat, iş teklifi, işe alım sonucu, CV kabulü, puan doğruluğu veya her işe alım sistemiyle uyumluluk garanti etmez. Tüm çıktıları kullanmadan önce gözden geçirmek, CV’nizi ve başvuru belgelerinizi doğrulamak ve kariyer, iş başvurusu, işe alım, hukuki, finansal veya mesleki kararlarınızı kendiniz vermek sizin sorumluluğunuzdadır."},{"type":"h2","text":"9. En İyi Performans ve Desteklenen Girdi"},{"type":"p","text":"En iyi sonuçlar için standart bölüm başlıkları, eksiksiz iş geçmişi, beceriler, sorumluluklar, gereksinimler ve ölçülebilir başarılar içeren net İngilizce CV’ler ve İngilizce iş ilanları kullanın. CVPilot; İngilizce olmayan içeriklerde, eksik iş ilanlarında, çok özel veya yaygın olmayan rollerde, alışılmadık CV formatlarında, taranmış ya da bulanık dosyalarda, metin kalitesi düşük görsellerde veya metnin güvenilir şekilde çıkarılamadığı belgelerde daha düşük doğrulukla çalışabilir."},{"type":"h2","text":"10. Satın Almalar ve Premium Özellikler"},{"type":"p","text":"İsteğe bağlı satın almalar, abonelikler veya Premium erişim Apple App Store ya da Google Play tarafından işlenebilir. Tam ödeme kartı bilgilerini almayız veya saklamayız. Satın alma durumu, abonelik hakkı, yenileme, iptal, iade işlemleri ve mağaza hesap verileri ilgili uygulama mağazası tarafından kendi şartları ve gizlilik politikasına göre yönetilebilir. Satın alma durumu yerel olarak saklanabilir veya ilgili mağaza üzerinden doğrulanabilir."},{"type":"h2","text":"11. Veri Paylaşımı"},{"type":"p","text":"Kişisel verileri satmayız. Yapay zekâ özellikleri için gönderdiğiniz metin, 4. Bölümde açıklandığı şekilde yalnızca istenen sonucu üretmek amacıyla Cloudflare ve Anthropic ile paylaşılır. Cihazda saklanan diğer uygulama içerikleri CAREO LIMITED sunucularıyla paylaşılmaz. Sınırlı veriler yalnızca bu Politikada açıklandığı şekilde veya cihaz paylaşımı, yazdırma, mağaza, değerlendirme ya da URL’den içe aktarma özelliklerini kullanmayı seçtiğinizde platform veya üçüncü taraf sağlayıcılar tarafından işlenebilir."},{"type":"h2","text":"12. Veri Saklama ve Silme"},{"type":"p","text":"Yerel veriler, mümkün olduğunda kayıtlı girişleri silene, ilgili uygulama verilerini sıfırlayana veya uygulamayı kaldırana kadar cihazınızda kalır. Geçici export dosyaları cihaz önbelleğinde saklanabilir. Mağaza ödeme kayıtları ve platform değerlendirme veya satın alma kayıtları Apple ya da Google tarafından kendi politikalarına göre saklanır. Yapay zekâ özellikleri için gönderilen metin, sonuç döndükten sonra CAREO LIMITED sunucularında tutulmaz; Anthropic bu metni 4. Bölümde açıklandığı şekilde sınırlı bir süre saklayabilir. Günlük istek sayacı yalnızca kullanım sınırlarını uygulamak için kullanılır."},{"type":"h2","text":"13. Kullanıcı Hakları"},{"type":"p","text":"Bölgenize bağlı olarak erişim, düzeltme, silme, sınırlandırma veya itiraz haklarınız olabilir. Verilerin çoğu yerel saklandığı için bunları genellikle uygulama veya cihaz ayarları üzerinden yönetebilir ya da silebilirsiniz. Gizlilik soruları için bizimle de iletişime geçebilirsiniz. CAREO LIMITED, yapay zekâ özelliklerine gönderilen metnin bir kopyasını tutmaz; bu nedenle genellikle bizim tarafımızda erişilecek veya silinecek bir veri bulunmaz. Bu işlemeyle ilgili sorularınız için bizimle iletişime geçebilirsiniz."},{"type":"h2","text":"14. Veri Güvenliği"},{"type":"p","text":"Uygun durumlarda harici iletişim için HTTPS kullanırız ve uygulamalarımızı veri toplamayı azaltacak şekilde tasarlarız. Hiçbir yazılım veya cihaz ortamı mutlak güvenlik garanti edemez. CVPilot yapay zekâ hizmeti yalnızca uygulamadan HTTPS üzerinden gelen istekleri kabul eder ve yapay zekâ sağlayıcısının erişim anahtarını uygulamada değil, yalnızca sunucuda saklar."},{"type":"h2","text":"15. Çocukların Gizliliği"},{"type":"p","text":"Uygulama 13 yaş altındaki çocuklara yönelik değildir. 13 yaş altındaki çocuklardan bilerek kişisel veri toplamayız. Bir çocuğun kişisel veri sağladığını düşünüyorsanız bizimle iletişime geçin; uygun adımları atarız."},{"type":"h2","text":"16. Uluslararası Veri Aktarımları"},{"type":"p","text":"Platform ve üçüncü taraf sağlayıcılar sınırlı verileri kendi ülkeniz dışındaki ülkelerde işleyebilir. Yapay zekâ özellikleri için gönderdiğiniz metin Amerika Birleşik Devletleri’nde Anthropic tarafından işlenir ve Cloudflare’in küresel ağı üzerinden iletilir. Yasaların gerektirdiği durumlarda uygun güvenceler uygulanır."},{"type":"h2","text":"17. İletişim"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Politika Güncellemeleri"},{"type":"p","text":"Uygulama özellikleri, üçüncü taraf hizmetler veya yasal gereklilikler değişirse bu Politikayı güncelleyebiliriz. Güncellemeler yeni Son güncelleme tarihiyle gösterilir. Güncellemeden sonra uygulamayı kullanmaya devam etmeniz güncel Politikayı kabul ettiğiniz anlamına gelir."}]};
  const uiText = {"en": {"back": "← Back to CAREO LIMITED", "privacy": "Privacy Policy", "last": "Last updated", "app": "App", "dev": "Developer / Publisher", "contact": "Contact", "lang": "Language"}, "fr": {"back": "← Retour à CAREO LIMITED", "privacy": "Politique de confidentialité", "last": "Dernière mise à jour", "app": "App", "dev": "Développeur / Éditeur", "contact": "Contact", "lang": "Langue"}, "de": {"back": "← Zurück zu CAREO LIMITED", "privacy": "Datenschutzerklärung", "last": "Letzte Aktualisierung", "app": "App", "dev": "Entwickler / Herausgeber", "contact": "Kontakt", "lang": "Sprache"}, "it": {"back": "← Torna a CAREO LIMITED", "privacy": "Informativa sulla privacy", "last": "Ultimo aggiornamento", "app": "App", "dev": "Sviluppatore / Editore", "contact": "Contatto", "lang": "Lingua"}, "ja": {"back": "← CAREO LIMITEDに戻る", "privacy": "プライバシーポリシー", "last": "最終更新", "app": "アプリ", "dev": "開発者 / 発行者", "contact": "連絡先", "lang": "言語"}, "ko": {"back": "← CAREO LIMITED로 돌아가기", "privacy": "개인정보 처리방침", "last": "마지막 업데이트", "app": "앱", "dev": "개발자 / 게시자", "contact": "문의", "lang": "언어"}, "pt": {"back": "← Voltar para CAREO LIMITED", "privacy": "Política de Privacidade", "last": "Última atualização", "app": "App", "dev": "Programador / Editor", "contact": "Contacto", "lang": "Idioma"}, "ru": {"back": "← Назад к CAREO LIMITED", "privacy": "Политика конфиденциальности", "last": "Последнее обновление", "app": "Приложение", "dev": "Разработчик / Издатель", "contact": "Контакт", "lang": "Язык"}, "es": {"back": "← Volver a CAREO LIMITED", "privacy": "Política de privacidad", "last": "Última actualización", "app": "App", "dev": "Desarrollador / Editor", "contact": "Contacto", "lang": "Idioma"}, "tr": {"back": "← CAREO LIMITED’a dön", "privacy": "Gizlilik Politikası", "last": "Son güncelleme", "app": "Uygulama", "dev": "Geliştirici / Yayıncı", "contact": "İletişim", "lang": "Dil"}};
  const homeLabels = { en:"← Home", fr:"← Accueil", de:"← Startseite", it:"← Home", ja:"← ホーム", ko:"← 홈", pt:"← Início", ru:"← Главная", es:"← Inicio", tr:"← Ana Sayfa" };
  const languageSelect = document.getElementById("languageSelect");
  const policyContent = document.getElementById("policyContent");
  const backLink = document.getElementById("backLink");
  const params = new URLSearchParams(window.location.search);
  const initialLanguage = params.get("lang") || localStorage.getItem("careo-language") || "en";
  function renderPolicy(language) {
    const selected = policyData[language] || policyData.en;
    const ui = uiText[language] || uiText.en;
    document.documentElement.lang = language;
    languageSelect.value = language;
    backLink.textContent = homeLabels[language] || homeLabels.en;
    backLink.href = `../index.html?lang=${encodeURIComponent(language)}`;
    policyContent.innerHTML = "";
    selected.forEach((block) => {
      if (block.type === "h1" || block.type === "h2") {
        const el = document.createElement(block.type); el.textContent = block.text; policyContent.appendChild(el);
      } else if (block.type === "p" || block.type === "meta") {
        const el = document.createElement("p"); if (block.type === "meta") el.className = "meta"; if (block.html) el.innerHTML = block.html; else el.textContent = block.text; policyContent.appendChild(el);
      } else if (block.type === "ul") {
        const ul = document.createElement("ul"); block.items.forEach((item) => { const li = document.createElement("li"); li.textContent = item; ul.appendChild(li); }); policyContent.appendChild(ul);
      }
    });
    document.title = `${selected[0].text} | CAREO LIMITED`;
    localStorage.setItem("careo-language", language);
    const url = new URL(window.location.href); url.searchParams.set("lang", language); window.history.replaceState(null, "", url.toString());
  }
  languageSelect.addEventListener("change", (event) => renderPolicy(event.target.value));
  renderPolicy(policyData[initialLanguage] ? initialLanguage : "en");
</script>
