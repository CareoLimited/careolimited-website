  <style>
    :root { --bg:#061b36; --card:rgba(255,255,255,0.08); --card-border:rgba(255,255,255,0.14); --text:#f5f7fb; --muted:#c8d2e3; --accent:#d7bc79; --shadow:0 20px 50px rgba(0,0,0,0.28); --radius:22px; --max:980px; }

    p,li { color:var(--muted); font-size:1rem; }

    @media (max-width:720px) { .card { padding:22px; } }

<script>
  const policyData = {"en":[{"type":"h1","text":"Privacy Policy - CVPilot"},{"type":"meta","html":"<strong>Last updated:</strong> October 2026<br><strong>App:</strong> CVPilot<br><strong>Developer / Publisher:</strong> CAREO LIMITED<br><strong>Contact:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot respects your privacy. This Policy explains what information may be processed, how it is used, and your rights when you use the mobile application on iOS and Android."},{"type":"h2","text":"1. Data Processing Overview"},{"type":"p","text":"Most CVPilot data stays on your device. To provide CV analysis, job matching, cover letters, interview questions, and writing suggestions, the text you submit for these features is sent to the CVPilot AI service and processed by Anthropic’s Claude AI models, as described in Section 4. We do not sell personal data and we only use third-party services where they are needed for the features described below."},{"type":"h2","text":"2. Locally Stored Data"},{"type":"p","text":"The app may store resume content, job description text, analysis and match results, history, usage limits, app preferences, profile details, CV builder drafts, export counters, review prompt state, and premium status locally on your device. This data is used to provide app features, remember preferences, support offline use where available, and keep the app experience consistent. Some local records may include the CV or job description text you entered, imported, or saved as a draft. The app also stores a random app-generated device identifier, your choice about AI processing, and recent AI results so that re-running the same text returns the same result without sending it again."},{"type":"h2","text":"3. Files, Photos, Camera, Clipboard, and URL Imports"},{"type":"ul","items":["If you import a resume from Files, Photos, or Camera, the selected file or image is processed to extract resume text for app features.","Photo library and camera access are requested only when you choose to import or capture a resume image.","Clipboard access is used only when you choose to paste or copy CV, job description, or support contact text.","If you import a job description from a URL, the app connects to that website to retrieve readable text. The website may receive ordinary technical request information such as IP address, user agent, request time, and the URL requested under its own privacy policy.","File parsing, PDF text extraction, DOCX conversion, and image OCR may be incomplete or inaccurate, especially for scanned, blurred, protected, unusual, or poorly formatted documents.","When you export a CV as a PDF, the app may create a temporary file and use the device sharing or printing tools you select."]},{"type":"h2","text":"4. AI Processing"},{"type":"p","text":"When you start a CV analysis, job match, cover letter, interview preparation, or an AI suggestion in the CV builder, CVPilot asks for your permission the first time and then sends the relevant text to its AI service. Nothing is sent before you allow it, and you can keep using the app’s other features if you decline."},{"type":"ul","items":["Data sent: the CV text, job description text, or CV builder content you submit for that feature, the options you choose (such as tone, length, or seniority), your plan type (free or premium), and a random device identifier created by the app. Do not include information in these texts that you do not want processed.","Service providers: the CVPilot AI service runs on Cloudflare Workers (Cloudflare, Inc.) and forwards each request to Anthropic, PBC, whose Claude models generate the result. Cloudflare and Anthropic act as service providers (processors) for these features.","Your text is used only to produce the result you requested. Under Anthropic’s commercial terms, content sent through its API is not used to train its AI models. Anthropic may keep inputs and outputs for a limited period for safety and legal compliance, as described in its own privacy policy.","CAREO LIMITED does not store the content of your CV, job description, or builder text on its servers. The AI service records technical information only, such as request time, request type, error codes, and usage counts, and keeps a daily request counter per device identifier to prevent abuse.","Cloudflare may process technical request information, such as IP address and request time, to operate its network, under its own privacy policy.","AI features require an internet connection and are unavailable while you are offline."]},{"type":"h2","text":"5. Processing Purposes"},{"type":"ul","items":["Provide resume analysis, job matching, CV builder, export, history, and settings features","Generate AI-based CV analysis, job match results, cover letters, interview questions, and writing suggestions","Remember user preferences and saved drafts","Apply free usage limits and premium access rules","Process purchases or premium access where applicable","Improve stability, prevent abuse, and keep the app functioning reliably"]},{"type":"h2","text":"6. Third-Party and Platform Services"},{"type":"p","text":"The app may use platform or third-party services including Apple App Store, Google Play, Apple or Google in-app review services, device file/photo/camera/sharing/printing tools, and font rendering used for PDF export styling. These services operate under their own privacy policies. AI features use Cloudflare (hosting of the CVPilot AI service) and Anthropic (Claude AI models), as described in Section 4."},{"type":"h2","text":"7. Advertising and Tracking"},{"type":"p","text":"CVPilot does not display third-party ads and does not use third-party advertising tracking SDKs. Text you submit for AI features is used only to provide those features and is never used for advertising."},{"type":"h2","text":"8. Automated Results, Accuracy, and User Responsibility"},{"type":"p","text":"CVPilot provides automated, AI-generated CV analysis, job matching, scoring, keyword suggestions, cover letters, interview questions, and writing suggestions for informational purposes only. AI-generated content can contain mistakes or statements that are not true for you, and results may be incomplete, inaccurate, outdated, or unsuitable for a specific employer, industry, applicant tracking system, or hiring process. Never add skills, experience, or results that you do not have. CVPilot does not guarantee interviews, job offers, hiring outcomes, CV acceptance, score accuracy, or compatibility with every recruitment system. You are responsible for reviewing all outputs before using them, verifying your CV and application materials, and making your own career, job application, hiring, legal, financial, or professional decisions."},{"type":"h2","text":"9. Best Performance and Supported Input"},{"type":"p","text":"For best results, use clear English CVs and English job descriptions with standard section headings, complete work history, skills, responsibilities, requirements, and measurable achievements. CVPilot may perform less accurately with non-English content, incomplete job posts, highly specialized or uncommon roles, unusual CV formatting, scanned or blurry files, images with poor text quality, or documents where text cannot be extracted reliably."},{"type":"h2","text":"10. Purchases and Premium Features"},{"type":"p","text":"Optional purchases, subscriptions, or premium access may be processed by Apple App Store or Google Play. We do not receive or store full payment card details. Purchase status, subscription entitlement, renewal, cancellation, refund handling, and store account data may be managed by the relevant app store under its own terms and privacy policy. Purchase status may be stored locally or verified through the relevant store."},{"type":"h2","text":"11. Data Sharing"},{"type":"p","text":"We do not sell personal data. Text you submit for AI features is shared with Cloudflare and Anthropic only to produce the requested result, as described in Section 4. Other locally stored app content is not shared with CAREO LIMITED servers. Limited data may be processed by platform or third-party providers only as described in this Policy or when you choose to use device sharing, printing, store, review, or URL import features."},{"type":"h2","text":"12. Data Retention and Deletion"},{"type":"p","text":"Local data remains on your device until you delete saved entries where available, reset relevant app data where available, or uninstall the app. Temporary export files may be stored in the device cache. Store payment records and platform review or purchase records are retained by Apple or Google according to their own policies. Text sent for AI features is not kept on CAREO LIMITED servers after the result is returned; Anthropic may keep it for a limited period as described in Section 4. The daily request counter is used only to apply usage limits."},{"type":"h2","text":"13. User Rights"},{"type":"p","text":"Depending on your region, you may have rights to access, correct, delete, restrict, or object to processing. Because most app data is stored locally, you can usually manage or remove it directly through the app or your device settings. You may also contact us for privacy questions. CAREO LIMITED does not keep a copy of the text you send to AI features, so there is usually nothing on our side to access or delete; contact us if you have questions about this processing."},{"type":"h2","text":"14. Data Security"},{"type":"p","text":"We use HTTPS for external communications where applicable and design our apps to minimize data collection. No software or device environment can guarantee absolute security. The CVPilot AI service accepts requests only from the app over HTTPS and keeps the AI provider’s access key on the server, never in the app."},{"type":"h2","text":"15. Children’s Privacy"},{"type":"p","text":"The app is not directed to children under 13. We do not knowingly collect personal data from children under 13. If you believe a child has provided personal data, contact us and we will take appropriate action."},{"type":"h2","text":"16. International Data Transfers"},{"type":"p","text":"Platform and third-party providers may process limited data in countries outside your own. Text you submit for AI features is processed by Anthropic in the United States and passes through Cloudflare’s global network. Appropriate safeguards apply where required by law."},{"type":"h2","text":"17. Contact"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Policy Updates"},{"type":"p","text":"We may update this Policy if app features, third-party services, or legal requirements change. Updates will be reflected with a new Last updated date. Continued use of the app after an update means you accept the updated Policy."}],"fr":[{"type":"h1","text":"Politique de confidentialité - CVPilot"},{"type":"meta","html":"<strong>Dernière mise à jour :</strong> octobre 2026<br><strong>App :</strong> CVPilot<br><strong>Développeur / Éditeur :</strong> CAREO LIMITED<br><strong>Contact :</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot respecte votre vie privée. Cette Politique explique quelles informations peuvent être traitées, comment elles sont utilisées et quels sont vos droits lorsque vous utilisez l’application mobile sur iOS et Android."},{"type":"h2","text":"1. Aperçu du traitement des données"},{"type":"p","text":"La plupart des données de CVPilot restent sur votre appareil. Pour fournir l’analyse de CV, la correspondance avec les offres, les lettres de motivation, les questions d’entretien et les suggestions de rédaction, le texte que vous soumettez pour ces fonctionnalités est envoyé au service d’IA de CVPilot et traité par les modèles d’IA Claude d’Anthropic, comme décrit à la section 4. Nous ne vendons pas de données personnelles et n’utilisons des services tiers que lorsqu’ils sont nécessaires aux fonctionnalités décrites ci-dessous."},{"type":"h2","text":"2. Données stockées localement"},{"type":"p","text":"L’application peut stocker localement sur votre appareil le contenu de CV, le texte d’offres d’emploi, les résultats d’analyse et de correspondance, l’historique, les limites d’utilisation, les préférences, les informations de profil, les brouillons du créateur de CV, les compteurs d’export, l’état des demandes d’avis et le statut Premium. Ces données servent à fournir les fonctions de l’app, mémoriser les préférences, prendre en charge l’utilisation hors ligne lorsque disponible et garder une expérience cohérente. Certains enregistrements locaux peuvent inclure le texte du CV ou de l’offre d’emploi que vous avez saisi, importé ou enregistré comme brouillon. L’application stocke également un identifiant d’appareil aléatoire généré par l’application, votre choix concernant le traitement par IA et les résultats d’IA récents, afin que la même saisie renvoie le même résultat sans être renvoyée."},{"type":"h2","text":"3. Fichiers, photos, caméra, presse-papiers et imports par URL"},{"type":"ul","items":["Si vous importez un CV depuis Fichiers, Photos ou Caméra, le fichier ou l’image choisi est traité pour extraire le texte du CV.","L’accès à la photothèque et à la caméra est demandé uniquement lorsque vous choisissez d’importer ou de capturer une image de CV.","L’accès au presse-papiers est utilisé uniquement lorsque vous choisissez de coller ou copier du texte de CV, d’offre d’emploi ou de contact support.","Si vous importez une offre d’emploi depuis une URL, l’app se connecte à ce site pour récupérer le texte lisible. Le site peut recevoir des informations techniques ordinaires telles que l’adresse IP, l’agent utilisateur, l’heure de la requête et l’URL demandée, selon sa propre politique de confidentialité.","L’analyse de fichiers, l’extraction de texte PDF, la conversion DOCX et l’OCR d’images peuvent être incomplètes ou inexactes, notamment pour les documents scannés, flous, protégés, inhabituels ou mal formatés.","Lorsque vous exportez un CV en PDF, l’app peut créer un fichier temporaire et utiliser les outils de partage ou d’impression de l’appareil que vous choisissez."]},{"type":"h2","text":"4. Traitement par IA"},{"type":"p","text":"Lorsque vous lancez une analyse de CV, une correspondance avec une offre, une lettre de motivation, une préparation d’entretien ou une suggestion d’IA dans le créateur de CV, CVPilot vous demande votre autorisation la première fois, puis envoie le texte concerné à son service d’IA. Rien n’est envoyé avant votre accord, et vous pouvez continuer à utiliser les autres fonctionnalités si vous refusez."},{"type":"ul","items":["Données envoyées : le texte du CV, de l’offre d’emploi ou du créateur de CV que vous soumettez pour cette fonctionnalité, les options choisies (ton, longueur ou niveau, par exemple), votre type d’offre (gratuite ou premium) et un identifiant d’appareil aléatoire créé par l’application. N’incluez pas dans ces textes d’informations que vous ne souhaitez pas faire traiter.","Prestataires : le service d’IA de CVPilot fonctionne sur Cloudflare Workers (Cloudflare, Inc.) et transmet chaque requête à Anthropic, PBC, dont les modèles Claude génèrent le résultat. Cloudflare et Anthropic agissent en tant que prestataires (sous-traitants) pour ces fonctionnalités.","Votre texte est utilisé uniquement pour produire le résultat demandé. Selon les conditions commerciales d’Anthropic, le contenu envoyé via son API n’est pas utilisé pour entraîner ses modèles d’IA. Anthropic peut conserver les entrées et sorties pendant une durée limitée pour des raisons de sécurité et de conformité légale, comme décrit dans sa propre politique de confidentialité.","CAREO LIMITED ne stocke pas le contenu de votre CV, de l’offre d’emploi ou du texte du créateur sur ses serveurs. Le service d’IA n’enregistre que des informations techniques, comme l’heure et le type de requête, les codes d’erreur et les compteurs d’utilisation, et conserve un compteur quotidien de requêtes par identifiant d’appareil pour prévenir les abus.","Cloudflare peut traiter des informations techniques de requête, comme l’adresse IP et l’heure de la requête, pour exploiter son réseau, conformément à sa propre politique de confidentialité.","Les fonctionnalités d’IA nécessitent une connexion Internet et ne sont pas disponibles hors ligne."]},{"type":"h2","text":"5. Finalités du traitement"},{"type":"ul","items":["Fournir l’analyse de CV, la correspondance avec une offre, le créateur de CV, l’export, l’historique et les réglages","Générer, à l’aide de l’IA, l’analyse de CV, les résultats de correspondance, les lettres de motivation, les questions d’entretien et les suggestions de rédaction","Mémoriser les préférences et brouillons enregistrés","Appliquer les limites gratuites et les règles d’accès Premium","Traiter les achats ou l’accès Premium si applicable","Améliorer la stabilité, prévenir les abus et assurer le bon fonctionnement de l’app"]},{"type":"h2","text":"6. Services tiers et de plateforme"},{"type":"p","text":"L’app peut utiliser des services de plateforme ou tiers, notamment Apple App Store, Google Play, les services d’avis intégrés d’Apple ou Google, les outils de fichiers/photos/caméra/partage/impression de l’appareil et le rendu des polices utilisé pour la mise en forme des exports PDF. Ces services fonctionnent selon leurs propres politiques de confidentialité. Les fonctionnalités d’IA utilisent Cloudflare (hébergement du service d’IA de CVPilot) et Anthropic (modèles d’IA Claude), comme décrit à la section 4."},{"type":"h2","text":"7. Publicité et suivi"},{"type":"p","text":"CVPilot n’affiche pas de publicités tierces et n’utilise pas de SDK tiers de suivi publicitaire. Le texte que vous soumettez pour les fonctionnalités d’IA sert uniquement à fournir ces fonctionnalités et n’est jamais utilisé à des fins publicitaires."},{"type":"h2","text":"8. Résultats automatisés, exactitude et responsabilité de l’utilisateur"},{"type":"p","text":"CVPilot fournit des analyses de CV, des correspondances avec des offres, des scores, des suggestions de mots-clés, des lettres de motivation, des questions d’entretien et des suggestions de rédaction automatisés et générés par IA, à titre informatif uniquement. Le contenu généré par IA peut contenir des erreurs ou des affirmations qui ne sont pas vraies pour vous, et les résultats peuvent être incomplets, inexacts, obsolètes ou inadaptés à un employeur, un secteur, un système de suivi des candidatures ou un processus de recrutement donné. N’ajoutez jamais de compétences, d’expériences ou de résultats que vous n’avez pas. CVPilot ne garantit ni entretiens, ni offres d’emploi, ni résultats de recrutement, ni acceptation du CV, ni exactitude des scores, ni compatibilité avec tous les systèmes de recrutement. Il vous appartient de vérifier tous les résultats avant de les utiliser, de contrôler votre CV et vos documents de candidature et de prendre vos propres décisions de carrière, de candidature, de recrutement, juridiques, financières ou professionnelles."},{"type":"h2","text":"9. Meilleures performances et saisie prise en charge"},{"type":"p","text":"Pour de meilleurs résultats, utilisez des CV et offres d’emploi clairs en anglais, avec des titres de section standards, un historique professionnel complet, des compétences, responsabilités, exigences et réalisations mesurables. CVPilot peut être moins précis avec du contenu non anglais, des offres incomplètes, des rôles très spécialisés ou rares, une mise en forme inhabituelle, des fichiers scannés ou flous, des images de mauvaise qualité textuelle ou des documents dont le texte ne peut pas être extrait de manière fiable."},{"type":"h2","text":"10. Achats et fonctions Premium"},{"type":"p","text":"Les achats, abonnements ou accès Premium optionnels peuvent être traités par Apple App Store ou Google Play. Nous ne recevons ni ne stockons les données complètes de carte de paiement. L’état d’achat, les droits d’abonnement, le renouvellement, l’annulation, les remboursements et les données de compte de boutique peuvent être gérés par la boutique concernée selon ses propres conditions et sa politique de confidentialité. L’état d’achat peut être stocké localement ou vérifié via la boutique concernée."},{"type":"h2","text":"11. Partage des données"},{"type":"p","text":"Nous ne vendons pas de données personnelles. Le texte que vous soumettez pour les fonctionnalités d’IA est partagé avec Cloudflare et Anthropic uniquement pour produire le résultat demandé, comme décrit à la section 4. Les autres contenus stockés localement ne sont pas partagés avec les serveurs de CAREO LIMITED. Des données limitées peuvent être traitées par des plateformes ou des fournisseurs tiers uniquement comme décrit dans la présente Politique ou lorsque vous choisissez d’utiliser les fonctions de partage, d’impression, de boutique, d’avis ou d’import par URL."},{"type":"h2","text":"12. Conservation et suppression"},{"type":"p","text":"Les données locales restent sur votre appareil jusqu’à ce que vous supprimiez les entrées enregistrées lorsque disponible, réinitialisiez les données pertinentes lorsque disponible ou désinstalliez l’app. Les fichiers d’export temporaires peuvent être stockés dans le cache. Les enregistrements de paiement et d’avis ou d’achat de plateforme sont conservés par Apple ou Google selon leurs propres politiques. Le texte envoyé pour les fonctionnalités d’IA n’est pas conservé sur les serveurs de CAREO LIMITED après le renvoi du résultat ; Anthropic peut le conserver pendant une durée limitée comme décrit à la section 4. Le compteur quotidien de requêtes sert uniquement à appliquer les limites d’utilisation."},{"type":"h2","text":"13. Droits des utilisateurs"},{"type":"p","text":"Selon votre région, vous pouvez disposer de droits d’accès, de rectification, de suppression, de limitation ou d’opposition. Comme la plupart des données sont stockées localement, vous pouvez généralement les gérer ou les supprimer via l’app ou les réglages de votre appareil. Vous pouvez aussi nous contacter pour toute question de confidentialité. CAREO LIMITED ne conserve pas de copie du texte envoyé aux fonctionnalités d’IA ; il n’y a donc généralement rien à consulter ou à supprimer de notre côté. Contactez-nous pour toute question sur ce traitement."},{"type":"h2","text":"14. Sécurité des données"},{"type":"p","text":"Nous utilisons HTTPS pour les communications externes lorsque cela s’applique et concevons nos apps pour réduire la collecte de données. Aucun logiciel ni appareil ne peut garantir une sécurité absolue. Le service d’IA de CVPilot n’accepte que les requêtes de l’application via HTTPS et conserve la clé d’accès du fournisseur d’IA sur le serveur, jamais dans l’application."},{"type":"h2","text":"15. Confidentialité des enfants"},{"type":"p","text":"L’application ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment de données personnelles d’enfants de moins de 13 ans. Si vous pensez qu’un enfant a fourni des données personnelles, contactez-nous et nous prendrons les mesures appropriées."},{"type":"h2","text":"16. Transferts internationaux"},{"type":"p","text":"Les plateformes et fournisseurs tiers peuvent traiter des données limitées dans des pays autres que le vôtre. Le texte que vous soumettez pour les fonctionnalités d’IA est traité par Anthropic aux États-Unis et transite par le réseau mondial de Cloudflare. Des garanties appropriées s’appliquent lorsque la loi l’exige."},{"type":"h2","text":"17. Contact"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Mises à jour de la Politique"},{"type":"p","text":"Nous pouvons mettre à jour cette Politique si les fonctions de l’app, les services tiers ou les exigences légales changent. Les mises à jour seront indiquées par une nouvelle date. L’utilisation continue de l’app après une mise à jour signifie que vous acceptez la Politique mise à jour."}],"de":[{"type":"h1","text":"Datenschutzerklärung - CVPilot"},{"type":"meta","html":"<strong>Letzte Aktualisierung:</strong> Oktober 2026<br><strong>App:</strong> CVPilot<br><strong>Entwickler / Herausgeber:</strong> CAREO LIMITED<br><strong>Kontakt:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot respektiert Ihre Privatsphäre. Diese Richtlinie erklärt, welche Informationen verarbeitet werden können, wie sie verwendet werden und welche Rechte Sie bei der Nutzung der mobilen App auf iOS und Android haben."},{"type":"h2","text":"1. Überblick zur Datenverarbeitung"},{"type":"p","text":"Die meisten CVPilot-Daten bleiben auf Ihrem Gerät. Für Lebenslaufanalyse, Job-Matching, Anschreiben, Interviewfragen und Formulierungsvorschläge wird der Text, den Sie für diese Funktionen einreichen, an den KI-Dienst von CVPilot gesendet und von den Claude-KI-Modellen von Anthropic verarbeitet, wie in Abschnitt 4 beschrieben. Wir verkaufen keine personenbezogenen Daten und nutzen Drittanbieterdienste nur, wenn sie für die unten beschriebenen Funktionen erforderlich sind."},{"type":"h2","text":"2. Lokal gespeicherte Daten"},{"type":"p","text":"Die App kann Lebenslaufdaten, Stellenbeschreibungstexte, Analyse- und Matching-Ergebnisse, Verlauf, Nutzungslimits, App-Einstellungen, Profildaten, CV-Builder-Entwürfe, Exportzähler, Status von Bewertungsaufforderungen und Premium-Status lokal auf Ihrem Gerät speichern. Diese Daten werden genutzt, um App-Funktionen bereitzustellen, Einstellungen zu merken, Offline-Nutzung zu unterstützen und ein konsistentes App-Erlebnis zu ermöglichen. Einige lokale Einträge können den von Ihnen eingegebenen, importierten oder als Entwurf gespeicherten Lebenslauf- oder Stellenbeschreibungstext enthalten. Die App speichert außerdem eine zufällige, von der App erzeugte Gerätekennung, Ihre Entscheidung zur KI-Verarbeitung und aktuelle KI-Ergebnisse, damit derselbe Text ohne erneutes Senden dasselbe Ergebnis liefert."},{"type":"h2","text":"3. Dateien, Fotos, Kamera, Zwischenablage und URL-Importe"},{"type":"ul","items":["Wenn Sie einen Lebenslauf aus Dateien, Fotos oder Kamera importieren, wird die ausgewählte Datei oder das Bild verarbeitet, um Lebenslauftext zu extrahieren.","Der Zugriff auf Fotobibliothek und Kamera wird nur angefordert, wenn Sie ein Lebenslaufbild importieren oder aufnehmen möchten.","Der Zugriff auf die Zwischenablage wird nur verwendet, wenn Sie CV-, Stellenbeschreibungs- oder Support-Kontakttext einfügen oder kopieren.","Wenn Sie eine Stellenbeschreibung von einer URL importieren, verbindet sich die App mit dieser Website, um lesbaren Text abzurufen. Die Website kann gewöhnliche technische Anfrageinformationen wie IP-Adresse, User-Agent, Anfragezeit und die angeforderte URL gemäß ihrer eigenen Datenschutzerklärung erhalten.","Dateiverarbeitung, PDF-Textextraktion, DOCX-Konvertierung und Bild-OCR können unvollständig oder ungenau sein, insbesondere bei gescannten, unscharfen, geschützten, ungewöhnlichen oder schlecht formatierten Dokumenten.","Beim Export eines CV als PDF kann die App eine temporäre Datei erstellen und die von Ihnen ausgewählten Teilen- oder Druckfunktionen des Geräts verwenden."]},{"type":"h2","text":"4. KI-Verarbeitung"},{"type":"p","text":"Wenn Sie eine Lebenslaufanalyse, ein Job-Matching, ein Anschreiben, eine Interviewvorbereitung oder einen KI-Vorschlag im Lebenslauf-Editor starten, fragt CVPilot beim ersten Mal nach Ihrer Erlaubnis und sendet den betreffenden Text anschließend an seinen KI-Dienst. Vor Ihrer Zustimmung wird nichts gesendet, und Sie können die übrigen Funktionen weiter nutzen, wenn Sie ablehnen."},{"type":"ul","items":["Gesendete Daten: der Lebenslauftext, Stellenbeschreibungstext oder Editor-Inhalt, den Sie für die Funktion einreichen, die gewählten Optionen (z. B. Ton, Länge oder Erfahrungsstufe), Ihr Tarif (kostenlos oder Premium) und eine zufällige, von der App erstellte Gerätekennung. Nehmen Sie keine Informationen in diese Texte auf, deren Verarbeitung Sie nicht wünschen.","Dienstleister: Der KI-Dienst von CVPilot läuft auf Cloudflare Workers (Cloudflare, Inc.) und leitet jede Anfrage an Anthropic, PBC weiter, dessen Claude-Modelle das Ergebnis erzeugen. Cloudflare und Anthropic handeln für diese Funktionen als Dienstleister (Auftragsverarbeiter).","Ihr Text wird ausschließlich zur Erstellung des angeforderten Ergebnisses verwendet. Nach den kommerziellen Bedingungen von Anthropic werden über die API gesendete Inhalte nicht zum Training seiner KI-Modelle verwendet. Anthropic kann Ein- und Ausgaben für einen begrenzten Zeitraum aus Sicherheits- und Compliance-Gründen aufbewahren, wie in seiner eigenen Datenschutzerklärung beschrieben.","CAREO LIMITED speichert den Inhalt Ihres Lebenslaufs, Ihrer Stellenbeschreibung oder Ihres Editor-Textes nicht auf seinen Servern. Der KI-Dienst erfasst nur technische Informationen wie Anfragezeit, Anfragetyp, Fehlercodes und Nutzungszahlen und führt pro Gerätekennung einen täglichen Anfragezähler, um Missbrauch zu verhindern.","Cloudflare kann technische Anfrageinformationen wie IP-Adresse und Anfragezeit zum Betrieb seines Netzwerks gemäß seiner eigenen Datenschutzerklärung verarbeiten.","KI-Funktionen erfordern eine Internetverbindung und sind offline nicht verfügbar."]},{"type":"h2","text":"5. Zwecke der Verarbeitung"},{"type":"ul","items":["Bereitstellung von Lebenslaufanalyse, Job-Matching, CV-Builder, Export, Verlauf und Einstellungen","KI-gestützte Lebenslaufanalyse, Matching-Ergebnisse, Anschreiben, Interviewfragen und Formulierungsvorschläge erstellen","Speichern von Nutzereinstellungen und Entwürfen","Anwendung kostenloser Nutzungslimits und Premium-Zugriffsregeln","Verarbeitung von Käufen oder Premium-Zugriff, sofern zutreffend","Verbesserung der Stabilität, Verhinderung von Missbrauch und zuverlässiger Betrieb der App"]},{"type":"h2","text":"6. Drittanbieter- und Plattformdienste"},{"type":"p","text":"Die App kann Plattform- oder Drittanbieterdienste verwenden, darunter Apple App Store, Google Play, In-App-Bewertungsdienste von Apple oder Google, Datei-/Foto-/Kamera-/Teilen-/Druckfunktionen des Geräts sowie Schriftwiedergabe für die Gestaltung von PDF-Exporten. Diese Dienste unterliegen ihren eigenen Datenschutzrichtlinien. KI-Funktionen nutzen Cloudflare (Hosting des KI-Dienstes von CVPilot) und Anthropic (Claude-KI-Modelle), wie in Abschnitt 4 beschrieben."},{"type":"h2","text":"7. Werbung und Tracking"},{"type":"p","text":"CVPilot zeigt keine Drittanbieterwerbung an und verwendet keine Werbe-Tracking-SDKs von Drittanbietern. Text, den Sie für KI-Funktionen einreichen, wird nur zur Bereitstellung dieser Funktionen verwendet und niemals für Werbung."},{"type":"h2","text":"8. Automatisierte Ergebnisse, Genauigkeit und Verantwortung der Nutzer"},{"type":"p","text":"CVPilot stellt automatisierte, KI-generierte Lebenslaufanalysen, Job-Matchings, Bewertungen, Keyword-Vorschläge, Anschreiben, Interviewfragen und Formulierungsvorschläge ausschließlich zu Informationszwecken bereit. KI-generierte Inhalte können Fehler oder Aussagen enthalten, die auf Sie nicht zutreffen, und Ergebnisse können unvollständig, ungenau, veraltet oder für einen bestimmten Arbeitgeber, eine Branche, ein Bewerbermanagementsystem oder ein Einstellungsverfahren ungeeignet sein. Fügen Sie niemals Fähigkeiten, Erfahrungen oder Ergebnisse hinzu, die Sie nicht haben. CVPilot garantiert keine Vorstellungsgespräche, Jobangebote, Einstellungsergebnisse, Annahme des Lebenslaufs, Genauigkeit der Bewertungen oder Kompatibilität mit allen Recruiting-Systemen. Sie sind dafür verantwortlich, alle Ergebnisse vor der Verwendung zu prüfen, Ihren Lebenslauf und Ihre Bewerbungsunterlagen zu verifizieren und Ihre eigenen Karriere-, Bewerbungs-, Einstellungs-, rechtlichen, finanziellen oder beruflichen Entscheidungen zu treffen."},{"type":"h2","text":"9. Beste Leistung und unterstützte Eingaben"},{"type":"p","text":"Für beste Ergebnisse verwenden Sie klare englische Lebensläufe und englische Stellenbeschreibungen mit üblichen Abschnittsüberschriften, vollständigem beruflichem Werdegang, Fähigkeiten, Verantwortlichkeiten, Anforderungen und messbaren Erfolgen. CVPilot kann bei nicht englischen Inhalten, unvollständigen Stellenanzeigen, sehr spezialisierten oder seltenen Rollen, ungewöhnlicher Formatierung, gescannten oder unscharfen Dateien, Bildern mit schlechter Textqualität oder Dokumenten, aus denen Text nicht zuverlässig extrahiert werden kann, weniger genau sein."},{"type":"h2","text":"10. Käufe und Premium-Funktionen"},{"type":"p","text":"Optionale Käufe, Abonnements oder Premium-Zugriffe können über Apple App Store oder Google Play verarbeitet werden. Wir erhalten oder speichern keine vollständigen Zahlungskartendaten. Kaufstatus, Abonnementberechtigung, Verlängerung, Kündigung, Rückerstattungen und Store-Kontodaten können vom jeweiligen App Store gemäß dessen eigenen Bedingungen und Datenschutzrichtlinien verwaltet werden. Der Kaufstatus kann lokal gespeichert oder über den jeweiligen Store geprüft werden."},{"type":"h2","text":"11. Datenweitergabe"},{"type":"p","text":"Wir verkaufen keine personenbezogenen Daten. Text, den Sie für KI-Funktionen einreichen, wird nur zur Erstellung des angeforderten Ergebnisses mit Cloudflare und Anthropic geteilt, wie in Abschnitt 4 beschrieben. Andere lokal gespeicherte App-Inhalte werden nicht mit den Servern von CAREO LIMITED geteilt. Begrenzte Daten können von Plattform- oder Drittanbietern nur wie in dieser Richtlinie beschrieben verarbeitet werden oder wenn Sie Teilen-, Druck-, Store-, Bewertungs- oder URL-Importfunktionen nutzen."},{"type":"h2","text":"12. Aufbewahrung und Löschung"},{"type":"p","text":"Lokale Daten bleiben auf Ihrem Gerät, bis Sie gespeicherte Einträge löschen, relevante App-Daten zurücksetzen oder die App deinstallieren. Temporäre Exportdateien können im Gerätecache gespeichert werden. Zahlungsaufzeichnungen sowie Plattformdaten zu Bewertungen oder Käufen werden von Apple oder Google gemäß deren Richtlinien gespeichert. Für KI-Funktionen gesendeter Text wird nach Rückgabe des Ergebnisses nicht auf den Servern von CAREO LIMITED aufbewahrt; Anthropic kann ihn wie in Abschnitt 4 beschrieben für einen begrenzten Zeitraum aufbewahren. Der tägliche Anfragezähler dient nur der Anwendung von Nutzungslimits."},{"type":"h2","text":"13. Nutzerrechte"},{"type":"p","text":"Je nach Region können Sie Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung oder Widerspruch haben. Da die meisten App-Daten lokal gespeichert werden, können Sie sie meist direkt in der App oder den Geräteeinstellungen verwalten oder entfernen. Sie können uns auch bei Datenschutzfragen kontaktieren. CAREO LIMITED bewahrt keine Kopie des an KI-Funktionen gesendeten Textes auf, daher gibt es bei uns in der Regel nichts einzusehen oder zu löschen. Kontaktieren Sie uns bei Fragen zu dieser Verarbeitung."},{"type":"h2","text":"14. Datensicherheit"},{"type":"p","text":"Wir verwenden HTTPS für externe Kommunikation, sofern zutreffend, und gestalten unsere Apps so, dass die Datenerhebung minimiert wird. Keine Software- oder Geräteumgebung kann absolute Sicherheit garantieren. Der KI-Dienst von CVPilot akzeptiert Anfragen nur von der App über HTTPS und bewahrt den Zugangsschlüssel des KI-Anbieters auf dem Server auf, niemals in der App."},{"type":"h2","text":"15. Datenschutz von Kindern"},{"type":"p","text":"Die App richtet sich nicht an Kinder unter 13 Jahren. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn Sie glauben, dass ein Kind personenbezogene Daten bereitgestellt hat, kontaktieren Sie uns, und wir werden geeignete Maßnahmen ergreifen."},{"type":"h2","text":"16. Internationale Datenübertragungen"},{"type":"p","text":"Plattform- und Drittanbieter können begrenzte Daten in anderen Ländern als Ihrem eigenen verarbeiten. Text, den Sie für KI-Funktionen einreichen, wird von Anthropic in den Vereinigten Staaten verarbeitet und durchläuft das globale Netzwerk von Cloudflare. Wo gesetzlich erforderlich, gelten angemessene Garantien."},{"type":"h2","text":"17. Kontakt"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Aktualisierungen"},{"type":"p","text":"Wir können diese Richtlinie aktualisieren, wenn sich App-Funktionen, Drittanbieter-Dienste oder gesetzliche Anforderungen ändern. Aktualisierungen werden mit einem neuen Datum angezeigt. Die weitere Nutzung der App nach einer Aktualisierung bedeutet, dass Sie die aktualisierte Richtlinie akzeptieren."}],"it":[{"type":"h1","text":"Informativa sulla privacy - CVPilot"},{"type":"meta","html":"<strong>Ultimo aggiornamento:</strong> ottobre 2026<br><strong>App:</strong> CVPilot<br><strong>Sviluppatore / Editore:</strong> CAREO LIMITED<br><strong>Contatto:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot rispetta la tua privacy. Questa Informativa spiega quali informazioni possono essere trattate, come vengono utilizzate e quali diritti hai quando usi l’app mobile su iOS e Android."},{"type":"h2","text":"1. Panoramica del trattamento dei dati"},{"type":"p","text":"La maggior parte dei dati di CVPilot resta sul tuo dispositivo. Per fornire analisi del CV, corrispondenza con le offerte, lettere di presentazione, domande per i colloqui e suggerimenti di scrittura, il testo che invii per queste funzioni viene inviato al servizio di IA di CVPilot ed elaborato dai modelli di IA Claude di Anthropic, come descritto nella Sezione 4. Non vendiamo dati personali e utilizziamo servizi di terze parti solo quando necessari per le funzioni descritte di seguito."},{"type":"h2","text":"2. Dati archiviati localmente"},{"type":"p","text":"L’app può archiviare localmente sul tuo dispositivo contenuto del CV, testo delle descrizioni di lavoro, risultati di analisi e corrispondenza, cronologia, limiti di utilizzo, preferenze dell’app, dati del profilo, bozze del CV builder, contatori di esportazione, stato delle richieste di recensione e stato Premium. Questi dati sono usati per fornire le funzioni dell’app, ricordare le preferenze, supportare l’uso offline quando disponibile e mantenere un’esperienza coerente. Alcuni record locali possono includere il testo del CV o della descrizione di lavoro che hai inserito, importato o salvato come bozza. L’app memorizza inoltre un identificativo del dispositivo casuale generato dall’app, la tua scelta sull’elaborazione tramite IA e i risultati IA recenti, in modo che lo stesso testo restituisca lo stesso risultato senza essere inviato di nuovo."},{"type":"h2","text":"3. File, foto, fotocamera, appunti e importazione da URL"},{"type":"ul","items":["Se importi un CV da File, Foto o Fotocamera, il file o l’immagine selezionati vengono elaborati per estrarre il testo del CV.","L’accesso alla libreria foto e alla fotocamera viene richiesto solo quando scegli di importare o acquisire un’immagine del CV.","L’accesso agli appunti viene usato solo quando scegli di incollare o copiare testo del CV, della descrizione lavoro o del contatto supporto.","Se importi una descrizione di lavoro da un URL, l’app si collega a quel sito per recuperare testo leggibile. Il sito può ricevere informazioni tecniche ordinarie della richiesta, come indirizzo IP, user agent, ora della richiesta e URL richiesto, secondo la propria informativa sulla privacy.","L’analisi dei file, l’estrazione del testo dai PDF, la conversione DOCX e l’OCR delle immagini possono essere incomplete o imprecise, soprattutto per documenti scansionati, sfocati, protetti, insoliti o formattati male.","Quando esporti un CV in PDF, l’app può creare un file temporaneo e usare gli strumenti di condivisione o stampa del dispositivo che scegli."]},{"type":"h2","text":"4. Elaborazione tramite IA"},{"type":"p","text":"Quando avvii un’analisi del CV, una corrispondenza con un’offerta, una lettera di presentazione, una preparazione al colloquio o un suggerimento IA nel generatore di CV, CVPilot ti chiede il permesso la prima volta e poi invia il testo pertinente al suo servizio di IA. Nulla viene inviato prima del tuo consenso e, se rifiuti, puoi continuare a usare le altre funzioni dell’app."},{"type":"ul","items":["Dati inviati: il testo del CV, dell’offerta di lavoro o del generatore di CV che invii per quella funzione, le opzioni scelte (come tono, lunghezza o livello di esperienza), il tipo di piano (gratuito o premium) e un identificativo del dispositivo casuale creato dall’app. Non includere in questi testi informazioni che non vuoi far elaborare.","Fornitori di servizi: il servizio di IA di CVPilot funziona su Cloudflare Workers (Cloudflare, Inc.) e inoltra ogni richiesta ad Anthropic, PBC, i cui modelli Claude generano il risultato. Cloudflare e Anthropic agiscono come fornitori di servizi (responsabili del trattamento) per queste funzioni.","Il tuo testo viene utilizzato solo per produrre il risultato richiesto. In base ai termini commerciali di Anthropic, i contenuti inviati tramite la sua API non vengono utilizzati per addestrare i suoi modelli di IA. Anthropic può conservare input e output per un periodo limitato per motivi di sicurezza e conformità legale, come descritto nella propria informativa sulla privacy.","CAREO LIMITED non memorizza sui propri server il contenuto del tuo CV, dell’offerta di lavoro o del testo del generatore. Il servizio di IA registra solo informazioni tecniche, come orario e tipo di richiesta, codici di errore e conteggi di utilizzo, e mantiene un contatore giornaliero delle richieste per identificativo del dispositivo per prevenire abusi.","Cloudflare può elaborare informazioni tecniche sulle richieste, come indirizzo IP e orario, per gestire la propria rete, secondo la propria informativa sulla privacy.","Le funzioni IA richiedono una connessione a Internet e non sono disponibili offline."]},{"type":"h2","text":"5. Finalità del trattamento"},{"type":"ul","items":["Fornire analisi del CV, matching lavoro, CV builder, esportazione, cronologia e impostazioni","Generare con l’IA analisi del CV, risultati di corrispondenza, lettere di presentazione, domande per i colloqui e suggerimenti di scrittura","Ricordare preferenze e bozze salvate","Applicare limiti gratuiti e regole di accesso Premium","Gestire acquisti o accesso Premium se applicabile","Migliorare stabilità, prevenire abusi e mantenere l’app affidabile"]},{"type":"h2","text":"6. Servizi di piattaforma e terze parti"},{"type":"p","text":"L’app può utilizzare servizi di piattaforma o di terze parti, inclusi Apple App Store, Google Play, servizi di recensione in-app di Apple o Google, strumenti del dispositivo per file/foto/fotocamera/condivisione/stampa e rendering dei font usato per lo stile delle esportazioni PDF. Questi servizi operano secondo le proprie informative sulla privacy. Le funzioni IA utilizzano Cloudflare (hosting del servizio di IA di CVPilot) e Anthropic (modelli di IA Claude), come descritto nella Sezione 4."},{"type":"h2","text":"7. Pubblicità e tracciamento"},{"type":"p","text":"CVPilot non mostra pubblicità di terze parti e non utilizza SDK di tracciamento pubblicitario di terze parti. Il testo che invii per le funzioni IA viene usato solo per fornire tali funzioni e mai per la pubblicità."},{"type":"h2","text":"8. Risultati automatizzati, accuratezza e responsabilità dell’utente"},{"type":"p","text":"CVPilot fornisce analisi del CV, corrispondenze con le offerte, punteggi, suggerimenti di parole chiave, lettere di presentazione, domande per i colloqui e suggerimenti di scrittura automatizzati e generati dall’IA, solo a scopo informativo. I contenuti generati dall’IA possono contenere errori o affermazioni non vere per te, e i risultati possono essere incompleti, inesatti, non aggiornati o non adatti a uno specifico datore di lavoro, settore, sistema di tracciamento dei candidati o processo di selezione. Non aggiungere mai competenze, esperienze o risultati che non possiedi. CVPilot non garantisce colloqui, offerte di lavoro, esiti delle selezioni, accettazione del CV, accuratezza dei punteggi o compatibilità con ogni sistema di reclutamento. Sei responsabile di verificare tutti i risultati prima di usarli, controllare il tuo CV e i materiali di candidatura e prendere le tue decisioni professionali, di candidatura, di assunzione, legali o finanziarie."},{"type":"h2","text":"9. Migliori prestazioni e input supportato"},{"type":"p","text":"Per ottenere i migliori risultati, usa CV e descrizioni di lavoro chiari in inglese, con intestazioni di sezione standard, storia lavorativa completa, competenze, responsabilità, requisiti e risultati misurabili. CVPilot può essere meno accurato con contenuti non inglesi, annunci incompleti, ruoli molto specializzati o rari, formattazione insolita del CV, file scansionati o sfocati, immagini con testo di bassa qualità o documenti da cui il testo non può essere estratto in modo affidabile."},{"type":"h2","text":"10. Acquisti e funzioni Premium"},{"type":"p","text":"Acquisti, abbonamenti o accessi Premium opzionali possono essere elaborati da Apple App Store o Google Play. Non riceviamo né archiviamo i dati completi della carta di pagamento. Stato dell’acquisto, diritto di abbonamento, rinnovo, cancellazione, gestione dei rimborsi e dati dell’account dello store possono essere gestiti dallo store pertinente secondo i propri termini e la propria informativa sulla privacy. Lo stato dell’acquisto può essere archiviato localmente o verificato tramite lo store pertinente."},{"type":"h2","text":"11. Condivisione dei dati"},{"type":"p","text":"Non vendiamo dati personali. Il testo che invii per le funzioni IA viene condiviso con Cloudflare e Anthropic solo per produrre il risultato richiesto, come descritto nella Sezione 4. Gli altri contenuti memorizzati localmente non vengono condivisi con i server di CAREO LIMITED. Dati limitati possono essere elaborati da piattaforme o fornitori terzi solo come descritto nella presente Informativa o quando scegli di usare le funzioni di condivisione, stampa, store, recensione o importazione da URL."},{"type":"h2","text":"12. Conservazione e cancellazione"},{"type":"p","text":"I dati locali restano sul dispositivo finché non elimini le voci salvate dove disponibile, reimposti i dati pertinenti dell’app dove disponibile o disinstalli l’app. I file temporanei di esportazione possono essere archiviati nella cache del dispositivo. Record di pagamento e record di recensione o acquisto della piattaforma sono conservati da Apple o Google secondo le loro politiche. Il testo inviato per le funzioni IA non viene conservato sui server di CAREO LIMITED dopo la restituzione del risultato; Anthropic può conservarlo per un periodo limitato come descritto nella Sezione 4. Il contatore giornaliero delle richieste serve solo ad applicare i limiti di utilizzo."},{"type":"h2","text":"13. Diritti degli utenti"},{"type":"p","text":"A seconda della tua regione, potresti avere diritti di accesso, rettifica, cancellazione, limitazione o opposizione. Poiché la maggior parte dei dati è archiviata localmente, di solito puoi gestirli o rimuoverli tramite l’app o le impostazioni del dispositivo. Puoi anche contattarci per domande sulla privacy. CAREO LIMITED non conserva una copia del testo inviato alle funzioni IA, quindi di norma non c’è nulla da consultare o cancellare da parte nostra; contattaci per domande su questa elaborazione."},{"type":"h2","text":"14. Sicurezza dei dati"},{"type":"p","text":"Usiamo HTTPS per comunicazioni esterne quando applicabile e progettiamo le nostre app per ridurre la raccolta di dati. Nessun software o dispositivo può garantire sicurezza assoluta. Il servizio di IA di CVPilot accetta richieste solo dall’app tramite HTTPS e conserva la chiave di accesso del fornitore di IA sul server, mai nell’app."},{"type":"h2","text":"15. Privacy dei minori"},{"type":"p","text":"L’app non è rivolta a minori di 13 anni. Non raccogliamo consapevolmente dati personali da minori di 13 anni. Se ritieni che un minore abbia fornito dati personali, contattaci e prenderemo misure appropriate."},{"type":"h2","text":"16. Trasferimenti internazionali"},{"type":"p","text":"Piattaforme e fornitori terzi possono elaborare dati limitati in paesi diversi dal tuo. Il testo che invii per le funzioni IA viene elaborato da Anthropic negli Stati Uniti e transita sulla rete globale di Cloudflare. Ove richiesto dalla legge si applicano garanzie adeguate."},{"type":"h2","text":"17. Contatto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Aggiornamenti dell’Informativa"},{"type":"p","text":"Possiamo aggiornare questa Informativa se cambiano le funzioni dell’app, i servizi di terze parti o i requisiti legali. Gli aggiornamenti saranno indicati con una nuova data. L’uso continuato dell’app dopo un aggiornamento significa che accetti l’Informativa aggiornata."}],"ja":[{"type":"h1","text":"プライバシーポリシー - CVPilot"},{"type":"meta","html":"<strong>最終更新:</strong> 2026年10月<br><strong>アプリ:</strong> CVPilot<br><strong>開発者 / 発行者:</strong> CAREO LIMITED<br><strong>連絡先:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilotはお客様のプライバシーを尊重します。本ポリシーは、iOSおよびAndroidのモバイルアプリを利用する際に処理される可能性のある情報、その利用方法、お客様の権利について説明します。"},{"type":"h2","text":"1. データ処理の概要"},{"type":"p","text":"CVPilotのデータの大部分はお使いのデバイスに保存されます。履歴書分析、求人マッチング、カバーレター、面接質問、文章の提案を提供するため、これらの機能で送信されたテキストはCVPilotのAIサービスに送られ、第4条に記載のとおりAnthropicのClaude AIモデルによって処理されます。当社は個人データを販売せず、以下に記載する機能に必要な場合にのみ第三者サービスを利用します。"},{"type":"h2","text":"2. ローカルに保存されるデータ"},{"type":"p","text":"本アプリは、履歴書の内容、求人情報テキスト、分析およびマッチング結果、履歴、利用制限、アプリ設定、プロフィール情報、CVビルダーの下書き、エクスポート回数、レビュー依頼の状態、Premium状態を、お使いのデバイス上にローカル保存する場合があります。これらのデータは、アプリ機能の提供、設定の記憶、利用可能な場合のオフライン利用のサポート、一貫したアプリ体験の維持に使用されます。一部のローカル記録には、入力、インポート、または下書きとして保存した履歴書や求人情報のテキストが含まれる場合があります。 また、アプリが生成したランダムなデバイス識別子、AI処理に関するお客様の選択、および同じテキストを再送信せずに同じ結果を返すための最近のAI結果も保存します。"},{"type":"h2","text":"3. ファイル、写真、カメラ、クリップボード、URLインポート"},{"type":"ul","items":["ファイル、写真、またはカメラから履歴書をインポートする場合、選択されたファイルまたは画像は履歴書テキストを抽出するために処理されます。","写真ライブラリおよびカメラへのアクセスは、履歴書画像をインポートまたは撮影することを選択した場合にのみ要求されます。","クリップボードへのアクセスは、CV、求人説明、またはサポート連絡先のテキストを貼り付けまたはコピーすることを選択した場合にのみ使用されます。","URLから求人情報をインポートする場合、アプリは読み取り可能なテキストを取得するために該当ウェブサイトへ接続します。そのウェブサイトは、IPアドレス、ユーザーエージェント、リクエスト時刻、要求されたURLなどの通常の技術的リクエスト情報を、自らのプライバシーポリシーに従って受け取る場合があります。","ファイル解析、PDFテキスト抽出、DOCX変換、画像OCRは、特にスキャン、ぼやけ、保護、特殊形式、または不適切に整形された文書では、不完全または不正確になる場合があります。","CVをPDFとしてエクスポートする場合、アプリは一時ファイルを作成し、お客様が選択した端末の共有または印刷ツールを使用する場合があります。"]},{"type":"h2","text":"4. AIによる処理"},{"type":"p","text":"履歴書分析、求人マッチング、カバーレター、面接準備、または履歴書ビルダーでのAI提案を開始すると、CVPilotは初回にお客様の許可を求め、その後、該当するテキストをAIサービスに送信します。許可されるまで何も送信されず、拒否した場合もアプリのその他の機能は引き続きご利用いただけます。"},{"type":"ul","items":["送信されるデータ：その機能のために送信する履歴書、求人票、または履歴書ビルダーのテキスト、選択したオプション（トーン、長さ、経験レベルなど）、プランの種類（無料またはプレミアム）、およびアプリが作成したランダムなデバイス識別子。処理されたくない情報はこれらのテキストに含めないでください。","サービス提供者：CVPilotのAIサービスはCloudflare Workers（Cloudflare, Inc.）上で動作し、各リクエストをAnthropic, PBCに転送します。AnthropicのClaudeモデルが結果を生成します。CloudflareとAnthropicはこれらの機能のサービス提供者（処理者）として行動します。","お客様のテキストは、要求された結果を生成するためにのみ使用されます。Anthropicの商用規約に基づき、APIを通じて送信されたコンテンツはAIモデルのトレーニングに使用されません。Anthropicは、安全性および法令遵守のため、同社のプライバシーポリシーに記載のとおり、入力と出力を限られた期間保持する場合があります。","CAREO LIMITEDは、履歴書、求人票、ビルダーのテキストの内容を自社サーバーに保存しません。AIサービスはリクエスト時刻、リクエストの種類、エラーコード、利用回数などの技術情報のみを記録し、不正利用防止のためデバイス識別子ごとに1日のリクエスト数を記録します。","Cloudflareは、自社のプライバシーポリシーに基づき、ネットワーク運用のためにIPアドレスやリクエスト時刻などの技術的なリクエスト情報を処理する場合があります。","AI機能にはインターネット接続が必要で、オフライン時は利用できません。"]},{"type":"h2","text":"5. 処理目的"},{"type":"ul","items":["履歴書分析、求人マッチング、CVビルダー、エクスポート、履歴、設定機能の提供","AIによる履歴書分析、マッチング結果、カバーレター、面接質問、文章の提案の生成","ユーザー設定および保存済み下書きの記憶","無料利用制限およびPremiumアクセスルールの適用","該当する場合の購入またはPremiumアクセスの処理","安定性の向上、不正利用の防止、アプリの信頼性維持"]},{"type":"h2","text":"6. 第三者およびプラットフォームサービス"},{"type":"p","text":"本アプリは、Apple App Store、Google Play、AppleまたはGoogleのアプリ内レビューサービス、デバイスのファイル/写真/カメラ/共有/印刷ツール、およびPDFエクスポートのスタイル設定に使用されるフォントレンダリングなどのプラットフォームまたは第三者サービスを使用する場合があります。これらのサービスは、それぞれのプライバシーポリシーに従って運営されます。 AI機能では、第4条に記載のとおり、Cloudflare（CVPilot AIサービスのホスティング）およびAnthropic（Claude AIモデル）を利用します。"},{"type":"h2","text":"7. 広告およびトラッキング"},{"type":"p","text":"CVPilotは第三者広告を表示せず、第三者の広告トラッキングSDKも使用しません。AI機能のために送信されたテキストは、その機能の提供のみに使用され、広告に使用されることはありません。"},{"type":"h2","text":"8. 自動結果、正確性、およびユーザーの責任"},{"type":"p","text":"CVPilotは、自動化されたAI生成の履歴書分析、求人マッチング、スコアリング、キーワード提案、カバーレター、面接質問、文章の提案を情報提供のみを目的として提供します。AIが生成した内容には誤りや、お客様に当てはまらない記述が含まれる場合があり、結果は不完全、不正確、古い、または特定の雇用主、業界、応募者追跡システム、採用プロセスに適さない場合があります。持っていないスキル、経験、実績を追加しないでください。CVPilotは、面接、内定、採用結果、履歴書の受理、スコアの正確性、すべての採用システムとの互換性を保証しません。結果を使用する前にすべて確認し、履歴書と応募書類を検証し、キャリア、応募、採用、法律、財務、職業上の判断はご自身で行う責任があります。"},{"type":"h2","text":"9. 最適な性能と対応入力"},{"type":"p","text":"最良の結果を得るには、標準的なセクション見出し、完全な職務経歴、スキル、責任、要件、測定可能な実績を含む、明確な英語の履歴書と英語の求人情報を使用してください。英語以外の内容、不完全な求人情報、非常に専門的または珍しい職種、特殊な履歴書形式、スキャンまたはぼやけたファイル、文字品質の低い画像、またはテキストを確実に抽出できない文書では、CVPilotの精度が低下する場合があります。"},{"type":"h2","text":"10. 購入およびPremium機能"},{"type":"p","text":"任意の購入、サブスクリプション、またはPremiumアクセスは、Apple App StoreまたはGoogle Playによって処理される場合があります。当社は完全な支払いカード情報を受け取ったり保存したりしません。購入状態、サブスクリプション資格、更新、解約、返金処理、ストアアカウントデータは、該当するアプリストアがその規約およびプライバシーポリシーに従って管理する場合があります。購入状態はローカルに保存されるか、該当ストアを通じて確認される場合があります。"},{"type":"h2","text":"11. データ共有"},{"type":"p","text":"当社は個人データを販売しません。AI機能のために送信されたテキストは、第4条に記載のとおり、要求された結果を生成するためにのみCloudflareおよびAnthropicと共有されます。その他のローカルに保存されたアプリのコンテンツは、CAREO LIMITEDのサーバーと共有されません。限られたデータは、本ポリシーに記載された範囲、またはお客様がデバイスの共有、印刷、ストア、レビュー、URLインポート機能を利用する場合にのみ、プラットフォームまたは第三者提供者によって処理されることがあります。"},{"type":"h2","text":"12. データの保持と削除"},{"type":"p","text":"ローカルデータは、利用可能な保存済み項目を削除する、関連するアプリデータをリセットする、またはアプリをアンインストールするまで端末に残ります。一時的なエクスポートファイルは端末のキャッシュに保存される場合があります。支払い記録およびプラットフォームのレビューまたは購入記録は、AppleまたはGoogleの各ポリシーに従って保持されます。 AI機能のために送信されたテキストは、結果の返却後にCAREO LIMITEDのサーバーに保持されません。Anthropicは第4条に記載のとおり限られた期間保持する場合があります。1日のリクエスト数は利用制限の適用にのみ使用されます。"},{"type":"h2","text":"13. ユーザーの権利"},{"type":"p","text":"地域によっては、アクセス、訂正、削除、制限、または異議申し立ての権利を有する場合があります。ほとんどのアプリデータはローカルに保存されるため、通常はアプリまたは端末設定から管理または削除できます。プライバシーに関する質問について当社に連絡することもできます。 CAREO LIMITEDはAI機能に送信されたテキストのコピーを保持しないため、通常、当社側で閲覧または削除できるものはありません。この処理に関するご質問はお問い合わせください。"},{"type":"h2","text":"14. データセキュリティ"},{"type":"p","text":"該当する場合、外部通信にはHTTPSを使用し、データ収集を最小限に抑えるようアプリを設計しています。いかなるソフトウェアまたは端末環境も絶対的な安全性を保証することはできません。 CVPilotのAIサービスはHTTPS経由でアプリからのリクエストのみを受け付け、AIプロバイダーのアクセスキーはアプリではなくサーバーにのみ保管します。"},{"type":"h2","text":"15. 子どものプライバシー"},{"type":"p","text":"本アプリは13歳未満の子どもを対象としていません。当社は13歳未満の子どもから故意に個人データを収集しません。子どもが個人データを提供したと思われる場合は当社までご連絡ください。適切に対応します。"},{"type":"h2","text":"16. 国際データ移転"},{"type":"p","text":"プラットフォームおよび第三者提供者は、お客様の国以外で限られたデータを処理する場合があります。AI機能のために送信されたテキストは米国でAnthropicにより処理され、Cloudflareのグローバルネットワークを経由します。法律で求められる場合は適切な保護措置が適用されます。"},{"type":"h2","text":"17. 連絡先"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. ポリシーの更新"},{"type":"p","text":"アプリ機能、第三者サービス、または法的要件が変更された場合、本ポリシーを更新することがあります。更新は新しい最終更新日で示されます。更新後もアプリを継続して使用する場合、更新後のポリシーに同意したものとみなされます。"}],"ko":[{"type":"h1","text":"개인정보 처리방침 - CVPilot"},{"type":"meta","html":"<strong>마지막 업데이트:</strong> 2026년 10월<br><strong>앱:</strong> CVPilot<br><strong>개발자 / 게시자:</strong> CAREO LIMITED<br><strong>문의:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot은 사용자의 개인정보를 존중합니다. 본 방침은 iOS 및 Android 모바일 앱 사용 시 처리될 수 있는 정보, 그 사용 방법 및 사용자의 권리를 설명합니다."},{"type":"h2","text":"1. 데이터 처리 개요"},{"type":"p","text":"CVPilot 데이터의 대부분은 기기에 보관됩니다. 이력서 분석, 채용 매칭, 자기소개서, 면접 질문 및 작성 제안을 제공하기 위해 이러한 기능에 제출한 텍스트는 CVPilot AI 서비스로 전송되어 제4조에 설명된 대로 Anthropic의 Claude AI 모델이 처리합니다. 당사는 개인 데이터를 판매하지 않으며 아래에 설명된 기능에 필요한 경우에만 제3자 서비스를 사용합니다."},{"type":"h2","text":"2. 로컬 저장 데이터"},{"type":"p","text":"앱은 이력서 내용, 채용공고 텍스트, 분석 및 매칭 결과, 기록, 사용 제한, 앱 환경설정, 프로필 정보, CV 빌더 초안, 내보내기 카운터, 리뷰 요청 상태, Premium 상태를 기기에 로컬로 저장할 수 있습니다. 이 데이터는 앱 기능 제공, 환경설정 기억, 가능한 경우 오프라인 사용 지원, 일관된 앱 경험 유지를 위해 사용됩니다. 일부 로컬 기록에는 사용자가 입력, 가져오기 또는 초안으로 저장한 CV나 채용공고 텍스트가 포함될 수 있습니다. 또한 앱은 앱이 생성한 무작위 기기 식별자, AI 처리에 대한 사용자의 선택, 그리고 같은 텍스트를 다시 보내지 않고도 같은 결과를 보여 주기 위한 최근 AI 결과를 저장합니다."},{"type":"h2","text":"3. 파일, 사진, 카메라, 클립보드 및 URL 가져오기"},{"type":"ul","items":["파일, 사진 또는 카메라에서 이력서를 가져오는 경우 선택한 파일 또는 이미지는 이력서 텍스트 추출을 위해 처리됩니다.","사진 라이브러리 및 카메라 접근은 이력서 이미지를 가져오거나 촬영하기로 선택한 경우에만 요청됩니다.","클립보드 접근은 CV, 채용공고 또는 지원 연락처 텍스트를 붙여넣거나 복사하기로 선택한 경우에만 사용됩니다.","URL에서 채용공고를 가져오는 경우, 앱은 읽을 수 있는 텍스트를 가져오기 위해 해당 웹사이트에 연결합니다. 해당 웹사이트는 자체 개인정보 처리방침에 따라 IP 주소, 사용자 에이전트, 요청 시간, 요청된 URL과 같은 일반적인 기술적 요청 정보를 받을 수 있습니다.","파일 파싱, PDF 텍스트 추출, DOCX 변환 및 이미지 OCR은 특히 스캔, 흐림, 보호됨, 특이한 형식 또는 잘못 포맷된 문서에서 불완전하거나 부정확할 수 있습니다.","CV를 PDF로 내보낼 때 앱은 임시 파일을 만들고 사용자가 선택한 기기의 공유 또는 인쇄 도구를 사용할 수 있습니다."]},{"type":"h2","text":"4. AI 처리"},{"type":"p","text":"이력서 분석, 채용 매칭, 자기소개서, 면접 준비 또는 이력서 빌더의 AI 제안을 시작하면 CVPilot은 처음에 사용자의 허락을 요청한 후 관련 텍스트를 AI 서비스로 보냅니다. 허락하기 전에는 아무것도 전송되지 않으며, 거절하더라도 앱의 다른 기능은 계속 사용할 수 있습니다."},{"type":"ul","items":["전송되는 데이터: 해당 기능에 제출한 이력서, 채용 공고 또는 이력서 빌더 텍스트, 선택한 옵션(어조, 길이, 경력 수준 등), 요금제 유형(무료 또는 프리미엄), 앱이 생성한 무작위 기기 식별자. 처리되기를 원하지 않는 정보는 이 텍스트에 포함하지 마세요.","서비스 제공자: CVPilot AI 서비스는 Cloudflare Workers(Cloudflare, Inc.)에서 실행되며 각 요청을 Anthropic, PBC에 전달하고, Anthropic의 Claude 모델이 결과를 생성합니다. Cloudflare와 Anthropic은 이 기능에 대해 서비스 제공자(처리자)로 활동합니다.","사용자의 텍스트는 요청한 결과를 생성하는 데에만 사용됩니다. Anthropic의 상업 약관에 따라 API를 통해 전송된 콘텐츠는 AI 모델 학습에 사용되지 않습니다. Anthropic은 자체 개인정보 처리방침에 설명된 대로 안전 및 법규 준수를 위해 입력과 출력을 제한된 기간 동안 보관할 수 있습니다.","CAREO LIMITED는 이력서, 채용 공고 또는 빌더 텍스트의 내용을 자사 서버에 저장하지 않습니다. AI 서비스는 요청 시간, 요청 유형, 오류 코드, 사용 횟수와 같은 기술 정보만 기록하며, 남용 방지를 위해 기기 식별자별 일일 요청 횟수를 기록합니다.","Cloudflare는 자체 개인정보 처리방침에 따라 네트워크 운영을 위해 IP 주소 및 요청 시간과 같은 기술적 요청 정보를 처리할 수 있습니다.","AI 기능은 인터넷 연결이 필요하며 오프라인 상태에서는 사용할 수 없습니다."]},{"type":"h2","text":"5. 처리 목적"},{"type":"ul","items":["이력서 분석, 채용 매칭, CV 빌더, 내보내기, 기록 및 설정 기능 제공","AI 기반 이력서 분석, 매칭 결과, 자기소개서, 면접 질문 및 작성 제안 생성","사용자 환경설정 및 저장된 초안 기억","무료 사용 제한 및 Premium 접근 규칙 적용","해당되는 경우 구매 또는 Premium 접근 처리","안정성 개선, 남용 방지 및 앱의 안정적 작동 유지"]},{"type":"h2","text":"6. 제3자 및 플랫폼 서비스"},{"type":"p","text":"앱은 Apple App Store, Google Play, Apple 또는 Google의 앱 내 리뷰 서비스, 기기의 파일/사진/카메라/공유/인쇄 도구, PDF 내보내기 스타일링에 사용되는 글꼴 렌더링을 포함한 플랫폼 또는 제3자 서비스를 사용할 수 있습니다. 이러한 서비스는 각자의 개인정보 처리방침에 따라 운영됩니다. AI 기능은 제4조에 설명된 대로 Cloudflare(CVPilot AI 서비스 호스팅)와 Anthropic(Claude AI 모델)을 사용합니다."},{"type":"h2","text":"7. 광고 및 추적"},{"type":"p","text":"CVPilot은 제3자 광고를 표시하지 않으며 제3자 광고 추적 SDK를 사용하지 않습니다. AI 기능에 제출한 텍스트는 해당 기능 제공에만 사용되며 광고에는 절대 사용되지 않습니다."},{"type":"h2","text":"8. 자동 결과, 정확성 및 사용자 책임"},{"type":"p","text":"CVPilot은 자동화된 AI 생성 이력서 분석, 채용 매칭, 점수, 키워드 제안, 자기소개서, 면접 질문 및 작성 제안을 정보 제공 목적으로만 제공합니다. AI가 생성한 콘텐츠에는 오류나 사용자에게 사실이 아닌 내용이 포함될 수 있으며, 결과는 불완전하거나 부정확하거나 오래되었거나 특정 고용주, 산업, 지원자 추적 시스템 또는 채용 절차에 적합하지 않을 수 있습니다. 보유하지 않은 기술, 경험 또는 성과를 추가하지 마세요. CVPilot은 면접, 채용 제안, 채용 결과, 이력서 수락, 점수의 정확성 또는 모든 채용 시스템과의 호환성을 보장하지 않습니다. 결과를 사용하기 전에 모두 검토하고, 이력서와 지원 자료를 확인하며, 경력, 지원, 채용, 법률, 재무 또는 직업상의 결정은 스스로 내릴 책임이 있습니다."},{"type":"h2","text":"9. 최적 성능 및 지원 입력"},{"type":"p","text":"최상의 결과를 위해 표준 섹션 제목, 완전한 경력, 기술, 책임, 요구사항 및 측정 가능한 성과가 포함된 명확한 영어 CV와 영어 채용공고를 사용하세요. 영어가 아닌 콘텐츠, 불완전한 채용공고, 매우 전문적이거나 드문 직무, 특이한 CV 형식, 스캔되었거나 흐릿한 파일, 텍스트 품질이 낮은 이미지, 텍스트를 안정적으로 추출할 수 없는 문서에서는 CVPilot의 정확도가 낮아질 수 있습니다."},{"type":"h2","text":"10. 구매 및 Premium 기능"},{"type":"p","text":"선택적 구매, 구독 또는 Premium 액세스는 Apple App Store 또는 Google Play에서 처리될 수 있습니다. 당사는 전체 결제 카드 정보를 받거나 저장하지 않습니다. 구매 상태, 구독 권한, 갱신, 취소, 환불 처리 및 스토어 계정 데이터는 해당 앱 스토어가 자체 약관 및 개인정보 처리방침에 따라 관리할 수 있습니다. 구매 상태는 로컬에 저장되거나 해당 스토어를 통해 확인될 수 있습니다."},{"type":"h2","text":"11. 데이터 공유"},{"type":"p","text":"당사는 개인 데이터를 판매하지 않습니다. AI 기능에 제출한 텍스트는 제4조에 설명된 대로 요청한 결과를 생성하기 위해서만 Cloudflare 및 Anthropic과 공유됩니다. 그 밖에 로컬에 저장된 앱 콘텐츠는 CAREO LIMITED 서버와 공유되지 않습니다. 제한된 데이터는 본 방침에 설명된 경우 또는 사용자가 기기 공유, 인쇄, 스토어, 리뷰, URL 가져오기 기능을 사용하는 경우에만 플랫폼 또는 제3자 제공자가 처리할 수 있습니다."},{"type":"h2","text":"12. 데이터 보관 및 삭제"},{"type":"p","text":"로컬 데이터는 사용자가 가능한 저장 항목을 삭제하거나, 관련 앱 데이터를 재설정하거나, 앱을 제거할 때까지 기기에 남아 있습니다. 임시 내보내기 파일은 기기 캐시에 저장될 수 있습니다. 결제 기록 및 플랫폼 리뷰 또는 구매 기록은 Apple 또는 Google의 자체 정책에 따라 보관됩니다. AI 기능을 위해 전송된 텍스트는 결과가 반환된 후 CAREO LIMITED 서버에 보관되지 않으며, Anthropic은 제4조에 설명된 대로 제한된 기간 동안 보관할 수 있습니다. 일일 요청 횟수는 사용 한도 적용에만 사용됩니다."},{"type":"h2","text":"13. 사용자 권리"},{"type":"p","text":"지역에 따라 접근, 정정, 삭제, 제한 또는 처리 반대 권리가 있을 수 있습니다. 대부분의 앱 데이터는 로컬에 저장되므로 일반적으로 앱 또는 기기 설정을 통해 관리하거나 제거할 수 있습니다. 개인정보 관련 문의는 당사에 연락할 수도 있습니다. CAREO LIMITED는 AI 기능에 전송된 텍스트의 사본을 보관하지 않으므로 일반적으로 당사 측에서 열람하거나 삭제할 데이터가 없습니다. 이 처리에 대해 궁금한 점이 있으면 문의해 주세요."},{"type":"h2","text":"14. 데이터 보안"},{"type":"p","text":"해당되는 경우 외부 통신에는 HTTPS를 사용하며 데이터 수집을 최소화하도록 앱을 설계합니다. 어떤 소프트웨어나 기기 환경도 절대적인 보안을 보장할 수 없습니다. CVPilot AI 서비스는 HTTPS를 통한 앱의 요청만 받으며, AI 제공자의 액세스 키는 앱이 아닌 서버에만 보관합니다."},{"type":"h2","text":"15. 아동 개인정보"},{"type":"p","text":"본 앱은 13세 미만 아동을 대상으로 하지 않습니다. 당사는 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 아동이 개인정보를 제공했다고 생각되는 경우 당사에 연락해 주시면 적절한 조치를 취하겠습니다."},{"type":"h2","text":"16. 국제 데이터 이전"},{"type":"p","text":"플랫폼 및 제3자 제공자는 사용자 국가 외의 국가에서 제한된 데이터를 처리할 수 있습니다. AI 기능에 제출한 텍스트는 미국에서 Anthropic이 처리하며 Cloudflare의 글로벌 네트워크를 거칩니다. 법률에서 요구하는 경우 적절한 보호 조치가 적용됩니다."},{"type":"h2","text":"17. 문의"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. 방침 업데이트"},{"type":"p","text":"앱 기능, 제3자 서비스 또는 법적 요구사항이 변경되는 경우 본 방침을 업데이트할 수 있습니다. 업데이트는 새로운 마지막 업데이트 날짜로 표시됩니다. 업데이트 후 앱을 계속 사용하면 업데이트된 방침에 동의하는 것으로 간주됩니다."}],"pt":[{"type":"h1","text":"Política de Privacidade - CVPilot"},{"type":"meta","html":"<strong>Última atualização:</strong> outubro de 2026<br><strong>App:</strong> CVPilot<br><strong>Programador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"A CVPilot respeita a sua privacidade. Esta Política explica que informações podem ser tratadas, como são usadas e quais são os seus direitos ao usar a aplicação móvel em iOS e Android."},{"type":"h2","text":"1. Visão geral do tratamento de dados"},{"type":"p","text":"A maior parte dos dados do CVPilot permanece no seu dispositivo. Para fornecer análise de currículo, correspondência com vagas, cartas de apresentação, perguntas de entrevista e sugestões de escrita, o texto que você envia para esses recursos é enviado ao serviço de IA do CVPilot e processado pelos modelos de IA Claude da Anthropic, conforme descrito na Seção 4. Não vendemos dados pessoais e só usamos serviços de terceiros quando necessários para os recursos descritos abaixo."},{"type":"h2","text":"2. Dados armazenados localmente"},{"type":"p","text":"A app pode armazenar localmente no teu dispositivo conteúdo de CV, texto de descrições de emprego, resultados de análise e correspondência, histórico, limites de utilização, preferências da app, dados de perfil, rascunhos do criador de CV, contadores de exportação, estado de pedidos de avaliação e estado Premium. Estes dados são usados para fornecer funções da app, lembrar preferências, suportar uso offline quando disponível e manter uma experiência consistente. Alguns registos locais podem incluir o texto do CV ou da descrição de emprego que introduziste, importaste ou guardaste como rascunho. O aplicativo também armazena um identificador de dispositivo aleatório gerado pelo aplicativo, sua escolha sobre o processamento por IA e resultados recentes de IA, para que o mesmo texto retorne o mesmo resultado sem ser enviado novamente."},{"type":"h2","text":"3. Ficheiros, fotos, câmara, área de transferência e importações por URL"},{"type":"ul","items":["Se importar um CV a partir de Ficheiros, Fotos ou Câmara, o ficheiro ou imagem selecionado é tratado para extrair texto do CV.","O acesso à biblioteca de fotos e à câmara é pedido apenas quando escolhe importar ou capturar uma imagem de CV.","O acesso à área de transferência é usado apenas quando escolhe colar ou copiar texto de CV, descrição de emprego ou contacto de suporte.","Se importares uma descrição de emprego a partir de um URL, a app liga-se a esse site para obter texto legível. O site pode receber informações técnicas normais da requisição, como endereço IP, agente do utilizador, hora da requisição e URL solicitado, de acordo com a sua própria política de privacidade.","A análise de ficheiros, extração de texto de PDF, conversão DOCX e OCR de imagens podem ser incompletas ou imprecisas, especialmente em documentos digitalizados, desfocados, protegidos, invulgares ou mal formatados.","Ao exportar um CV como PDF, a app pode criar um ficheiro temporário e usar as ferramentas de partilha ou impressão do dispositivo que escolher."]},{"type":"h2","text":"4. Processamento por IA"},{"type":"p","text":"Quando você inicia uma análise de currículo, uma correspondência com vaga, uma carta de apresentação, uma preparação para entrevista ou uma sugestão de IA no criador de currículo, o CVPilot pede sua permissão na primeira vez e depois envia o texto correspondente ao seu serviço de IA. Nada é enviado antes da sua autorização e, se você recusar, poderá continuar usando os outros recursos do aplicativo."},{"type":"ul","items":["Dados enviados: o texto do currículo, da descrição da vaga ou do criador de currículo que você envia para esse recurso, as opções escolhidas (como tom, extensão ou nível de experiência), seu tipo de plano (gratuito ou premium) e um identificador de dispositivo aleatório criado pelo aplicativo. Não inclua nesses textos informações que você não deseja que sejam processadas.","Prestadores de serviço: o serviço de IA do CVPilot é executado no Cloudflare Workers (Cloudflare, Inc.) e encaminha cada solicitação à Anthropic, PBC, cujos modelos Claude geram o resultado. A Cloudflare e a Anthropic atuam como prestadoras de serviço (operadoras) para esses recursos.","Seu texto é usado apenas para produzir o resultado solicitado. Pelos termos comerciais da Anthropic, o conteúdo enviado por sua API não é usado para treinar seus modelos de IA. A Anthropic pode manter entradas e saídas por um período limitado por motivos de segurança e conformidade legal, conforme descrito em sua própria política de privacidade.","A CAREO LIMITED não armazena o conteúdo do seu currículo, da descrição da vaga ou do texto do criador em seus servidores. O serviço de IA registra apenas informações técnicas, como horário e tipo de solicitação, códigos de erro e contagens de uso, e mantém um contador diário de solicitações por identificador de dispositivo para evitar abusos.","A Cloudflare pode processar informações técnicas da solicitação, como endereço IP e horário, para operar sua rede, de acordo com sua própria política de privacidade.","Os recursos de IA exigem conexão com a internet e não estão disponíveis offline."]},{"type":"h2","text":"5. Finalidades do tratamento"},{"type":"ul","items":["Fornecer análise de CV, correspondência com empregos, criador de CV, exportação, histórico e definições","Gerar, com IA, análise de currículo, resultados de correspondência, cartas de apresentação, perguntas de entrevista e sugestões de escrita","Guardar preferências e rascunhos","Aplicar limites gratuitos e regras de acesso Premium","Tratar compras ou acesso Premium quando aplicável","Melhorar estabilidade, prevenir abuso e manter a app fiável"]},{"type":"h2","text":"6. Serviços de terceiros e de plataforma"},{"type":"p","text":"A app pode usar serviços de plataforma ou terceiros, incluindo Apple App Store, Google Play, serviços de avaliação dentro da app da Apple ou Google, ferramentas do dispositivo para ficheiros/fotos/câmara/partilha/impressão e renderização de fontes usada para o estilo das exportações PDF. Estes serviços funcionam segundo as suas próprias políticas de privacidade. Os recursos de IA usam a Cloudflare (hospedagem do serviço de IA do CVPilot) e a Anthropic (modelos de IA Claude), conforme descrito na Seção 4."},{"type":"h2","text":"7. Publicidade e rastreio"},{"type":"p","text":"O CVPilot não exibe anúncios de terceiros e não usa SDKs de rastreamento publicitário de terceiros. O texto que você envia para os recursos de IA é usado apenas para fornecer esses recursos e nunca para publicidade."},{"type":"h2","text":"8. Resultados automatizados, precisão e responsabilidade do utilizador"},{"type":"p","text":"O CVPilot fornece análises de currículo, correspondências com vagas, pontuações, sugestões de palavras-chave, cartas de apresentação, perguntas de entrevista e sugestões de escrita automatizadas e geradas por IA apenas para fins informativos. O conteúdo gerado por IA pode conter erros ou afirmações que não são verdadeiras para você, e os resultados podem ser incompletos, imprecisos, desatualizados ou inadequados para um empregador, setor, sistema de rastreamento de candidatos ou processo seletivo específico. Nunca adicione habilidades, experiências ou resultados que você não tem. O CVPilot não garante entrevistas, ofertas de emprego, resultados de contratação, aceitação do currículo, precisão das pontuações ou compatibilidade com todos os sistemas de recrutamento. Você é responsável por revisar todos os resultados antes de usá-los, verificar seu currículo e materiais de candidatura e tomar suas próprias decisões de carreira, candidatura, contratação, jurídicas, financeiras ou profissionais."},{"type":"h2","text":"9. Melhor desempenho e entrada suportada"},{"type":"p","text":"Para melhores resultados, usa CVs e descrições de emprego claros em inglês, com títulos de secção padrão, histórico profissional completo, competências, responsabilidades, requisitos e conquistas mensuráveis. CVPilot pode ser menos preciso com conteúdo que não esteja em inglês, anúncios incompletos, cargos muito especializados ou pouco comuns, formatação invulgar de CV, ficheiros digitalizados ou desfocados, imagens com baixa qualidade de texto ou documentos dos quais o texto não possa ser extraído de forma fiável."},{"type":"h2","text":"10. Compras e funcionalidades Premium"},{"type":"p","text":"Compras, subscrições ou acesso Premium opcionais podem ser processados pela Apple App Store ou Google Play. Não recebemos nem armazenamos os dados completos do cartão de pagamento. O estado da compra, direito de subscrição, renovação, cancelamento, tratamento de reembolsos e dados da conta da loja podem ser geridos pela loja de apps relevante segundo os seus próprios termos e política de privacidade. O estado da compra pode ser armazenado localmente ou verificado através da loja relevante."},{"type":"h2","text":"11. Partilha de dados"},{"type":"p","text":"Não vendemos dados pessoais. O texto que você envia para os recursos de IA é compartilhado com a Cloudflare e a Anthropic apenas para produzir o resultado solicitado, conforme descrito na Seção 4. Outros conteúdos armazenados localmente não são compartilhados com os servidores da CAREO LIMITED. Dados limitados podem ser processados por plataformas ou fornecedores terceiros apenas conforme descrito nesta Política ou quando você opta por usar recursos de compartilhamento, impressão, loja, avaliação ou importação por URL."},{"type":"h2","text":"12. Retenção e eliminação de dados"},{"type":"p","text":"Os dados locais permanecem no seu dispositivo até eliminar entradas guardadas quando disponível, repor dados relevantes da app quando disponível ou desinstalar a app. Ficheiros temporários de exportação podem ser armazenados na cache do dispositivo. Registos de pagamento e registos de avaliação ou compra da plataforma são retidos pela Apple ou Google segundo as suas próprias políticas. O texto enviado para os recursos de IA não é mantido nos servidores da CAREO LIMITED após o retorno do resultado; a Anthropic pode mantê-lo por um período limitado, conforme descrito na Seção 4. O contador diário de solicitações é usado apenas para aplicar limites de uso."},{"type":"h2","text":"13. Direitos do utilizador"},{"type":"p","text":"Dependendo da sua região, pode ter direitos de acesso, correção, eliminação, restrição ou oposição ao tratamento. Como a maioria dos dados é armazenada localmente, normalmente pode geri-los ou removê-los pela app ou definições do dispositivo. Também pode contactar-nos para questões de privacidade. A CAREO LIMITED não mantém cópia do texto enviado aos recursos de IA; por isso, normalmente não há nada do nosso lado para acessar ou excluir. Entre em contato conosco em caso de dúvidas sobre esse processamento."},{"type":"h2","text":"14. Segurança dos dados"},{"type":"p","text":"Usamos HTTPS para comunicações externas quando aplicável e concebemos as nossas apps para minimizar a recolha de dados. Nenhum software ou ambiente de dispositivo pode garantir segurança absoluta. O serviço de IA do CVPilot aceita solicitações apenas do aplicativo via HTTPS e mantém a chave de acesso do provedor de IA no servidor, nunca no aplicativo."},{"type":"h2","text":"15. Privacidade das crianças"},{"type":"p","text":"A app não é dirigida a crianças com menos de 13 anos. Não recolhemos intencionalmente dados pessoais de crianças com menos de 13 anos. Se acreditar que uma criança forneceu dados pessoais, contacte-nos e tomaremos medidas adequadas."},{"type":"h2","text":"16. Transferências internacionais"},{"type":"p","text":"Plataformas e fornecedores terceiros podem processar dados limitados em países diferentes do seu. O texto que você envia para os recursos de IA é processado pela Anthropic nos Estados Unidos e passa pela rede global da Cloudflare. Salvaguardas adequadas se aplicam quando exigidas por lei."},{"type":"h2","text":"17. Contacto"},{"type":"p","html":"<strong>CAREO LIMITED</strong><br>careolimited@gmail.com<br>CVPilot - Privacy Inquiry"},{"type":"h2","text":"18. Atualizações da Política"},{"type":"p","text":"Podemos atualizar esta Política se as funcionalidades da app, serviços de terceiros ou requisitos legais mudarem. As atualizações serão refletidas com uma nova data. A utilização continuada da app após uma atualização significa que aceita a Política atualizada."}],"ru":[{"type":"h1","text":"Политика конфиденциальности - CVPilot"},{"type":"meta","html":"<strong>Последнее обновление:</strong> октябрь 2026 г.<br><strong>Приложение:</strong> CVPilot<br><strong>Разработчик / Издатель:</strong> CAREO LIMITED<br><strong>Контакт:</strong> careolimited@gmail.com"},{"type":"p","text":"CVPilot уважает вашу конфиденциальность. Эта Политика объясняет, какие сведения могут обрабатываться, как они используются и какие права у вас есть при использовании мобильного приложения на iOS и Android."},{"type":"h2","text":"1. Обзор обработки данных"},{"type":"p","text":"Большая часть данных CVPilot хранится на вашем устройстве. Для анализа резюме, подбора вакансий, сопроводительных писем, вопросов для собеседования и предложений по формулировкам текст, который вы отправляете для этих функций, передаётся в ИИ-сервис CVPilot и обрабатывается моделями ИИ Claude компании Anthropic, как описано в разделе 4. Мы не продаём персональные данные и используем сторонние сервисы только тогда, когда они необходимы для описанных ниже функций."},{"type":"h2","text":"2. Локально хранимые данные"},{"type":"p","text":"Приложение может локально хранить на вашем устройстве содержимое резюме, текст описаний вакансий, результаты анализа и сопоставления, историю, лимиты использования, настройки приложения, данные профиля, черновики конструктора CV, счетчики экспорта, состояние запросов отзывов и статус Premium. Эти данные используются для предоставления функций приложения, запоминания настроек, поддержки офлайн-использования при наличии и сохранения согласованного опыта работы. Некоторые локальные записи могут включать текст CV или описания вакансии, который вы ввели, импортировали или сохранили как черновик. Приложение также хранит случайный идентификатор устройства, созданный приложением, ваш выбор относительно обработки ИИ и недавние результаты ИИ, чтобы повторный запуск того же текста возвращал тот же результат без повторной отправки."},{"type":"h2","text":"3. Файлы, фото, камера, буфер обмена и импорт по URL"},{"type":"ul","items":["Если вы импортируете резюме из Файлов, Фото или Камеры, выбранный файл или изображение обрабатывается для извлечения текста резюме.","Доступ к фотобиблиотеке и камере запрашивается только когда вы выбираете импорт или съемку изображения резюме.","Доступ к буферу обмена используется только когда вы выбираете вставить или скопировать текст CV, вакансии или контакта поддержки.","Если вы импортируете описание вакансии по URL, приложение подключается к этому сайту, чтобы получить читаемый текст. Сайт может получать обычную техническую информацию запроса, такую как IP-адрес, user agent, время запроса и запрошенный URL, согласно своей политике конфиденциальности.","Разбор файлов, извлечение текста из PDF, преобразование DOCX и OCR изображений могут быть неполными или неточными, особенно для сканированных, размытых, защищенных, нестандартных или плохо отформатированных документов.","При экспорте CV в PDF приложение может создать временный файл и использовать выбранные вами инструменты общего доступа или печати устройства."]},{"type":"h2","text":"4. Обработка с помощью ИИ"},{"type":"p","text":"Когда вы запускаете анализ резюме, подбор вакансии, сопроводительное письмо, подготовку к собеседованию или ИИ-предложение в конструкторе резюме, CVPilot в первый раз запрашивает ваше разрешение, а затем отправляет соответствующий текст в свой ИИ-сервис. До вашего согласия ничего не отправляется, а при отказе вы можете продолжать пользоваться остальными функциями приложения."},{"type":"ul","items":["Передаваемые данные: текст резюме, описания вакансии или конструктора резюме, который вы отправляете для этой функции, выбранные параметры (например, тон, объём или уровень), тип тарифа (бесплатный или премиум) и случайный идентификатор устройства, созданный приложением. Не включайте в эти тексты сведения, которые вы не хотите передавать на обработку.","Поставщики услуг: ИИ-сервис CVPilot работает на Cloudflare Workers (Cloudflare, Inc.
