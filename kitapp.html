<script>
  const policyData = {"en":[{"type":"h1","text":"Privacy Policy - Booklio"},{"type":"meta","html":"<strong>Last updated:</strong> August 25, 2026<br><strong>App:</strong> Booklio<br><strong>Developer / Publisher:</strong> CAREO LIMITED<br><strong>Contact:</strong> careolimited@gmail.com"},{"type":"p","text":"Booklio respects your privacy. This Policy explains what information may be processed, how it is used, and your rights when you use the mobile application on iOS and Android."},{"type":"h2","text":"1. Data Processing Overview"},{"type":"p","text":"Booklio is designed to keep core app data on your device where possible. We do not sell personal data and we only use third-party services where they are needed for the features described below."},{"type":"h2","text":"2. Locally Stored Data"},{"type":"p","text":"The app may store data related to book discovery, barcode scanning, personal library management, reading progress, notes, quotes, ratings, goals and statistics locally on your device. This data is used to provide app features, remember preferences and support offline usage where available."},{"type":"p","text":"App data is stored in the app’s private storage. Depending on your device settings, the operating system may include this data in an iCloud, Google Drive or device-to-device backup. Those backups are controlled by Apple, Google and your device settings."},{"type":"h2","text":"3. Camera, Photos, OCR and Notifications"},{"type":"p","text":"With your permission, the app can use the camera to scan book barcodes, take a custom cover or capture a page, and can access a photo you select for a cover or quote scan. Text recognition for quote scanning is performed on the device; the selected image and recognized text are not sent to CAREO LIMITED servers."},{"type":"p","text":"If you enable reading reminders, the app schedules local notifications on your device. KitApp does not use a CAREO LIMITED push-notification server."},{"type":"h2","text":"4. Processing Purposes"},{"type":"ul","items":["Provide core app functionality","Remember user preferences","Support offline usage where available","Process purchases or premium access where applicable","Improve stability and prevent abuse"]},{"type":"h2","text":"5. Third-Party Services"},{"type":"p","text":"The app may use the following third-party services or providers: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Korean National Library (SEOJI), German National Library (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store and Google Play. These services operate under their own privacy policies."},{"type":"p","text":"When you scan a barcode or search by ISBN, title, author or DOI, the relevant search term may be sent to book metadata providers to retrieve title, author, publisher, cover image, description and similar book information. Some regional book lookups are routed through our Cloudflare Worker metadata proxy so the app can access provider APIs reliably. Your personal library content, notes, ratings and reading progress are not sent to book metadata providers for this purpose."},{"type":"h2","text":"6. Advertising and Tracking"},{"type":"p","text":"The free version uses Google AdMob to display banner and interstitial ads. The Google Mobile Ads SDK may automatically collect and share IP address (which may be used to estimate general location), app and ad interactions such as app launches, taps and ad views, diagnostic and performance information, and device or account identifiers such as advertising identifiers. Google may use this information for advertising, analytics and fraud prevention."},{"type":"p","text":"Depending on your region, consent choices and device permissions, ads may be personalized or non-personalized/limited. We use Google’s User Messaging Platform (UMP) to request and store applicable advertising privacy choices. If consent information cannot be obtained, a required permission is not granted, or the consent flow fails, the app defaults to requesting non-personalized ads."},{"type":"p","text":"On iOS, the app uses Apple App Tracking Transparency (ATT) before allowing personalized advertising or access to the advertising identifier. You can change this permission in iOS Settings. Where available, free users can review or change Google advertising choices in Settings > Privacy & Legal > Ad Privacy Options. Availability depends on region and legal requirements. Pro removes banner and interstitial ads."},{"type":"p","html":"For more information, see <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Google’s Privacy Policy</a> and your device’s advertising and privacy settings."},{"type":"h2","text":"7. Purchases and Premium Features"},{"type":"p","text":"Optional purchases, subscriptions or premium access may be processed by Apple App Store or Google Play. We do not receive or store credit card details. Purchase status may be stored locally or verified through the relevant store."},{"type":"h2","text":"8. Backup Export and Import"},{"type":"p","text":"Pro users can export or import a backup file containing their library, shelves, books, reading activity, notes, quotes, goals, settings and custom covers. Export happens only when you request it and uses your device’s share sheet or file picker."},{"type":"p","text":"You choose where an exported backup is saved or shared. CAREO LIMITED does not receive the file. A copy stored outside the app is controlled by you and is not deleted when you delete the app."},{"type":"h2","text":"9. Data Sharing"},{"type":"p","text":"We do not sell personal data. Locally stored app content is not shared with CAREO LIMITED servers. Limited data may be processed by third-party providers only as described in this Policy, including book lookup identifiers such as ISBN, title, author or DOI when you use metadata lookup features."},{"type":"h2","text":"10. Legal Bases"},{"type":"ul","items":["We process data needed to provide features at your request and perform the app service.","We rely on consent where required for personalized advertising and device permissions.","We rely on legitimate interests for security, fraud prevention and service reliability where permitted by law."]},{"type":"h2","text":"11. Data Retention and Deletion"},{"type":"p","text":"Local data remains until you delete the relevant content or uninstall the app. Device backups and exported backup files remain according to your device, cloud provider or chosen storage location. Advertising, purchase and diagnostic records are retained by Google, Apple or Google Play under their own policies."},{"type":"h2","text":"12. User Rights"},{"type":"p","text":"Depending on your location, you may have rights to access, correct, delete, restrict, object to or receive a copy of personal data, and to withdraw consent. You can manage local content in the app, remove it by uninstalling the app, change ATT permission in iOS Settings, and use Ad Privacy Options in the app when available. You may contact us for privacy requests and may complain to your local data protection authority, including the UK Information Commissioner’s Office (ICO)."},{"type":"h2","text":"13. Data Security"},{"type":"p","text":"We use HTTPS for external communications where applicable, route some provider API requests through a server-side metadata proxy where needed, and design our apps to minimize data collection. No software or device environment can guarantee absolute security."},{"type":"h2","text":"14. Children’s Privacy"},{"type":"p","text":"The app is not directed to children under 13. We do not knowingly collect personal data from children under 13. If you believe a child has provided personal data, contact us."},{"type":"h2","text":"15. International Data Transfers"},{"type":"p","text":"The providers listed above may process limited data outside your country. They are responsible for using legally required transfer safeguards under their privacy terms. Contact us if you need more information about applicable safeguards."},{"type":"h2","text":"16. Contact"},{"type":"p","html":"<strong>Data controller: CAREO LIMITED (United Kingdom)</strong><br>careolimited@gmail.com<br>Subject: KitApp Privacy Inquiry"},{"type":"h2","text":"17. Policy Updates"},{"type":"p","text":"We may update this Policy when app features, providers or legal requirements change. We will show the new Last updated date. If an update requires new consent, we will request it separately."}],"fr":[{"type":"h1","text":"Politique de confidentialité - Livreo"},{"type":"meta","html":"<strong>Dernière mise à jour:</strong> 25 août 2026<br><strong>App:</strong> Livreo<br><strong>Développeur / Éditeur:</strong> CAREO LIMITED<br><strong>Contact:</strong> careolimited@gmail.com"},{"type":"p","text":"Livreo respecte votre vie privée. Cette Politique explique quelles informations peuvent être traitées, comment elles sont utilisées et quels sont vos droits lorsque vous utilisez l’application mobile sur iOS et Android."},{"type":"h2","text":"1. Aperçu du traitement des données"},{"type":"p","text":"Livreo est conçue pour conserver les données principales sur votre appareil lorsque cela est possible. Nous ne vendons pas de données personnelles et nous utilisons des services tiers uniquement lorsqu'ils sont nécessaires aux fonctions décrites ci-dessous."},{"type":"h2","text":"2. Données stockées localement"},{"type":"p","text":"L’application peut stocker localement sur votre appareil des données liées à la découverte de livres, le scan de codes-barres, la gestion de bibliothèque personnelle, la progression de lecture, les notes, les citations, les évaluations, les objectifs et les statistiques. Ces données servent à fournir les fonctions de l’app, mémoriser vos préférences et permettre l’utilisation hors ligne lorsque disponible."},{"type":"p","text":"Les données de l’app sont conservées dans son espace privé. Selon les réglages de votre appareil, le système peut les inclure dans une sauvegarde iCloud, Google Drive ou un transfert entre appareils. Ces sauvegardes sont gérées par Apple, Google et les réglages de votre appareil."},{"type":"h2","text":"3. Appareil photo, photos, reconnaissance de texte et notifications"},{"type":"p","text":"Avec votre autorisation, l’app peut utiliser l’appareil photo pour scanner un code-barres, prendre une couverture ou photographier une page, et accéder à une photo que vous choisissez. La reconnaissance de texte est effectuée sur l’appareil; l’image et le texte reconnu ne sont pas envoyés aux serveurs de CAREO LIMITED."},{"type":"p","text":"Si vous activez les rappels de lecture, l’app programme des notifications locales sur votre appareil. KitApp n’utilise pas de serveur de notifications push de CAREO LIMITED."},{"type":"h2","text":"4. Finalités du traitement"},{"type":"ul","items":["Fournir les fonctions principales de l’application","Mémoriser les préférences utilisateur","Permettre l’utilisation hors ligne lorsque disponible","Traiter les achats ou l’accès Premium si applicable","Améliorer la stabilité et prévenir les abus"]},{"type":"h2","text":"5. Services tiers"},{"type":"p","text":"L'application peut utiliser les services ou fournisseurs tiers suivants : Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Bibliothèque nationale de Corée (SEOJI), Deutsche Nationalbibliothek (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store et Google Play. Ces services fonctionnent selon leurs propres politiques de confidentialite."},{"type":"p","text":"Lorsque vous scannez un code-barres ou recherchez par ISBN, titre, auteur ou DOI, le terme de recherche pertinent peut etre envoye a des fournisseurs de metadonnees de livres afin de recuperer le titre, l'auteur, l'editeur, l'image de couverture, la description et des informations similaires. Certaines recherches regionales de livres sont acheminees via notre proxy de metadonnees Cloudflare Worker afin que l'application puisse acceder aux API des fournisseurs de facon fiable. Le contenu de votre bibliotheque personnelle, vos notes, evaluations et progression de lecture ne sont pas envoyes a ces fournisseurs a cette fin."},{"type":"h2","text":"6. Publicité et suivi"},{"type":"p","text":"La version gratuite utilise Google AdMob pour afficher des bannières et des annonces interstitielles. Le SDK Google Mobile Ads peut collecter et partager automatiquement l’adresse IP (qui peut servir à estimer une localisation générale), les interactions avec l’app et les annonces telles que les lancements, les appuis et les vues d’annonces, des informations de diagnostic et de performance, ainsi que des identifiants d’appareil ou de compte tels que les identifiants publicitaires. Google peut utiliser ces informations à des fins de publicité, d’analyse et de prévention de la fraude."},{"type":"p","text":"Selon votre région, vos choix de consentement et les autorisations de l’appareil, les annonces peuvent être personnalisées ou non personnalisées/limitées. Nous utilisons la User Messaging Platform (UMP) de Google pour recueillir et enregistrer les choix applicables en matière de confidentialité publicitaire. Si les informations de consentement ne peuvent pas être obtenues, si une autorisation requise n’est pas accordée ou si le processus échoue, l’app demande par défaut des annonces non personnalisées."},{"type":"p","text":"Sur iOS, l’app utilise l’App Tracking Transparency (ATT) d’Apple avant d’autoriser la publicité personnalisée ou l’accès à l’identifiant publicitaire. Vous pouvez modifier cette autorisation dans les réglages iOS. Lorsqu’elle est disponible, l’option Réglages > Confidentialité et mentions légales > Options de confidentialité des annonces permet aux utilisateurs gratuits de consulter ou modifier leurs choix Google. Sa disponibilité dépend de la région et des exigences légales. Pro supprime les bannières et annonces interstitielles."},{"type":"p","html":"Pour plus d’informations, consultez la <a href=\"https://policies.google.com/privacy?hl=fr\" target=\"_blank\" rel=\"noopener noreferrer\">Politique de confidentialité de Google</a> et les réglages publicitaires et de confidentialité de votre appareil."},{"type":"h2","text":"7. Achats et fonctions Premium"},{"type":"p","text":"Les achats, abonnements ou accès Premium optionnels peuvent être traités par Apple App Store ou Google Play. Nous ne recevons ni ne stockons les informations de carte bancaire. L’état d’achat peut être stocké localement ou vérifié via la boutique concernée."},{"type":"h2","text":"8. Exportation et importation des sauvegardes"},{"type":"p","text":"Les utilisateurs Pro peuvent exporter ou importer un fichier contenant leurs bibliothèques, étagères, livres, activités de lecture, notes, citations, objectifs, réglages et couvertures personnalisées. L’exportation a lieu uniquement à votre demande via la feuille de partage ou le sélecteur de fichiers."},{"type":"p","text":"Vous choisissez où enregistrer ou partager la sauvegarde. CAREO LIMITED ne reçoit pas ce fichier. Les copies conservées hors de l’app restent sous votre contrôle et ne sont pas supprimées avec l’app."},{"type":"h2","text":"9. Partage des données"},{"type":"p","text":"Nous ne vendons pas de donnees personnelles. Le contenu stocke localement n'est pas partage avec les serveurs de CAREO LIMITED. Des donnees limitees peuvent etre traitees par des fournisseurs tiers uniquement comme decrit dans cette Politique, y compris les identifiants de recherche de livre tels que l'ISBN, le titre, l'auteur ou le DOI lorsque vous utilisez les fonctions de recherche de metadonnees."},{"type":"h2","text":"10. Bases juridiques"},{"type":"ul","items":["Nous traitons les données nécessaires pour fournir les fonctions demandées et le service de l’app.","Nous nous fondons sur votre consentement lorsque celui-ci est requis pour la publicité personnalisée et les autorisations de l’appareil.","Lorsque la loi le permet, nous nous fondons sur nos intérêts légitimes pour la sécurité, la prévention de la fraude et la fiabilité du service."]},{"type":"h2","text":"11. Conservation et suppression"},{"type":"p","text":"Les données locales restent jusqu’à la suppression du contenu concerné ou de l’app. Les sauvegardes de l’appareil et les fichiers exportés restent soumis aux règles de votre appareil, fournisseur cloud ou emplacement choisi. Google, Apple ou Google Play conservent les données publicitaires, d’achat et de diagnostic selon leurs politiques."},{"type":"h2","text":"12. Droits des utilisateurs"},{"type":"p","text":"Selon votre pays, vous pouvez demander l’accès, la rectification, l’effacement, la limitation, l’opposition, une copie de vos données ou retirer votre consentement. Vous pouvez gérer le contenu dans l’app, supprimer les données locales en désinstallant l’app, modifier ATT dans les réglages iOS et, si disponible, vos choix publicitaires dans l’app. Vous pouvez nous contacter et saisir votre autorité de protection des données, notamment l’ICO au Royaume-Uni."},{"type":"h2","text":"13. Sécurité des données"},{"type":"p","text":"Nous utilisons HTTPS pour les communications externes lorsque cela s'applique, acheminons certaines requêtes API de fournisseurs via un proxy de métadonnées côté serveur lorsque nécessaire et concevons nos apps pour réduire la collecte de données. Aucun logiciel ni appareil ne peut garantir une sécurité absolue."},{"type":"h2","text":"14. Confidentialité des enfants"},{"type":"p","text":"L’application ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment de données personnelles d’enfants de moins de 13 ans. Si vous pensez qu’un enfant a fourni des données personnelles, contactez-nous."},{"type":"h2","text":"15. Transferts internationaux"},{"type":"p","text":"Les fournisseurs ci-dessus peuvent traiter des données limitées hors de votre pays et doivent appliquer les garanties de transfert exigées par la loi selon leurs conditions. Contactez-nous pour en savoir plus."},{"type":"h2","text":"16. Contact"},{"type":"p","html":"<strong>Responsable du traitement : CAREO LIMITED (Royaume-Uni)</strong><br>careolimited@gmail.com<br>Objet : Demande de confidentialité KitApp"},{"type":"h2","text":"17. Mises à jour de la Politique"},{"type":"p","text":"Nous pouvons mettre à jour cette Politique si les fonctions, fournisseurs ou obligations légales changent. La nouvelle date sera affichée. Si un nouveau consentement est nécessaire, nous le demanderons séparément."}],"de":[{"type":"h1","text":"Datenschutzerklärung - Buchio"},{"type":"meta","html":"<strong>Letzte Aktualisierung:</strong> 25. August 2026<br><strong>App:</strong> Buchio<br><strong>Entwickler / Herausgeber:</strong> CAREO LIMITED<br><strong>Kontakt:</strong> careolimited@gmail.com"},{"type":"p","text":"Buchio respektiert Ihre Privatsphäre. Diese Richtlinie erklärt, welche Informationen verarbeitet werden können, wie sie verwendet werden und welche Rechte Sie bei der Nutzung der mobilen App auf iOS und Android haben."},{"type":"h2","text":"1. Überblick zur Datenverarbeitung"},{"type":"p","text":"Buchio ist so gestaltet, dass Kerndaten nach Möglichkeit auf Ihrem Gerät bleiben. Wir verkaufen keine personenbezogenen Daten und verwenden Drittanbieter nur, wenn sie für die unten beschriebenen Funktionen erforderlich sind."},{"type":"h2","text":"2. Lokal gespeicherte Daten"},{"type":"p","text":"Die App kann Daten zu Buchsuche, Barcode-Scanning, persönliche Bibliotheksverwaltung, Lesefortschritt, Notizen, Zitate, Bewertungen, Ziele und Statistiken lokal auf Ihrem Gerät speichern. Diese Daten werden genutzt, um App-Funktionen bereitzustellen, Einstellungen zu merken und Offline-Nutzung zu unterstützen, sofern verfügbar."},{"type":"p","text":"App-Daten werden im privaten Speicher der App abgelegt. Abhängig von deinen Geräteeinstellungen kann das Betriebssystem sie in ein iCloud-, Google-Drive- oder Geräteübertragungs-Backup aufnehmen. Diese Backups werden von Apple, Google und deinen Geräteeinstellungen verwaltet."},{"type":"h2","text":"3. Kamera, Fotos, Texterkennung und Mitteilungen"},{"type":"p","text":"Mit deiner Erlaubnis kann die App die Kamera zum Scannen von Barcodes, Aufnehmen eines Covers oder Fotografieren einer Seite und ein von dir ausgewähltes Foto verwenden. Die Texterkennung erfolgt auf dem Gerät; Bild und erkannter Text werden nicht an Server von CAREO LIMITED gesendet."},{"type":"p","text":"Wenn du Leseerinnerungen aktivierst, plant die App lokale Mitteilungen auf deinem Gerät. KitApp verwendet keinen Push-Server von CAREO LIMITED."},{"type":"h2","text":"4. Zwecke der Verarbeitung"},{"type":"ul","items":["Bereitstellung der Kernfunktionen","Speichern von Nutzereinstellungen","Unterstützung der Offline-Nutzung, sofern verfügbar","Verarbeitung von Käufen oder Premium-Zugriff, sofern zutreffend","Verbesserung der Stabilität und Verhinderung von Missbrauch"]},{"type":"h2","text":"5. Drittanbieter-Dienste"},{"type":"p","text":"Die App kann folgende Drittanbieter-Dienste oder Anbieter verwenden: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Koreanische Nationalbibliothek (SEOJI), Deutsche Nationalbibliothek (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store und Google Play. Diese Dienste unterliegen ihren eigenen Datenschutzrichtlinien."},{"type":"p","text":"Wenn Sie einen Barcode scannen oder nach ISBN, Titel, Autor oder DOI suchen, kann der jeweilige Suchbegriff an Buchmetadaten-Anbieter gesendet werden, um Titel, Autor, Verlag, Coverbild, Beschreibung und ahnliche Buchinformationen abzurufen. Einige regionale Buchsuchen werden uber unseren Cloudflare-Worker-Metadaten-Proxy geleitet, damit die App zuverlassig auf Anbieter-APIs zugreifen kann. Ihre personlichen Bibliotheksinhalte, Notizen, Bewertungen und Lesefortschritte werden zu diesem Zweck nicht an Buchmetadaten-Anbieter gesendet."},{"type":"h2","text":"6. Werbung und Tracking"},{"type":"p","text":"Die kostenlose Version verwendet Google AdMob für Banner- und Interstitial-Werbung. Das Google Mobile Ads SDK kann automatisch die IP-Adresse (zur Schätzung des ungefähren Standorts), Interaktionen mit App und Werbung wie App-Starts, Tippen und Anzeigenaufrufe, Diagnose- und Leistungsinformationen sowie Geräte- oder Kontokennungen wie Werbe-IDs erfassen und weitergeben. Google kann diese Informationen für Werbung, Analysen und Betrugsprävention verwenden."},{"type":"p","text":"Abhängig von Ihrer Region, Ihren Einwilligungsentscheidungen und Geräteberechtigungen können personalisierte oder nicht personalisierte/eingeschränkte Anzeigen erscheinen. Wir verwenden Googles User Messaging Platform (UMP), um geltende Datenschutzentscheidungen für Werbung abzufragen und zu speichern. Können Einwilligungsinformationen nicht abgerufen werden, fehlt eine erforderliche Berechtigung oder schlägt der Vorgang fehl, fordert die App standardmäßig nicht personalisierte Anzeigen an."},{"type":"p","text":"Unter iOS verwendet die App Apples App Tracking Transparency (ATT), bevor personalisierte Werbung oder der Zugriff auf die Werbe-ID zugelassen wird. Sie können diese Berechtigung in den iOS-Einstellungen ändern. Soweit verfügbar, können Nutzer der kostenlosen Version ihre Google-Werbeentscheidungen unter Einstellungen > Datenschutz & Rechtliches > Datenschutzoptionen für Werbung prüfen oder ändern. Die Verfügbarkeit hängt von Region und gesetzlichen Anforderungen ab. Pro entfernt Banner- und Interstitial-Werbung."},{"type":"p","html":"Weitere Informationen finden Sie in der <a href=\"https://policies.google.com/privacy?hl=de\" target=\"_blank\" rel=\"noopener noreferrer\">Datenschutzerklärung von Google</a> sowie in den Werbe- und Datenschutzeinstellungen Ihres Geräts."},{"type":"h2","text":"7. Käufe und Premium-Funktionen"},{"type":"p","text":"Optionale Käufe, Abonnements oder Premium-Zugriffe können über Apple App Store oder Google Play verarbeitet werden. Wir erhalten oder speichern keine Kreditkartendaten. Der Kaufstatus kann lokal gespeichert oder über den jeweiligen Store geprüft werden."},{"type":"h2","text":"8. Backup-Export und -Import"},{"type":"p","text":"Pro-Nutzer können eine Backup-Datei mit Bibliotheken, Regalen, Büchern, Leseaktivität, Notizen, Zitaten, Zielen, Einstellungen und eigenen Covern exportieren oder importieren. Der Export erfolgt nur auf deinen Wunsch über die Teilen-Funktion oder Dateiauswahl."},{"type":"p","text":"Du bestimmst, wo ein Backup gespeichert oder geteilt wird. CAREO LIMITED erhält die Datei nicht. Kopien außerhalb der App bleiben unter deiner Kontrolle und werden beim Löschen der App nicht entfernt."},{"type":"h2","text":"9. Datenweitergabe"},{"type":"p","text":"Wir verkaufen keine personenbezogenen Daten. Lokal gespeicherte App-Inhalte werden nicht mit CAREO LIMITED-Servern geteilt. Begrenzte Daten konnen nur wie in dieser Richtlinie beschrieben durch Drittanbieter verarbeitet werden, einschliesslich Buchsuchkennungen wie ISBN, Titel, Autor oder DOI, wenn Sie Metadaten-Suchfunktionen verwenden."},{"type":"h2","text":"10. Rechtsgrundlagen"},{"type":"ul","items":["Wir verarbeiten erforderliche Daten, um angeforderte Funktionen und den App-Dienst bereitzustellen.","Soweit erforderlich, stützen wir personalisierte Werbung und Geräteberechtigungen auf deine Einwilligung.","Soweit gesetzlich zulässig, stützen wir Sicherheit, Betrugsprävention und Zuverlässigkeit auf berechtigte Interessen."]},{"type":"h2","text":"11. Aufbewahrung und Löschung"},{"type":"p","text":"Lokale Daten bleiben bis zum Löschen des Inhalts oder der App gespeichert. Geräte- und exportierte Backups unterliegen den Regeln deines Geräts, Cloud-Anbieters oder Speicherorts. Werbe-, Kauf- und Diagnosedaten werden von Google, Apple oder Google Play nach deren Richtlinien gespeichert."},{"type":"h2","text":"12. Nutzerrechte"},{"type":"p","text":"Je nach Standort kannst du Auskunft, Berichtigung, Löschung, Einschränkung, Widerspruch, eine Datenkopie oder den Widerruf deiner Einwilligung verlangen. Inhalte lassen sich in der App verwalten; lokale Daten durch Deinstallation entfernen, ATT in iOS und verfügbare Werbeoptionen in der App ändern. Du kannst uns kontaktieren und dich bei deiner Datenschutzbehörde, einschließlich der britischen ICO, beschweren."},{"type":"h2","text":"13. Datensicherheit"},{"type":"p","text":"Wir verwenden HTTPS für externe Kommunikation, sofern zutreffend, leiten einige Anbieter-API-Anfragen bei Bedarf über einen serverseitigen Metadaten-Proxy und gestalten unsere Apps so, dass die Datenerhebung minimiert wird. Keine Software- oder Geräteumgebung kann absolute Sicherheit garantieren."},{"type":"h2","text":"14. Datenschutz von Kindern"},{"type":"p","text":"Die App richtet sich nicht an Kinder unter 13 Jahren. Wir sammeln wissentlich keine personenbezogenen Daten von Kindern unter 13 Jahren. Wenn Sie glauben, dass ein Kind personenbezogene Daten bereitgestellt hat, kontaktieren Sie uns."},{"type":"h2","text":"15. Internationale Datenübertragungen"},{"type":"p","text":"Die genannten Anbieter können begrenzte Daten außerhalb deines Landes verarbeiten und müssen die gesetzlich erforderlichen Übertragungsgarantien nach ihren Bedingungen anwenden. Weitere Informationen erhältst du von uns."},{"type":"h2","text":"16. Kontakt"},{"type":"p","html":"<strong>Verantwortlicher: CAREO LIMITED (Vereinigtes Königreich)</strong><br>careolimited@gmail.com<br>Betreff: KitApp-Datenschutzanfrage"},{"type":"h2","text":"17. Aktualisierungen"},{"type":"p","text":"Wir können diese Erklärung bei Änderungen an Funktionen, Anbietern oder Rechtsvorschriften aktualisieren. Das neue Datum wird angezeigt. Ist eine neue Einwilligung erforderlich, fragen wir sie gesondert ab."}],"it":[{"type":"h1","text":"Informativa sulla privacy - Librio"},{"type":"meta","html":"<strong>Ultimo aggiornamento:</strong> 25 agosto 2026<br><strong>App:</strong> Librio<br><strong>Sviluppatore / Editore:</strong> CAREO LIMITED<br><strong>Contatto:</strong> careolimited@gmail.com"},{"type":"p","text":"Librio rispetta la tua privacy. Questa Informativa spiega quali informazioni possono essere trattate, come vengono utilizzate e quali diritti hai quando usi l’app mobile su iOS e Android."},{"type":"h2","text":"1. Panoramica del trattamento dei dati"},{"type":"p","text":"Librio è progettata per mantenere i dati principali sul dispositivo quando possibile. Non vendiamo dati personali e usiamo servizi di terze parti solo quando necessari per le funzioni descritte di seguito."},{"type":"h2","text":"2. Dati archiviati localmente"},{"type":"p","text":"L’app può archiviare localmente sul dispositivo dati relativi a scoperta di libri, scansione dei codici a barre, gestione della biblioteca personale, avanzamento di lettura, note, citazioni, valutazioni, obiettivi e statistiche. Questi dati servono a fornire le funzioni dell’app, ricordare le preferenze e supportare l’uso offline dove disponibile."},{"type":"p","text":"I dati dell’app sono conservati nello spazio privato dell’app. In base alle impostazioni del dispositivo, il sistema può includerli in un backup iCloud, Google Drive o nel trasferimento tra dispositivi. Questi backup sono gestiti da Apple, Google e dalle impostazioni del dispositivo."},{"type":"h2","text":"3. Fotocamera, foto, riconoscimento del testo e notifiche"},{"type":"p","text":"Con la tua autorizzazione, l’app può usare la fotocamera per scansionare codici a barre, acquisire una copertina o fotografare una pagina e può accedere a una foto scelta da te. Il riconoscimento del testo avviene sul dispositivo; immagine e testo riconosciuto non sono inviati ai server di CAREO LIMITED."},{"type":"p","text":"Se attivi i promemoria di lettura, l’app programma notifiche locali sul dispositivo. KitApp non utilizza un server push di CAREO LIMITED."},{"type":"h2","text":"4. Finalità del trattamento"},{"type":"ul","items":["Fornire le funzioni principali dell’app","Ricordare le preferenze dell’utente","Supportare l’uso offline dove disponibile","Gestire acquisti o accesso Premium se applicabile","Migliorare stabilità e prevenire abusi"]},{"type":"h2","text":"5. Servizi di terze parti"},{"type":"p","text":"L'app può usare i seguenti servizi o fornitori di terze parti: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Biblioteca nazionale coreana (SEOJI), Deutsche Nationalbibliothek (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store e Google Play. Questi servizi operano secondo le proprie informative sulla privacy."},{"type":"p","text":"Quando scansioni un codice a barre o cerchi per ISBN, titolo, autore o DOI, il relativo termine di ricerca può essere inviato ai fornitori di metadati dei libri per recuperare titolo, autore, editore, immagine di copertina, descrizione e informazioni simili. Alcune ricerche regionali di libri vengono instradate tramite il nostro proxy di metadati Cloudflare Worker, così l'app può accedere in modo affidabile alle API dei fornitori. Il contenuto della tua biblioteca personale, note, valutazioni e progresso di lettura non vengono inviati ai fornitori di metadati per questo scopo."},{"type":"h2","text":"6. Pubblicità e tracciamento"},{"type":"p","text":"La versione gratuita utilizza Google AdMob per mostrare banner e annunci interstitial. Google Mobile Ads SDK può raccogliere e condividere automaticamente l’indirizzo IP (utilizzabile per stimare la posizione generale), le interazioni con l’app e gli annunci come avvii, tocchi e visualizzazioni, informazioni diagnostiche e sulle prestazioni, nonché identificatori del dispositivo o dell’account come gli identificatori pubblicitari. Google può utilizzare queste informazioni per pubblicità, analisi e prevenzione delle frodi."},{"type":"p","text":"In base all’area geografica, alle scelte di consenso e alle autorizzazioni del dispositivo, gli annunci possono essere personalizzati oppure non personalizzati/limitati. Utilizziamo la User Messaging Platform (UMP) di Google per richiedere e memorizzare le scelte applicabili sulla privacy pubblicitaria. Se non è possibile ottenere le informazioni sul consenso, manca un’autorizzazione necessaria o la procedura non riesce, l’app richiede per impostazione predefinita annunci non personalizzati."},{"type":"p","text":"Su iOS, l’app utilizza App Tracking Transparency (ATT) di Apple prima di consentire pubblicità personalizzata o accesso all’identificatore pubblicitario. Puoi modificare questa autorizzazione nelle Impostazioni di iOS. Ove disponibile, gli utenti gratuiti possono rivedere o modificare le scelte pubblicitarie di Google in Impostazioni > Privacy e note legali > Opzioni privacy degli annunci. La disponibilità dipende dall’area geografica e dai requisiti di legge. Pro rimuove banner e annunci interstitial."},{"type":"p","html":"Per ulteriori informazioni, consulta le <a href=\"https://policies.google.com/privacy?hl=it\" target=\"_blank\" rel=\"noopener noreferrer\">Norme sulla privacy di Google</a> e le impostazioni pubblicitarie e sulla privacy del dispositivo."},{"type":"h2","text":"7. Acquisti e funzioni Premium"},{"type":"p","text":"Acquisti, abbonamenti o accessi Premium facoltativi possono essere elaborati da Apple App Store o Google Play. Non riceviamo né memorizziamo dati della carta di credito. Lo stato di acquisto può essere salvato localmente o verificato tramite lo store pertinente."},{"type":"h2","text":"8. Esportazione e importazione dei backup"},{"type":"p","text":"Gli utenti Pro possono esportare o importare un file con biblioteche, scaffali, libri, attività di lettura, note, citazioni, obiettivi, impostazioni e copertine personalizzate. L’esportazione avviene solo su tua richiesta tramite il pannello di condivisione o il selettore file."},{"type":"p","text":"Scegli tu dove salvare o condividere il backup. CAREO LIMITED non riceve il file. Le copie fuori dall’app restano sotto il tuo controllo e non vengono eliminate cancellando l’app."},{"type":"h2","text":"9. Condivisione dei dati"},{"type":"p","text":"Non vendiamo dati personali. I contenuti dell'app archiviati localmente non vengono condivisi con server CAREO LIMITED. Dati limitati possono essere trattati da fornitori terzi solo come descritto in questa Informativa, inclusi identificativi di ricerca dei libri come ISBN, titolo, autore o DOI quando usi le funzioni di ricerca metadati."},{"type":"h2","text":"10. Basi giuridiche"},{"type":"ul","items":["Trattiamo i dati necessari per fornire le funzioni richieste e il servizio dell’app.","Ci basiamo sul consenso quando richiesto per pubblicità personalizzata e autorizzazioni del dispositivo.","Dove consentito, ci basiamo sul legittimo interesse per sicurezza, prevenzione delle frodi e affidabilità."]},{"type":"h2","text":"11. Conservazione e cancellazione"},{"type":"p","text":"I dati locali restano fino alla cancellazione del contenuto o dell’app. I backup del dispositivo e i file esportati seguono le regole del dispositivo, del provider cloud o del luogo scelto. Google, Apple o Google Play conservano dati pubblicitari, di acquisto e diagnostici secondo le proprie politiche."},{"type":"h2","text":"12. Diritti degli utenti"},{"type":"p","text":"In base al luogo puoi chiedere accesso, rettifica, cancellazione, limitazione, opposizione, una copia dei dati o revocare il consenso. Puoi gestire i contenuti nell’app, eliminare i dati locali disinstallandola, modificare ATT nelle impostazioni iOS e le opzioni pubblicitarie disponibili nell’app. Puoi contattarci e presentare reclamo all’autorità competente, inclusa l’ICO britannica."},{"type":"h2","text":"13. Sicurezza dei dati"},{"type":"p","text":"Usiamo HTTPS per le comunicazioni esterne quando applicabile, instradiamo alcune richieste API dei fornitori tramite un proxy di metadati lato server quando necessario e progettiamo le nostre app per minimizzare la raccolta di dati. Nessun software o dispositivo può garantire sicurezza assoluta."},{"type":"h2","text":"14. Privacy dei minori"},{"type":"p","text":"L’app non è rivolta a minori di 13 anni. Non raccogliamo consapevolmente dati personali da minori di 13 anni. Se ritieni che un minore abbia fornito dati personali, contattaci."},{"type":"h2","text":"15. Trasferimenti internazionali"},{"type":"p","text":"I fornitori indicati possono trattare dati limitati fuori dal tuo paese e devono adottare le garanzie di trasferimento richieste dalla legge secondo i propri termini. Contattaci per maggiori informazioni."},{"type":"h2","text":"16. Contatto"},{"type":"p","html":"<strong>Titolare del trattamento: CAREO LIMITED (Regno Unito)</strong><br>careolimited@gmail.com<br>Oggetto: Richiesta privacy KitApp"},{"type":"h2","text":"17. Aggiornamenti"},{"type":"p","text":"Possiamo aggiornare questa Informativa se cambiano funzioni, fornitori o norme. Mostreremo la nuova data. Se serve un nuovo consenso, lo richiederemo separatamente."}],"ja":[{"type":"h1","text":"プライバシーポリシー - ヨムノート"},{"type":"meta","html":"<strong>最終更新:</strong> 2026年8月25日<br><strong>アプリ:</strong> ヨムノート<br><strong>開発者 / 発行者:</strong> CAREO LIMITED<br><strong>連絡先:</strong> careolimited@gmail.com"},{"type":"p","text":"ヨムノートはプライバシーを尊重します。本ポリシーは、iOSおよびAndroidのモバイルアプリを利用する際に処理される可能性のある情報、その利用方法、ユーザーの権利について説明します。"},{"type":"h2","text":"1. データ処理の概要"},{"type":"p","text":"ブックログは、可能な限り主要なアプリデータをお使いの端末内に保持するよう設計されています。当社は個人データを販売せず、以下に記載する機能に必要な場合にのみ第三者サービスを使用します。"},{"type":"h2","text":"2. ローカル保存データ"},{"type":"p","text":"アプリは本の検索、バーコードスキャン、個人ライブラリ管理、読書進捗、メモ、引用、評価、目標、統計に関連するデータを端末内に保存する場合があります。これらのデータは、機能提供、設定の保存、利用可能な場合のオフライン利用のために使用されます。"},{"type":"p","text":"アプリデータはアプリ専用領域に保存されます。端末設定により、iCloud、Google Drive、または端末間移行のバックアップに含まれる場合があります。これらはApple、Googleおよび端末設定によって管理されます。"},{"type":"h2","text":"3. カメラ、写真、文字認識、通知"},{"type":"p","text":"許可した場合、バーコードの読み取り、表紙やページの撮影、選択した写真の利用にカメラや写真へのアクセスを使用します。引用の文字認識は端末上で行われ、画像や認識結果がCAREO LIMITEDのサーバーに送信されることはありません。"},{"type":"p","text":"読書リマインダーを有効にすると、端末内でローカル通知を予約します。KitAppはCAREO LIMITEDのプッシュ通知サーバーを使用しません。"},{"type":"h2","text":"4. 処理目的"},{"type":"ul","items":["アプリの主要機能を提供するため","ユーザー設定を保存するため","利用可能な場合にオフライン利用を支援するため","該当する場合に購入またはPremiumアクセスを処理するため","安定性を向上し、不正利用を防止するため"]},{"type":"h2","text":"5. 第三者サービス"},{"type":"p","text":"本アプリは、Google Books API、Open Library API、OpenAlex、Crossref、openBD、NDL Search、Rakuten Books API、Naver Search API、Kakao Book Search API、ドイツ国立図書館 (DNB) SRU、フランス国立図書館 (BnF) SRU、Cloudflare Workers、Google AdMob、Apple App Store、Google Play などの第三者サービスまたは提供者を使用する場合があります。これらのサービスは、それぞれ独自のプライバシーポリシーに従って運用されます。"},{"type":"p","text":"バーコードをスキャンする場合、またはISBN、タイトル、著者、DOIで検索する場合、該当する検索語が書籍メタデータ提供者に送信され、タイトル、著者、出版社、表紙画像、説明などの書籍情報を取得することがあります。一部の地域別書籍検索は、提供者APIへ安定してアクセスするため、当社のCloudflare Workerメタデータプロキシ経由で処理されます。個人のライブラリ内容、メモ、評価、読書進捗は、この目的で書籍メタデータ提供者に送信されません。"},{"type":"h2","text":"6. 広告とトラッキング"},{"type":"p","text":"無料版では、バナー広告およびインタースティシャル広告の表示に Google AdMob を使用します。Google Mobile Ads SDK は、IP アドレス（おおよその位置情報の推定に使用される場合があります）、アプリの起動、タップ、広告表示などのアプリおよび広告上の操作、診断・パフォーマンス情報、広告 ID などの端末またはアカウント識別子を自動的に収集し、共有する場合があります。Google はこれらの情報を広告、分析、不正防止のために使用する場合があります。"},{"type":"p","text":"地域、同意内容、端末の権限に応じて、パーソナライズ広告または非パーソナライズ広告・制限付き広告が表示される場合があります。適用される広告プライバシーの選択肢を取得・保存するため、Google User Messaging Platform（UMP）を使用します。同意情報を取得できない場合、必要な権限が許可されていない場合、または同意処理に失敗した場合、アプリは既定で非パーソナライズ広告をリクエストします。"},{"type":"p","text":"iOS では、パーソナライズ広告または広告 ID へのアクセスを許可する前に、Apple の App Tracking Transparency（ATT）を使用します。この権限は iOS の「設定」で変更できます。利用可能な地域では、無料ユーザーは「設定 > プライバシーと法的情報 > 広告プライバシー設定」から Google の広告に関する選択を確認・変更できます。利用可否は地域および法的要件によって異なります。Pro ではバナー広告とインタースティシャル広告が削除されます。"},{"type":"p","html":"詳しくは、<a href=\"https://policies.google.com/privacy?hl=ja\" target=\"_blank\" rel=\"noopener noreferrer\">Google プライバシー ポリシー</a>および端末の広告・プライバシー設定をご確認ください。"},{"type":"h2","text":"7. 購入とPremium機能"},{"type":"p","text":"任意の購入、サブスクリプション、PremiumアクセスはApple App StoreまたはGoogle Playによって処理される場合があります。当社はクレジットカード情報を受け取ったり保存したりしません。購入状態はローカルに保存されるか、該当ストアで確認される場合があります。"},{"type":"h2","text":"8. バックアップの書き出しと読み込み"},{"type":"p","text":"Proユーザーは、ライブラリ、本棚、本、読書履歴、メモ、引用、目標、設定、カスタム表紙を含むバックアップファイルを書き出しまたは読み込めます。書き出しは、ユーザーが共有画面またはファイル選択を操作した場合にのみ行われます。"},{"type":"p","text":"保存先や共有先はユーザーが選択します。CAREO LIMITEDがファイルを受け取ることはありません。アプリ外のコピーはユーザーの管理下にあり、アプリを削除しても消去されません。"},{"type":"h2","text":"9. データ共有"},{"type":"p","text":"当社は個人データを販売しません。端末内に保存されたアプリの内容はCAREO LIMITEDのサーバーと共有されません。本ポリシーに記載された範囲でのみ、第三者提供者が限定的なデータを処理する場合があります。これには、メタデータ検索機能を使用する際のISBN、タイトル、著者、DOIなどの書籍検索識別子が含まれます。"},{"type":"h2","text":"10. 法的根拠"},{"type":"ul","items":["依頼された機能とアプリサービスの提供に必要なデータを処理します。","必要な場合、パーソナライズ広告と端末権限について同意に基づきます。","法令で認められる範囲で、セキュリティ、不正防止、サービスの信頼性について正当な利益に基づきます。"]},{"type":"h2","text":"11. 保持と削除"},{"type":"p","text":"ローカルデータは、対象内容またはアプリを削除するまで保持されます。端末バックアップと書き出したファイルは、端末、クラウド事業者、保存先の規則に従います。広告、購入、診断記録はGoogle、AppleまたはGoogle Playが各方針に従って保持します。"},{"type":"h2","text":"12. ユーザーの権利"},{"type":"p","text":"地域により、アクセス、訂正、削除、制限、異議申立て、データの写し、同意撤回の権利があります。アプリ内で内容を管理し、アンインストールでローカルデータを削除し、iOS設定でATT、利用可能な場合はアプリ内で広告設定を変更できます。当社への連絡および管轄当局（英国ICOを含む）への申立ても可能です。"},{"type":"h2","text":"13. データセキュリティ"},{"type":"p","text":"当社は、該当する外部通信にHTTPSを使用し、必要に応じて一部の提供者APIリクエストをサーバー側のメタデータプロキシ経由で処理し、データ収集を最小限に抑えるようアプリを設計しています。ただし、いかなるソフトウェアまたは端末環境も絶対的な安全性を保証することはできません。"},{"type":"h2","text":"14. 子どものプライバシー"},{"type":"p","text":"本アプリは13歳未満の子どもを対象としていません。13歳未満の子どもから意図的に個人データを収集することはありません。子どもが個人データを提供したと思われる場合はお問い合わせください。"},{"type":"h2","text":"15. 国際データ移転"},{"type":"p","text":"上記の事業者は国外で限定的なデータを処理する場合があり、各条件に基づき法令上必要な移転保護措置を講じる責任があります。詳細は当社にお問い合わせください。"},{"type":"h2","text":"16. お問い合わせ"},{"type":"p","html":"<strong>データ管理者：CAREO LIMITED（英国）</strong><br>careolimited@gmail.com<br>件名：KitApp Privacy Inquiry"},{"type":"h2","text":"17. ポリシー更新"},{"type":"p","text":"機能、事業者、法令の変更に応じて本ポリシーを更新する場合があります。新しい更新日を表示し、新たな同意が必要な場合は別途求めます。"}],"ko":[{"type":"h1","text":"개인정보 처리방침 - 북로그"},{"type":"meta","html":"<strong>마지막 업데이트:</strong> 2026년 8월 25일<br><strong>앱:</strong> 북로그<br><strong>개발자 / 게시자:</strong> CAREO LIMITED<br><strong>문의:</strong> careolimited@gmail.com"},{"type":"p","text":"북로그은 개인정보를 존중합니다. 본 정책은 iOS 및 Android 모바일 앱을 사용할 때 어떤 정보가 처리될 수 있는지, 어떻게 사용되는지, 사용자의 권리가 무엇인지 설명합니다."},{"type":"h2","text":"1. 데이터 처리 개요"},{"type":"p","text":"북로그는 가능한 경우 핵심 앱 데이터를 기기에 보관하도록 설계되었습니다. 당사는 개인정보를 판매하지 않으며, 아래에 설명된 기능에 필요한 경우에만 제3자 서비스를 사용합니다."},{"type":"h2","text":"2. 로컬 저장 데이터"},{"type":"p","text":"앱은 도서 검색, 바코드 스캔, 개인 서재 관리, 독서 진행률, 메모, 인용문, 평가, 목표 및 통계와 관련된 데이터를 기기에 로컬로 저장할 수 있습니다. 이 데이터는 앱 기능 제공, 설정 기억, 가능한 경우 오프라인 사용 지원에 사용됩니다."},{"type":"p","text":"앱 데이터는 앱의 비공개 저장 공간에 보관됩니다. 기기 설정에 따라 운영체제가 이 데이터를 iCloud, Google Drive 또는 기기 간 이전 백업에 포함할 수 있습니다. 이러한 백업은 Apple, Google 및 기기 설정에서 관리됩니다."},{"type":"h2","text":"3. 카메라, 사진, 문자 인식 및 알림"},{"type":"p","text":"허용한 경우 앱은 바코드 스캔, 표지 또는 페이지 촬영과 사용자가 선택한 사진 이용을 위해 카메라와 사진에 접근할 수 있습니다. 인용문 문자 인식은 기기에서 처리되며 이미지와 인식된 텍스트는 CAREO LIMITED 서버로 전송되지 않습니다."},{"type":"p","text":"독서 알림을 켜면 앱이 기기에 로컬 알림을 예약합니다. KitApp은 CAREO LIMITED의 푸시 알림 서버를 사용하지 않습니다."},{"type":"h2","text":"4. 처리 목적"},{"type":"ul","items":["핵심 앱 기능 제공","사용자 설정 기억","가능한 경우 오프라인 사용 지원","해당되는 경우 구매 또는 Premium 접근 처리","안정성 개선 및 남용 방지"]},{"type":"h2","text":"5. 제3자 서비스"},{"type":"p","text":"앱은 Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, 대한민국 국립중앙도서관(SEOJI), 독일 국립도서관(DNB) SRU, 프랑스 국립도서관(BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store 및 Google Play와 같은 제3자 서비스 또는 제공업체를 사용할 수 있습니다. 이러한 서비스는 각자의 개인정보 처리방침에 따라 운영됩니다."},{"type":"p","text":"바코드를 스캔하거나 ISBN, 제목, 저자 또는 DOI로 검색할 때 관련 검색어가 도서 메타데이터 제공업체로 전송되어 제목, 저자, 출판사, 표지 이미지, 설명 및 유사한 도서 정보를 가져올 수 있습니다. 일부 지역별 도서 조회는 앱이 제공업체 API에 안정적으로 접근할 수 있도록 당사의 Cloudflare Worker 메타데이터 프록시를 통해 라우팅됩니다. 개인 서재 내용, 메모, 평가 및 독서 진행 상황은 이 목적을 위해 도서 메타데이터 제공업체로 전송되지 않습니다."},{"type":"h2","text":"6. 광고 및 추적"},{"type":"p","text":"무료 버전은 배너 및 전면 광고를 표시하기 위해 Google AdMob을 사용합니다. Google Mobile Ads SDK는 일반적인 위치를 추정하는 데 사용될 수 있는 IP 주소, 앱 실행·탭·광고 조회 등의 앱 및 광고 상호작용, 진단 및 성능 정보, 광고 식별자와 같은 기기 또는 계정 식별자를 자동으로 수집하고 공유할 수 있습니다. Google은 이 정보를 광고, 분석 및 사기 방지 목적으로 사용할 수 있습니다."},{"type":"p","text":"지역, 동의 선택 및 기기 권한에 따라 맞춤형 광고 또는 개인 맞춤이 아닌 광고·제한된 광고가 표시될 수 있습니다. 적용되는 광고 개인정보 보호 선택을 요청하고 저장하기 위해 Google User Messaging Platform(UMP)을 사용합니다. 동의 정보를 가져올 수 없거나 필요한 권한이 허용되지 않았거나 동의 절차가 실패하면 앱은 기본적으로 개인 맞춤이 아닌 광고를 요청합니다."},{"type":"p","text":"iOS에서는 맞춤형 광고 또는 광고 식별자 접근을 허용하기 전에 Apple의 App Tracking Transparency(ATT)를 사용합니다. 이 권한은 iOS 설정에서 변경할 수 있습니다. 지원되는 지역의 무료 사용자는 설정 > 개인정보 보호 및 법률 > 광고 개인정보 보호 옵션에서 Google 광고 선택을 검토하거나 변경할 수 있습니다. 제공 여부는 지역 및 법적 요구사항에 따라 달라집니다. Pro에서는 배너 및 전면 광고가 제거됩니다."},{"type":"p","html":"자세한 내용은 <a href=\"https://policies.google.com/privacy?hl=ko\" target=\"_blank\" rel=\"noopener noreferrer\">Google 개인정보처리방침</a>과 기기의 광고 및 개인정보 보호 설정을 확인하세요."},{"type":"h2","text":"7. 구매 및 Premium 기능"},{"type":"p","text":"선택적 구매, 구독 또는 Premium 접근은 Apple App Store 또는 Google Play에서 처리될 수 있습니다. 당사는 신용카드 정보를 받거나 저장하지 않습니다. 구매 상태는 로컬에 저장되거나 해당 스토어를 통해 확인될 수 있습니다."},{"type":"h2","text":"8. 백업 내보내기 및 가져오기"},{"type":"p","text":"Pro 사용자는 서재, 책장, 책, 독서 활동, 메모, 인용문, 목표, 설정 및 사용자 표지가 포함된 백업 파일을 내보내거나 가져올 수 있습니다. 내보내기는 사용자가 요청할 때 기기의 공유 창이나 파일 선택기를 통해서만 이루어집니다."},{"type":"p","text":"백업의 저장 또는 공유 위치는 사용자가 선택합니다. CAREO LIMITED는 파일을 받지 않습니다. 앱 밖에 저장된 사본은 사용자가 관리하며 앱을 삭제해도 지워지지 않습니다."},{"type":"h2","text":"9. 데이터 공유"},{"type":"p","text":"당사는 개인정보를 판매하지 않습니다. 기기에 로컬로 저장된 앱 콘텐츠는 CAREO LIMITED 서버와 공유되지 않습니다. 제한된 데이터는 본 정책에 설명된 경우에만 제3자 제공업체에 의해 처리될 수 있으며, 여기에는 메타데이터 조회 기능 사용 시 ISBN, 제목, 저자 또는 DOI와 같은 도서 조회 식별자가 포함됩니다."},{"type":"h2","text":"10. 법적 근거"},{"type":"ul","items":["요청한 기능과 앱 서비스를 제공하는 데 필요한 데이터를 처리합니다.","필요한 경우 맞춤 광고와 기기 권한에 대해 동의를 근거로 합니다.","법이 허용하는 범위에서 보안, 사기 방지 및 서비스 안정성을 위한 정당한 이익을 근거로 합니다."]},{"type":"h2","text":"11. 보관 및 삭제"},{"type":"p","text":"로컬 데이터는 해당 콘텐츠 또는 앱을 삭제할 때까지 보관됩니다. 기기 백업과 내보낸 파일은 기기, 클라우드 제공자 또는 선택한 저장 위치의 정책에 따릅니다. 광고, 구매 및 진단 기록은 Google, Apple 또는 Google Play가 각 정책에 따라 보관합니다."},{"type":"h2","text":"12. 사용자 권리"},{"type":"p","text":"지역에 따라 접근, 수정, 삭제, 제한, 반대, 데이터 사본 또는 동의 철회를 요청할 수 있습니다. 앱에서 콘텐츠를 관리하고 앱 삭제로 로컬 데이터를 제거하며 iOS 설정에서 ATT, 가능한 경우 앱에서 광고 선택을 변경할 수 있습니다. 당사에 문의하거나 영국 ICO를 포함한 관할 개인정보 감독기관에 민원을 제기할 수 있습니다."},{"type":"h2","text":"13. 데이터 보안"},{"type":"p","text":"당사는 해당되는 외부 통신에 HTTPS를 사용하고, 필요한 경우 일부 제공업체 API 요청을 서버 측 메타데이터 프록시를 통해 라우팅하며, 데이터 수집을 최소화하도록 앱을 설계합니다. 어떤 소프트웨어나 기기 환경도 절대적인 보안을 보장할 수는 없습니다."},{"type":"h2","text":"14. 아동 개인정보"},{"type":"p","text":"앱은 13세 미만 아동을 대상으로 하지 않습니다. 당사는 13세 미만 아동의 개인정보를 고의로 수집하지 않습니다. 아동이 개인정보를 제공했다고 생각되면 문의해 주세요."},{"type":"h2","text":"15. 국제 데이터 이전"},{"type":"p","text":"위 제공자는 제한된 데이터를 해외에서 처리할 수 있으며 각 약관에 따라 법에서 요구하는 이전 보호조치를 적용할 책임이 있습니다. 자세한 내용은 문의해 주세요."},{"type":"h2","text":"16. 문의"},{"type":"p","html":"<strong>개인정보처리자: CAREO LIMITED(영국)</strong><br>careolimited@gmail.com<br>제목: KitApp 개인정보 문의"},{"type":"h2","text":"17. 정책 업데이트"},{"type":"p","text":"기능, 제공자 또는 법적 요구사항이 변경되면 이 정책을 업데이트할 수 있습니다. 새 업데이트 날짜를 표시하며 새로운 동의가 필요한 경우 별도로 요청합니다."}],"pt":[{"type":"h1","text":"Política de Privacidade - Livroo"},{"type":"meta","html":"<strong>Última atualização:</strong> 25 de agosto de 2026<br><strong>App:</strong> Livroo<br><strong>Programador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"Livroo respeita a sua privacidade. Esta Política explica que informações podem ser tratadas, como são utilizadas e quais são os seus direitos ao usar a aplicação móvel em iOS e Android."},{"type":"h2","text":"1. Visão geral do tratamento de dados"},{"type":"p","text":"LivroLog foi concebida para manter os dados principais no seu dispositivo sempre que possível. Não vendemos dados pessoais e usamos serviços de terceiros apenas quando necessários para as funcionalidades descritas abaixo."},{"type":"h2","text":"2. Dados armazenados localmente"},{"type":"p","text":"A aplicação pode armazenar localmente no seu dispositivo dados relacionados com descoberta de livros, leitura de códigos de barras, gestão de biblioteca pessoal, progresso de leitura, notas, citações, avaliações, objetivos e estatísticas. Estes dados são usados para fornecer funcionalidades, lembrar preferências e suportar utilização offline quando disponível."},{"type":"p","text":"Os dados da app são guardados no espaço privado da aplicação. Conforme as definições do dispositivo, o sistema pode incluí-los numa cópia iCloud, Google Drive ou transferência entre dispositivos. Estas cópias são geridas pela Apple, Google e pelas definições do dispositivo."},{"type":"h2","text":"3. Câmara, fotografias, reconhecimento de texto e notificações"},{"type":"p","text":"Com a tua autorização, a app pode usar a câmara para ler códigos, tirar uma capa ou fotografar uma página e aceder a uma fotografia escolhida por ti. O reconhecimento de texto ocorre no dispositivo; a imagem e o texto reconhecido não são enviados aos servidores da CAREO LIMITED."},{"type":"p","text":"Se ativares lembretes de leitura, a app agenda notificações locais no dispositivo. A KitApp não utiliza um servidor push da CAREO LIMITED."},{"type":"h2","text":"4. Finalidades do tratamento"},{"type":"ul","items":["Fornecer as funcionalidades principais da aplicação","Lembrar preferências do utilizador","Suportar utilização offline quando disponível","Processar compras ou acesso Premium quando aplicável","Melhorar a estabilidade e prevenir abusos"]},{"type":"h2","text":"5. Serviços de terceiros"},{"type":"p","text":"A app pode usar os seguintes servicos ou fornecedores terceiros: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Biblioteca Nacional da Coreia (SEOJI), Deutsche Nationalbibliothek (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store e Google Play. Estes servicos funcionam segundo as suas proprias politicas de privacidade."},{"type":"p","text":"Quando digitaliza um codigo de barras ou pesquisa por ISBN, titulo, autor ou DOI, o termo de pesquisa relevante pode ser enviado a fornecedores de metadados de livros para obter titulo, autor, editora, imagem de capa, descricao e informacoes semelhantes. Algumas pesquisas regionais de livros sao encaminhadas atraves do nosso proxy de metadados Cloudflare Worker para que a app possa aceder de forma fiavel as APIs dos fornecedores. O conteudo da sua biblioteca pessoal, notas, avaliacoes e progresso de leitura nao sao enviados a fornecedores de metadados para este fim."},{"type":"h2","text":"6. Publicidade e rastreio"},{"type":"p","text":"A versão gratuita utiliza o Google AdMob para apresentar banners e anúncios intersticiais. O SDK Google Mobile Ads pode recolher e partilhar automaticamente o endereço IP (que pode ser utilizado para estimar a localização geral), interações com a app e os anúncios, como aberturas, toques e visualizações, informações de diagnóstico e desempenho e identificadores do dispositivo ou da conta, como identificadores de publicidade. A Google pode utilizar estas informações para publicidade, análise e prevenção de fraude."},{"type":"p","text":"Consoante a sua região, escolhas de consentimento e permissões do dispositivo, os anúncios podem ser personalizados ou não personalizados/limitados. Utilizamos a User Messaging Platform (UMP) da Google para solicitar e guardar as escolhas de privacidade publicitária aplicáveis. Se não for possível obter as informações de consentimento, uma permissão necessária não for concedida ou o processo falhar, a app solicita anúncios não personalizados por predefinição."},{"type":"p","text":"No iOS, a app utiliza a App Tracking Transparency (ATT) da Apple antes de permitir publicidade personalizada ou acesso ao identificador de publicidade. Pode alterar esta permissão nas Definições do iOS. Quando disponível, os utilizadores da versão gratuita podem rever ou alterar as escolhas de publicidade da Google em Definições > Privacidade e aspetos legais > Opções de privacidade dos anúncios. A disponibilidade depende da região e dos requisitos legais. A versão Pro remove banners e anúncios intersticiais."},{"type":"p","html":"Para mais informações, consulte a <a href=\"https://policies.google.com/privacy?hl=pt-PT\" target=\"_blank\" rel=\"noopener noreferrer\">Política de Privacidade da Google</a> e as definições de publicidade e privacidade do seu dispositivo."},{"type":"h2","text":"7. Compras e funcionalidades Premium"},{"type":"p","text":"Compras, subscrições ou acesso Premium opcionais podem ser processados pela Apple App Store ou Google Play. Não recebemos nem armazenamos dados de cartão de crédito. O estado da compra pode ser guardado localmente ou verificado através da loja relevante."},{"type":"h2","text":"8. Exportação e importação de cópias"},{"type":"p","text":"Os utilizadores Pro podem exportar ou importar um ficheiro com bibliotecas, prateleiras, livros, atividade de leitura, notas, citações, objetivos, definições e capas personalizadas. A exportação só ocorre quando pedida, através da partilha ou seleção de ficheiros."},{"type":"p","text":"Escolhes onde guardar ou partilhar a cópia. A CAREO LIMITED não recebe o ficheiro. Cópias fora da app ficam sob o teu controlo e não são apagadas ao remover a app."},{"type":"h2","text":"9. Partilha de dados"},{"type":"p","text":"Nao vendemos dados pessoais. O conteudo da app guardado localmente nao e partilhado com servidores da CAREO LIMITED. Dados limitados podem ser tratados por fornecedores terceiros apenas conforme descrito nesta Politica, incluindo identificadores de pesquisa de livros como ISBN, titulo, autor ou DOI quando usa funcionalidades de pesquisa de metadados."},{"type":"h2","text":"10. Bases legais"},{"type":"ul","items":["Tratamos os dados necessários para fornecer as funções pedidas e o serviço da app.","Baseamo-nos no consentimento quando exigido para publicidade personalizada e permissões do dispositivo.","Quando permitido, baseamo-nos no interesse legítimo para segurança, prevenção de fraude e fiabilidade."]},{"type":"h2","text":"11. Retenção e eliminação"},{"type":"p","text":"Os dados locais permanecem até eliminares o conteúdo ou a app. As cópias do dispositivo e ficheiros exportados seguem as regras do dispositivo, fornecedor cloud ou local escolhido. Google, Apple ou Google Play conservam dados de publicidade, compras e diagnóstico segundo as suas políticas."},{"type":"h2","text":"12. Direitos dos utilizadores"},{"type":"p","text":"Conforme o local, podes pedir acesso, correção, eliminação, limitação, oposição, uma cópia dos dados ou retirar o consentimento. Podes gerir conteúdo na app, apagar dados locais desinstalando-a, alterar ATT no iOS e as opções publicitárias disponíveis na app. Podes contactar-nos e reclamar à autoridade competente, incluindo a ICO britânica."},{"type":"h2","text":"13. Segurança dos dados"},{"type":"p","text":"Usamos HTTPS para comunicações externas quando aplicável, encaminhamos alguns pedidos de API de fornecedores através de um proxy de metadados do lado do servidor quando necessário e concebemos as nossas apps para minimizar a recolha de dados. Nenhum software ou ambiente de dispositivo pode garantir segurança absoluta."},{"type":"h2","text":"14. Privacidade das crianças"},{"type":"p","text":"A app não se destina a crianças menores de 13 anos. Não recolhemos conscientemente dados pessoais de crianças menores de 13 anos. Se acredita que uma criança forneceu dados pessoais, contacte-nos."},{"type":"h2","text":"15. Transferências internacionais"},{"type":"p","text":"Os fornecedores indicados podem tratar dados limitados fora do teu país e devem aplicar as garantias legais de transferência segundo os seus termos. Contacta-nos para mais informações."},{"type":"h2","text":"16. Contacto"},{"type":"p","html":"<strong>Responsável pelo tratamento: CAREO LIMITED (Reino Unido)</strong><br>careolimited@gmail.com<br>Assunto: Pedido de privacidade KitApp"},{"type":"h2","text":"17. Atualizações da Política"},{"type":"p","text":"Podemos atualizar esta Política se mudarem funções, fornecedores ou leis. Mostraremos a nova data. Se for necessário novo consentimento, iremos pedi-lo separadamente."}],"ru":[{"type":"h1","text":"Политика конфиденциальности - Книгли"},{"type":"meta","html":"<strong>Последнее обновление:</strong> 25 августа 2026 г.<br><strong>Приложение:</strong> Книгли<br><strong>Разработчик / Издатель:</strong> CAREO LIMITED<br><strong>Контакт:</strong> careolimited@gmail.com"},{"type":"p","text":"Книгли уважает вашу конфиденциальность. Эта Политика объясняет, какие сведения могут обрабатываться, как они используются и какие права у вас есть при использовании мобильного приложения на iOS и Android."},{"type":"h2","text":"1. Обзор обработки данных"},{"type":"p","text":"Книгли разработано так, чтобы по возможности хранить основные данные приложения на вашем устройстве. Мы не продаем персональные данные и используем сторонние сервисы только там, где это необходимо для функций, описанных ниже."},{"type":"h2","text":"2. Локально хранимые данные"},{"type":"p","text":"Приложение может локально хранить на вашем устройстве данные, связанные с поиск книг, сканирование штрихкодов, управление личной библиотекой, прогресс чтения, заметки, цитаты, оценки, цели и статистику. Эти данные используются для работы функций приложения, сохранения настроек и поддержки офлайн-использования, если оно доступно."},{"type":"p","text":"Данные приложения хранятся в его закрытом хранилище. В зависимости от настроек устройства система может включить их в резервную копию iCloud, Google Drive или перенос между устройствами. Эти копии управляются Apple, Google и настройками устройства."},{"type":"h2","text":"3. Камера, фотографии, распознавание текста и уведомления"},{"type":"p","text":"С вашего разрешения приложение может использовать камеру для сканирования штрихкода, съёмки обложки или страницы и выбранную вами фотографию. Распознавание текста выполняется на устройстве; изображение и распознанный текст не отправляются на серверы CAREO LIMITED."},{"type":"p","text":"Если включить напоминания о чтении, приложение запланирует локальные уведомления на устройстве. KitApp не использует push-сервер CAREO LIMITED."},{"type":"h2","text":"4. Цели обработки"},{"type":"ul","items":["Предоставление основных функций приложения","Сохранение пользовательских настроек","Поддержка офлайн-использования, если доступно","Обработка покупок или доступа Premium, если применимо","Повышение стабильности и предотвращение злоупотреблений"]},{"type":"h2","text":"5. Сторонние сервисы"},{"type":"p","text":"Приложение может использовать следующие сторонние сервисы или поставщиков: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Национальная библиотека Кореи (SEOJI), Немецкая национальная библиотека (DNB) SRU, Национальная библиотека Франции (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store и Google Play. Эти сервисы работают по собственным политикам конфиденциальности."},{"type":"p","text":"Когда вы сканируете штрихкод или выполняете поиск по ISBN, названию, автору или DOI, соответствующий поисковый запрос может быть отправлен поставщикам книжных метаданных для получения названия, автора, издателя, изображения обложки, описания и похожей информации о книге. Некоторые региональные запросы книг направляются через наш прокси метаданных Cloudflare Worker, чтобы приложение могло надежно обращаться к API поставщиков. Содержимое вашей личной библиотеки, заметки, оценки и прогресс чтения не отправляются поставщикам книжных метаданных для этой цели."},{"type":"h2","text":"6. Реклама и отслеживание"},{"type":"p","text":"В бесплатной версии для показа баннерной и полноэкранной рекламы используется Google AdMob. Google Mobile Ads SDK может автоматически собирать и передавать IP-адрес (который может использоваться для определения примерного местоположения), сведения о взаимодействиях с приложением и рекламой, включая запуски приложения, нажатия и просмотры рекламы, диагностические данные и данные о производительности, а также идентификаторы устройства или аккаунта, например рекламные идентификаторы. Google может использовать эти сведения для рекламы, аналитики и предотвращения мошенничества."},{"type":"p","text":"В зависимости от региона, выбранных вариантов согласия и разрешений устройства реклама может быть персонализированной или неперсонализированной/ограниченной. Мы используем Google User Messaging Platform (UMP), чтобы запрашивать и сохранять применимые настройки конфиденциальности рекламы. Если сведения о согласии получить невозможно, необходимое разрешение не предоставлено или процесс завершается с ошибкой, приложение по умолчанию запрашивает неперсонализированную рекламу."},{"type":"p","text":"На iOS приложение использует Apple App Tracking Transparency (ATT), прежде чем разрешить персонализированную рекламу или доступ к рекламному идентификатору. Разрешение можно изменить в настройках iOS. Там, где функция доступна, пользователи бесплатной версии могут просматривать или изменять настройки рекламы Google по пути Настройки > Конфиденциальность и юридическая информация > Настройки конфиденциальности рекламы. Доступность зависит от региона и требований законодательства. Pro удаляет баннерную и полноэкранную рекламу."},{"type":"p","html":"Подробнее см. в <a href=\"https://policies.google.com/privacy?hl=ru\" target=\"_blank\" rel=\"noopener noreferrer\">Политике конфиденциальности Google</a> и настройках рекламы и конфиденциальности вашего устройства."},{"type":"h2","text":"7. Покупки и функции Premium"},{"type":"p","text":"Необязательные покупки, подписки или доступ Premium могут обрабатываться Apple App Store или Google Play. Мы не получаем и не храним данные кредитных карт. Статус покупки может храниться локально или проверяться через соответствующий магазин."},{"type":"h2","text":"8. Экспорт и импорт резервных копий"},{"type":"p","text":"Пользователи Pro могут экспортировать или импортировать файл с библиотеками, полками, книгами, активностью чтения, заметками, цитатами, целями, настройками и своими обложками. Экспорт выполняется только по вашему запросу через меню отправки или выбор файла."},{"type":"p","text":"Вы сами выбираете место сохранения или получателя. CAREO LIMITED не получает файл. Копии вне приложения остаются под вашим контролем и не удаляются вместе с приложением."},{"type":"h2","text":"9. Передача данных"},{"type":"p","text":"Мы не продаем персональные данные. Локально сохраненное содержимое приложения не передается на серверы CAREO LIMITED. Ограниченные данные могут обрабатываться сторонними поставщиками только как описано в этой Политике, включая идентификаторы поиска книг, такие как ISBN, название, автор или DOI, при использовании функций поиска метаданных."},{"type":"h2","text":"10. Правовые основания"},{"type":"ul","items":["Мы обрабатываем данные, необходимые для запрошенных функций и работы приложения.","Когда требуется, мы основываем персонализированную рекламу и разрешения устройства на вашем согласии.","Где это разрешено, мы опираемся на законные интересы для безопасности, предотвращения мошенничества и надежности."]},{"type":"h2","text":"11. Хранение и удаление"},{"type":"p","text":"Локальные данные хранятся до удаления соответствующего содержимого или приложения. Резервные копии устройства и экспортированные файлы подчиняются правилам устройства, облачного провайдера или выбранного места. Google, Apple или Google Play хранят рекламные, покупочные и диагностические данные по своим правилам."},{"type":"h2","text":"12. Права пользователя"},{"type":"p","text":"В зависимости от страны вы можете запросить доступ, исправление, удаление, ограничение, возражение, копию данных или отозвать согласие. Содержимым можно управлять в приложении, локальные данные удалить вместе с приложением, ATT изменить в настройках iOS, а доступные рекламные настройки — в приложении. Можно обратиться к нам или в надзорный орган, включая британский ICO."},{"type":"h2","text":"13. Безопасность данных"},{"type":"p","text":"Мы используем HTTPS для внешних соединений, где это применимо, при необходимости направляем некоторые запросы к API поставщиков через серверный прокси метаданных и проектируем приложения так, чтобы минимизировать сбор данных. Ни одна программная или аппаратная среда не может гарантировать абсолютную безопасность."},{"type":"h2","text":"14. Конфиденциальность детей"},{"type":"p","text":"Приложение не предназначено для детей младше 13 лет. Мы сознательно не собираем персональные данные детей младше 13 лет. Если вы считаете, что ребенок предоставил персональные данные, свяжитесь с нами."},{"type":"h2","text":"15. Международная передача данных"},{"type":"p","text":"Указанные поставщики могут обрабатывать ограниченные данные за пределами вашей страны и обязаны применять предусмотренные законом гарантии передачи по своим условиям. За подробностями обратитесь к нам."},{"type":"h2","text":"16. Контакты"},{"type":"p","html":"<strong>Оператор данных: CAREO LIMITED (Великобритания)</strong><br>careolimited@gmail.com<br>Тема: Запрос о конфиденциальности KitApp"},{"type":"h2","text":"17. Обновления Политики"},{"type":"p","text":"Мы можем обновлять Политику при изменении функций, поставщиков или закона. Будет указана новая дата. Если потребуется новое согласие, мы запросим его отдельно."}],"es":[{"type":"h1","text":"Política de privacidad - Libroo"},{"type":"meta","html":"<strong>Última actualización:</strong> 25 de agosto de 2026<br><strong>App:</strong> Libroo<br><strong>Desarrollador / Editor:</strong> CAREO LIMITED<br><strong>Contacto:</strong> careolimited@gmail.com"},{"type":"p","text":"Libroo respeta tu privacidad. Esta Política explica qué información puede procesarse, cómo se utiliza y cuáles son tus derechos al usar la aplicación móvil en iOS y Android."},{"type":"h2","text":"1. Resumen del procesamiento de datos"},{"type":"p","text":"Libroo está diseñada para mantener los datos principales en tu dispositivo cuando sea posible. No vendemos datos personales y usamos servicios de terceros solo cuando son necesarios para las funciones descritas abajo."},{"type":"h2","text":"2. Datos almacenados localmente"},{"type":"p","text":"La app puede almacenar localmente en tu dispositivo datos relacionados con descubrimiento de libros, escaneo de códigos de barras, gestión de biblioteca personal, progreso de lectura, notas, citas, calificaciones, objetivos y estadísticas. Estos datos se usan para ofrecer funciones, recordar preferencias y permitir el uso sin conexión cuando esté disponible."},{"type":"p","text":"Los datos de la app se guardan en su almacenamiento privado. Según los ajustes del dispositivo, el sistema puede incluirlos en una copia de iCloud, Google Drive o una transferencia entre dispositivos. Estas copias son gestionadas por Apple, Google y los ajustes del dispositivo."},{"type":"h2","text":"3. Cámara, fotos, reconocimiento de texto y notificaciones"},{"type":"p","text":"Con tu permiso, la app puede usar la cámara para escanear códigos, tomar una portada o fotografiar una página y acceder a una foto que elijas. El reconocimiento de texto se realiza en el dispositivo; la imagen y el texto reconocido no se envían a servidores de CAREO LIMITED."},{"type":"p","text":"Si activas recordatorios de lectura, la app programa notificaciones locales en tu dispositivo. KitApp no usa un servidor push de CAREO LIMITED."},{"type":"h2","text":"4. Finalidades del procesamiento"},{"type":"ul","items":["Proporcionar las funciones principales de la app","Recordar preferencias del usuario","Permitir uso sin conexión cuando esté disponible","Procesar compras o acceso Premium cuando corresponda","Mejorar la estabilidad y prevenir abusos"]},{"type":"h2","text":"5. Servicios de terceros"},{"type":"p","text":"La app puede usar los siguientes servicios o proveedores de terceros: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Biblioteca Nacional de Corea (SEOJI), Deutsche Nationalbibliothek (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store y Google Play. Estos servicios operan bajo sus propias politicas de privacidad."},{"type":"p","text":"Cuando escaneas un codigo de barras o buscas por ISBN, titulo, autor o DOI, el termino de busqueda correspondiente puede enviarse a proveedores de metadatos de libros para obtener titulo, autor, editorial, imagen de portada, descripcion e informacion similar. Algunas busquedas regionales de libros se enrutan a traves de nuestro proxy de metadatos Cloudflare Worker para que la app pueda acceder de forma fiable a las API de los proveedores. El contenido de tu biblioteca personal, notas, calificaciones y progreso de lectura no se envia a proveedores de metadatos para este fin."},{"type":"h2","text":"6. Publicidad y seguimiento"},{"type":"p","text":"La versión gratuita utiliza Google AdMob para mostrar banners y anuncios intersticiales. El SDK de Google Mobile Ads puede recopilar y compartir automáticamente la dirección IP (que puede utilizarse para estimar la ubicación general), interacciones con la app y los anuncios como inicios, pulsaciones y visualizaciones, información de diagnóstico y rendimiento, e identificadores del dispositivo o de la cuenta, como identificadores publicitarios. Google puede usar esta información para publicidad, análisis y prevención del fraude."},{"type":"p","text":"Según tu región, tus opciones de consentimiento y los permisos del dispositivo, los anuncios pueden ser personalizados o no personalizados/limitados. Usamos la User Messaging Platform (UMP) de Google para solicitar y guardar las opciones de privacidad publicitaria aplicables. Si no se puede obtener la información de consentimiento, no se concede un permiso necesario o el proceso falla, la app solicita de forma predeterminada anuncios no personalizados."},{"type":"p","text":"En iOS, la app utiliza App Tracking Transparency (ATT) de Apple antes de permitir publicidad personalizada o el acceso al identificador publicitario. Puedes cambiar este permiso en los ajustes de iOS. Cuando esté disponible, los usuarios gratuitos pueden revisar o cambiar sus opciones de publicidad de Google en Ajustes > Privacidad y aspectos legales > Opciones de privacidad de anuncios. La disponibilidad depende de la región y de los requisitos legales. Pro elimina los banners y anuncios intersticiales."},{"type":"p","html":"Para más información, consulta la <a href=\"https://policies.google.com/privacy?hl=es\" target=\"_blank\" rel=\"noopener noreferrer\">Política de Privacidad de Google</a> y los ajustes de publicidad y privacidad de tu dispositivo."},{"type":"h2","text":"7. Compras y funciones Premium"},{"type":"p","text":"Las compras, suscripciones o accesos Premium opcionales pueden ser procesados por Apple App Store o Google Play. No recibimos ni almacenamos datos de tarjetas de crédito. El estado de compra puede guardarse localmente o verificarse mediante la tienda correspondiente."},{"type":"h2","text":"8. Exportación e importación de copias"},{"type":"p","text":"Los usuarios Pro pueden exportar o importar un archivo con bibliotecas, estanterías, libros, actividad de lectura, notas, citas, objetivos, ajustes y portadas personalizadas. La exportación solo ocurre cuando la solicitas mediante el menú de compartir o el selector de archivos."},{"type":"p","text":"Tú eliges dónde guardar o compartir la copia. CAREO LIMITED no recibe el archivo. Las copias fuera de la app quedan bajo tu control y no se borran al eliminar la app."},{"type":"h2","text":"9. Compartición de datos"},{"type":"p","text":"No vendemos datos personales. El contenido almacenado localmente no se comparte con servidores de CAREO LIMITED. Datos limitados pueden ser procesados por proveedores terceros solo como se describe en esta Politica, incluidos identificadores de busqueda de libros como ISBN, titulo, autor o DOI cuando usas funciones de busqueda de metadatos."},{"type":"h2","text":"10. Bases legales"},{"type":"ul","items":["Tratamos los datos necesarios para ofrecer las funciones solicitadas y el servicio de la app.","Nos basamos en el consentimiento cuando se requiere para publicidad personalizada y permisos del dispositivo.","Cuando la ley lo permite, usamos el interés legítimo para seguridad, prevención del fraude y fiabilidad."]},{"type":"h2","text":"11. Conservación y eliminación"},{"type":"p","text":"Los datos locales permanecen hasta que elimines el contenido o la app. Las copias del dispositivo y los archivos exportados siguen las reglas del dispositivo, proveedor cloud o ubicación elegida. Google, Apple o Google Play conservan datos publicitarios, de compra y diagnóstico según sus políticas."},{"type":"h2","text":"12. Derechos del usuario"},{"type":"p","text":"Según tu ubicación, puedes pedir acceso, rectificación, eliminación, limitación, oposición, una copia de los datos o retirar el consentimiento. Puedes gestionar el contenido en la app, borrar los datos locales desinstalándola, cambiar ATT en iOS y las opciones publicitarias disponibles en la app. Puedes contactarnos y reclamar ante tu autoridad de protección de datos, incluida la ICO británica."},{"type":"h2","text":"13. Seguridad de datos"},{"type":"p","text":"Usamos HTTPS para comunicaciones externas cuando corresponde, enrutamos algunas solicitudes API de proveedores mediante un proxy de metadatos del lado del servidor cuando es necesario y diseñamos nuestras apps para minimizar la recopilación de datos. Ningún software o dispositivo puede garantizar seguridad absoluta."},{"type":"h2","text":"14. Privacidad de menores"},{"type":"p","text":"La app no está dirigida a menores de 13 años. No recopilamos conscientemente datos personales de menores de 13 años. Si crees que un menor proporcionó datos personales, contáctanos."},{"type":"h2","text":"15. Transferencias internacionales"},{"type":"p","text":"Los proveedores indicados pueden tratar datos limitados fuera de tu país y deben aplicar las garantías legales de transferencia conforme a sus condiciones. Contáctanos para más información."},{"type":"h2","text":"16. Contacto"},{"type":"p","html":"<strong>Responsable del tratamiento: CAREO LIMITED (Reino Unido)</strong><br>careolimited@gmail.com<br>Asunto: Solicitud de privacidad de KitApp"},{"type":"h2","text":"17. Actualizaciones de la Política"},{"type":"p","text":"Podemos actualizar esta Política si cambian las funciones, proveedores o normas. Mostraremos la nueva fecha. Si se necesita un nuevo consentimiento, lo solicitaremos por separado."}],"tr":[{"type":"h1","text":"Gizlilik Politikası - KitApp"},{"type":"meta","html":"<strong>Son güncelleme:</strong> 25 Ağustos 2026<br><strong>Uygulama:</strong> KitApp<br><strong>Geliştirici / Yayıncı:</strong> CAREO LIMITED<br><strong>İletişim:</strong> careolimited@gmail.com"},{"type":"p","text":"KitApp gizliliğinize saygı duyar. Bu Politika, iOS ve Android mobil uygulamasını kullanırken hangi bilgilerin işlenebileceğini, nasıl kullanıldığını ve haklarınızı açıklar."},{"type":"h2","text":"1. Veri İşleme Özeti"},{"type":"p","text":"KitApp, temel uygulama verilerini mümkün olduğunda cihazınızda tutacak şekilde tasarlanmıştır. Kişisel verileri satmayız ve üçüncü taraf hizmetleri yalnızca aşağıda açıklanan özellikler için gerekli olduğunda kullanırız."},{"type":"h2","text":"2. Yerel Olarak Saklanan Veriler"},{"type":"p","text":"Uygulama, kitap keşfi, barkod tarama, kişisel kütüphane yönetimi, okuma ilerlemesi, notlar, alıntılar, puanlar, hedefler ve istatistikler ile ilgili verileri cihazınızda yerel olarak saklayabilir. Bu veriler uygulama özelliklerini sunmak, tercihleri hatırlamak ve varsa çevrimdışı kullanımı desteklemek için kullanılır."},{"type":"p","text":"Uygulama verileri uygulamanın özel saklama alanında tutulur. Cihaz ayarlarınıza bağlı olarak işletim sistemi bu verileri iCloud, Google Drive veya cihazdan cihaza aktarma yedeğine dahil edebilir. Bu yedekler Apple, Google ve cihaz ayarlarınız tarafından yönetilir."},{"type":"h2","text":"3. Kamera, Fotoğraflar, Metin Tarama ve Bildirimler"},{"type":"p","text":"İzin vermeniz halinde uygulama; kitap barkodu taramak, özel kapak çekmek veya bir sayfayı görüntülemek için kamerayı, kapak ya da alıntı taraması için seçtiğiniz fotoğrafı kullanabilir. Alıntı taramasındaki metin tanıma cihaz üzerinde yapılır; seçilen görsel ve tanınan metin CAREO LIMITED sunucularına gönderilmez."},{"type":"p","text":"Okuma hatırlatmalarını açarsanız uygulama cihazınızda yerel bildirimler planlar. KitApp, CAREO LIMITED’a ait bir anlık bildirim sunucusu kullanmaz."},{"type":"h2","text":"4. İşleme Amaçları"},{"type":"ul","items":["Temel uygulama özelliklerini sunmak","Kullanıcı tercihlerini hatırlamak","Varsa çevrimdışı kullanımı desteklemek","Uygunsa satın alma veya Premium erişimi işlemek","Kararlılığı artırmak ve kötüye kullanımı önlemek"]},{"type":"h2","text":"5. Üçüncü Taraf Hizmetler"},{"type":"p","text":"Uygulama şu üçüncü taraf hizmetleri veya sağlayıcıları kullanabilir: Google Books API, Open Library API, OpenAlex, Crossref, openBD, NDL Search, Rakuten Books API, Naver Search API, Kakao Book Search API, Kore Ulusal Kütüphanesi (SEOJI), Alman Milli Kütüphanesi (DNB) SRU, Bibliotheque nationale de France (BnF) SRU, Cloudflare Workers, Google AdMob, Apple App Store ve Google Play. Bu hizmetler kendi gizlilik politikalarına göre çalışır."},{"type":"p","text":"Bir barkod taradığınızda veya ISBN, başlık, yazar ya da DOI ile arama yaptığınızda, ilgili arama terimi kitap başlığı, yazar, yayınev
