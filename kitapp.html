i, kapak görseli, açıklama ve benzeri kitap bilgilerini almak için kitap metadata sağlayıcılarına gönderilebilir. Bazı bölgesel kitap sorguları, uygulamanın sağlayıcı API’lerine güvenilir şekilde erişebilmesi için Cloudflare Worker metadata proxy’miz üzerinden yönlendirilir. Kişisel kütüphaneniz, notlarınız, puanlarınız ve okuma ilerlemeniz bu amaçla kitap metadata sağlayıcılarına gönderilmez."},{"type":"h2","text":"6. Reklam ve Takip"},{"type":"p","text":"Ücretsiz sürümde banner ve geçiş reklamları göstermek için Google AdMob kullanılır. Google Mobile Ads SDK; genel konumu tahmin etmek için kullanılabilecek IP adresini, uygulama açılışları, dokunmalar ve reklam görüntülemeleri gibi uygulama ve reklam etkileşimlerini, tanılama ve performans bilgilerini ve reklam tanımlayıcıları gibi cihaz veya hesap tanımlayıcılarını otomatik olarak toplayabilir ve paylaşabilir. Google bu bilgileri reklam, analiz ve sahtekârlığı önleme amaçlarıyla kullanabilir."},{"type":"p","text":"Bölgenize, izin tercihlerinize ve cihaz izinlerine bağlı olarak kişiselleştirilmiş veya kişiselleştirilmemiş/sınırlı reklamlar gösterilebilir. Geçerli reklam gizliliği tercihlerini istemek ve saklamak için Google User Messaging Platform (UMP) kullanırız. İzin bilgileri alınamazsa, gerekli bir izin verilmezse veya izin akışı başarısız olursa uygulama varsayılan olarak kişiselleştirilmemiş reklam ister."},{"type":"p","text":"iOS’ta uygulama, kişiselleştirilmiş reklama veya reklam tanımlayıcısına erişime izin vermeden önce Apple App Tracking Transparency (ATT) sistemini kullanır. Bu izni iOS Ayarları’ndan değiştirebilirsiniz. Kullanılabildiği bölgelerde ücretsiz kullanıcılar Ayarlar > Gizlilik ve Yasal > Reklam Gizliliği Seçenekleri yolundan Google reklam tercihlerini inceleyebilir veya değiştirebilir. Kullanılabilirlik bölgeye ve yasal gerekliliklere bağlıdır. Pro, banner ve geçiş reklamlarını kaldırır."},{"type":"p","html":"Daha fazla bilgi için <a href=\"https://policies.google.com/privacy?hl=tr\" target=\"_blank\" rel=\"noopener noreferrer\">Google Gizlilik Politikası</a> ile cihazınızın reklam ve gizlilik ayarlarını inceleyin."},{"type":"h2","text":"7. Satın Almalar ve Premium Özellikler"},{"type":"p","text":"İsteğe bağlı satın almalar, abonelikler veya Premium erişim Apple App Store ya da Google Play tarafından işlenebilir. Kredi kartı bilgilerini almayız veya saklamayız. Satın alma durumu yerel olarak saklanabilir veya ilgili mağaza üzerinden doğrulanabilir."},{"type":"h2","text":"8. Yedeği Dışa ve İçe Aktarma"},{"type":"p","text":"Pro kullanıcıları; kütüphane, raf, kitap, okuma etkinliği, not, alıntı, hedef, ayar ve özel kapakları içeren bir yedek dosyasını dışa veya içe aktarabilir. Dışa aktarma yalnızca sizin isteğinizle ve cihazın paylaşım ekranı ya da dosya seçicisi üzerinden yapılır."},{"type":"p","text":"Dışa aktarılan yedeğin nereye kaydedileceğini veya gönderileceğini siz seçersiniz. CAREO LIMITED dosyayı almaz. Uygulama dışında saklanan kopyalar sizin kontrolünüzdedir ve uygulamayı silmeniz bu kopyaları silmez."},{"type":"h2","text":"9. Veri Paylaşımı"},{"type":"p","text":"Kişisel verileri satmayız. Yerel olarak saklanan uygulama içeriği CAREO LIMITED sunucularıyla paylaşılmaz. Sınırlı veriler yalnızca bu Politikada açıklandığı şekilde üçüncü taraf sağlayıcılar tarafından işlenebilir; buna metadata arama özelliklerini kullandığınızda ISBN, başlık, yazar veya DOI gibi kitap arama tanımlayıcıları dahildir."},{"type":"h2","text":"10. Hukuki Dayanaklar"},{"type":"ul","items":["İstediğiniz özellikleri ve uygulama hizmetini sunmak için gerekli verileri işleriz.","Kişiselleştirilmiş reklamlar ve cihaz izinleri için gerektiğinde rızanıza dayanırız.","Kanunun izin verdiği ölçüde güvenlik, sahtekârlığı önleme ve hizmet güvenilirliği için meşru menfaatlerimize dayanırız."]},{"type":"h2","text":"11. Saklama ve Silme"},{"type":"p","text":"Yerel veriler, ilgili içeriği silene veya uygulamayı kaldırana kadar saklanır. Cihaz yedekleri ve dışa aktarılan yedek dosyaları cihazınızın, bulut sağlayıcınızın veya seçtiğiniz saklama alanının kurallarına göre kalabilir. Reklam, satın alma ve tanılama kayıtları Google, Apple veya Google Play tarafından kendi politikalarına göre saklanır."},{"type":"h2","text":"12. Kullanıcı Hakları"},{"type":"p","text":"Bulunduğunuz yere bağlı olarak kişisel verilere erişme, düzeltme, silme, işlemeyi sınırlandırma, itiraz etme, verilerin bir kopyasını alma ve rızayı geri çekme haklarınız olabilir. Yerel içeriği uygulamadan yönetebilir, uygulamayı kaldırarak silebilir, ATT iznini iOS Ayarları’ndan ve kullanılabildiğinde reklam tercihlerini uygulamadaki Reklam Gizliliği Seçenekleri’nden değiştirebilirsiniz. Gizlilik talepleri için bize ulaşabilir ve Birleşik Krallık Bilgi Komiserliği Ofisi (ICO) dahil yetkili veri koruma makamına şikâyette bulunabilirsiniz."},{"type":"h2","text":"13. Veri Güvenliği"},{"type":"p","text":"Uygun durumlarda harici iletişim için HTTPS kullanırız, gerekli olduğunda bazı sağlayıcı API isteklerini sunucu taraflı metadata proxy üzerinden yönlendiririz ve uygulamalarımızı veri toplamayı azaltacak şekilde tasarlarız. Hiçbir yazılım veya cihaz ortamı mutlak güvenlik garanti edemez."},{"type":"h2","text":"14. Çocukların Gizliliği"},{"type":"p","text":"Uygulama 13 yaş altındaki çocuklara yönelik değildir. 13 yaş altındaki çocuklardan bilerek kişisel veri toplamayız. Bir çocuğun kişisel veri sağladığını düşünüyorsanız bizimle iletişime geçin."},{"type":"h2","text":"15. Uluslararası Veri Aktarımları"},{"type":"p","text":"Yukarıda belirtilen sağlayıcılar sınırlı verileri ülkeniz dışında işleyebilir. Sağlayıcılar, kendi gizlilik şartları kapsamında kanunen gerekli aktarım güvencelerini uygulamakla sorumludur. Geçerli güvenceler hakkında bilgi için bizimle iletişime geçebilirsiniz."},{"type":"h2","text":"16. İletişim"},{"type":"p","html":"<strong>Veri sorumlusu: CAREO LIMITED (Birleşik Krallık)</strong><br>careolimited@gmail.com<br>Konu: KitApp Gizlilik Talebi"},{"type":"h2","text":"17. Politika Güncellemeleri"},{"type":"p","text":"Uygulama özellikleri, sağlayıcılar veya yasal gereklilikler değişirse bu Politikayı güncelleyebiliriz. Yeni Son güncelleme tarihini gösteririz. Bir güncelleme yeni bir rıza gerektirirse bunu ayrıca isteriz."}]};
  const uiText = {"en": {"back": "← Back to CAREO LIMITED", "privacy": "Privacy Policy", "last": "Last updated", "app": "App", "dev": "Developer / Publisher", "contact": "Contact", "lang": "Language"}, "fr": {"back": "← Retour à CAREO LIMITED", "privacy": "Politique de confidentialité", "last": "Dernière mise à jour", "app": "App", "dev": "Développeur / Éditeur", "contact": "Contact", "lang": "Langue"}, "de": {"back": "← Zurück zu CAREO LIMITED", "privacy": "Datenschutzerklärung", "last": "Letzte Aktualisierung", "app": "App", "dev": "Entwickler / Herausgeber", "contact": "Kontakt", "lang": "Sprache"}, "it": {"back": "← Torna a CAREO LIMITED", "privacy": "Informativa sulla privacy", "last": "Ultimo aggiornamento", "app": "App", "dev": "Sviluppatore / Editore", "contact": "Contatto", "lang": "Lingua"}, "ja": {"back": "← CAREO LIMITEDに戻る", "privacy": "プライバシーポリシー", "last": "最終更新", "app": "アプリ", "dev": "開発者 / 発行者", "contact": "連絡先", "lang": "言語"}, "ko": {"back": "← CAREO LIMITED로 돌아가기", "privacy": "개인정보 처리방침", "last": "마지막 업데이트", "app": "앱", "dev": "개발자 / 게시자", "contact": "문의", "lang": "언어"}, "pt": {"back": "← Voltar para CAREO LIMITED", "privacy": "Política de Privacidade", "last": "Última atualização", "app": "App", "dev": "Programador / Editor", "contact": "Contacto", "lang": "Idioma"}, "ru": {"back": "← Назад к CAREO LIMITED", "privacy": "Политика конфиденциальности", "last": "Последнее обновление", "app": "Приложение", "dev": "Разработчик / Издатель", "contact": "Контакт", "lang": "Язык"}, "es": {"back": "← Volver a CAREO LIMITED", "privacy": "Política de privacidad", "last": "Última actualización", "app": "App", "dev": "Desarrollador / Editor", "contact": "Contacto", "lang": "Idioma"}, "tr": {"back": "← CAREO LIMITED’a dön", "privacy": "Gizlilik Politikası", "last": "Son güncelleme", "app": "Uygulama", "dev": "Geliştirici / Yayıncı", "contact": "İletişim", "lang": "Dil"}};
  const homeLabels = { en:"← Home", fr:"← Accueil", de:"← Startseite", it:"← Home", ja:"← ホーム", ko:"← 홈", pt:"← Início", ru:"← Главная", es:"← Inicio", tr:"← Ana Sayfa" };
  const languageSelect = document.getElementById("languageSelect");
  const policyContent = document.getElementById("policyContent");
  const backLink = document.getElementById("backLink");
  const params = new URLSearchParams(window.location.search);
  const initialLanguage = params.get("lang") || localStorage.getItem("careo-language") || "en";
  function renderPolicy(language) {
    const selected = policyData[language] || policyData.en;
    const ui = uiText[language] || uiText.en;
    document.documentElement.lang = language;
    languageSelect.value = language;
    backLink.textContent = homeLabels[language] || homeLabels.en;
    backLink.href = `../index.html?lang=${encodeURIComponent(language)}`;
    policyContent.innerHTML = "";
    selected.forEach((block) => {
      if (block.type === "h1" || block.type === "h2") {
        const el = document.createElement(block.type); el.textContent = block.text; policyContent.appendChild(el);
      } else if (block.type === "p" || block.type === "meta") {
        const el = document.createElement("p"); if (block.type === "meta") el.className = "meta"; if (block.html) el.innerHTML = block.html; else el.textContent = block.text; policyContent.appendChild(el);
      } else if (block.type === "ul") {
        const ul = document.createElement("ul"); block.items.forEach((item) => { const li = document.createElement("li"); li.textContent = item; ul.appendChild(li); }); policyContent.appendChild(ul);
      }
    });
    document.title = `${selected[0].text} | CAREO LIMITED`;
    localStorage.setItem("careo-language", language);
    const url = new URL(window.location.href); url.searchParams.set("lang", language); window.history.replaceState(null, "", url.toString());
  }
  languageSelect.addEventListener("change", (event) => renderPolicy(event.target.value));
  renderPolicy(policyData[initialLanguage] ? initialLanguage : "en");
</script>
